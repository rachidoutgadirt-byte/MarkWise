<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartMark Pro | ZipGrade Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; overflow: hidden; }
        
        /* Bubble buttons in key editor */
        .bubble-btn { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #d1d5db; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; cursor: pointer; transition: 0.2s; background: white; color: #374151; }
        .bubble-btn.selected { background-color: #2563eb !important; color: white !important; border-color: #2563eb; transform: scale(1.1); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        /* Scanning Viewfinder */
        .target-frame { position: absolute; width: 65px; height: 65px; border: 6px solid rgba(255,255,255,0.2); border-radius: 14px; transition: 0.2s; z-index: 101; }
        .target-frame.detected { border-color: #10b981; background: rgba(16, 185, 129, 0.2); box-shadow: 0 0 25px #10b981; }
        .tf-tl { top: 10%; left: 8%; } .tf-tr { top: 10%; right: 8%; }
        .tf-bl { bottom: 18%; left: 8%; } .tf-br { bottom: 18%; right: 8%; }

        /* Answer Sheet Design (ZipGrade Style) */
        .sheet-page { width: 210mm; min-height: 297mm; padding: 15mm; background: white; position: relative; color: black; box-sizing: border-box; }
        .black-corner { position: absolute; width: 15mm; height: 15mm; background: black; }
        .c-tl { top: 10mm; left: 10mm; } .c-tr { top: 10mm; right: 10mm; }
        .c-bl { bottom: 10mm; left: 10mm; } .c-br { bottom: 10mm; right: 10mm; }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-900">

    <div id="sidebar-overlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/60 z-40 md:hidden opacity-0 pointer-events-none transition-opacity"></div>
    
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:relative inset-y-0 left-0 w-72 bg-slate-900 text-white flex flex-col z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
            <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-camera-retro"></i></div>
                <div><h1 class="text-xl font-black italic">SmartMark</h1><p class="text-[9px] text-slate-500 font-bold uppercase">ZipGrade Clone v9.0</p></div>
            </div>
            
            <nav class="flex-1 p-4 space-y-2 mt-4">
                <button onclick="switchTab('exams')" id="btn-exams" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl bg-blue-600 transition-all font-bold"><i class="fa-solid fa-folder-open"></i> Exams List</button>
                <button onclick="switchTab('create')" id="btn-create" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-slate-400 hover:bg-slate-800 transition-all font-bold"><i class="fa-solid fa-plus-circle"></i> Create New</button>
                <button onclick="switchTab('history')" id="btn-history" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-slate-400 hover:bg-slate-800 transition-all font-bold"><i class="fa-solid fa-chart-line"></i> Grading History</button>
            </nav>

            <div class="p-4 m-4 bg-slate-800/50 rounded-2xl border border-slate-700/50">
                <div id="cv-status" class="text-[10px] font-bold text-amber-400 flex items-center gap-2"><i class="fa-solid fa-spinner fa-spin"></i> Initializing OpenCV...</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-white">
            <header class="h-16 border-b px-6 flex items-center justify-between bg-white z-30">
                <button onclick="toggleSidebar(true)" class="md:hidden p-2 text-slate-600"><i class="fa-solid fa-bars"></i></button>
                <h2 id="tab-title" class="font-black text-slate-800 uppercase tracking-tighter">Exams Dashboard</h2>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-400">EN</span>
                    <div class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center"><i class="fa-solid fa-user text-slate-400"></i></div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8">
                <!-- Tab: Exams -->
                <section id="view-exams" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></section>
                
                <!-- Tab: Create/Edit -->
                <section id="view-create" class="hidden max-w-5xl mx-auto pb-20">
                    <div class="bg-white rounded-[40px] border shadow-sm p-6 md:p-10 space-y-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <input type="hidden" id="edit-id">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase">Exam Name</label>
                                <input type="text" id="in-name" placeholder="Mathematics Final" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-blue-500 outline-none font-bold">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase">Class/Level</label>
                                <input type="text" id="in-level" placeholder="Grade 10 - Section A" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-blue-500 outline-none font-bold">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase">Total Questions</label>
                                <input type="number" id="in-q" value="20" onchange="updateKeyGrid()" class="w-full p-4 bg-slate-50 rounded-2xl font-black border-2 border-transparent focus:border-blue-500 outline-none">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase">Options per Question</label>
                                <select id="in-o" onchange="updateKeyGrid()" class="w-full p-4 bg-slate-50 rounded-2xl font-black border-2 border-transparent focus:border-blue-500 outline-none">
                                    <option value="4">4 Options (A-D)</option>
                                    <option value="5">5 Options (A-E)</option>
                                    <option value="12">12 Options (A-L)</option>
                                </select>
                            </div>
                        </div>

                        <div class="bg-slate-900 rounded-[32px] p-6 shadow-2xl">
                            <h4 class="text-white font-black mb-6 flex items-center justify-between">
                                Answer Key & Weights
                                <span class="text-[10px] text-blue-400">Select correct answers & set points</span>
                            </h4>
                            <div id="key-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[450px] overflow-y-auto custom-scroll pr-2"></div>
                        </div>

                        <button onclick="saveExam()" id="save-btn" class="w-full bg-blue-600 text-white py-6 rounded-3xl font-black text-xl shadow-xl shadow-blue-200 hover:bg-blue-700 transition-all">Save & Deploy Exam</button>
                    </div>
                </section>

                <!-- Tab: History -->
                <section id="view-history" class="hidden space-y-4 pb-20"></section>
            </div>
        </main>
    </div>

    <!-- Scanner Modal -->
    <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden overflow-hidden">
        <video id="video" class="w-full h-full object-cover" playsinline muted></video>
        
        <div id="f-tl" class="target-frame tf-tl"></div>
        <div id="f-tr" class="target-frame tf-tr"></div>
        <div id="f-bl" class="target-frame tf-bl"></div>
        <div id="f-br" class="target-frame tf-br"></div>

        <div class="absolute bottom-12 inset-x-0 flex flex-col items-center gap-6 z-[110]">
            <div id="status-msg" class="bg-black/80 backdrop-blur-md border border-white/10 text-white px-8 py-4 rounded-full text-xs font-black tracking-widest uppercase shadow-2xl">Align corners inside boxes</div>
            <button onclick="stopScanner()" class="w-16 h-16 bg-red-600 rounded-full text-white shadow-2xl"><i class="fa-solid fa-x"></i></button>
        </div>
        <canvas id="proc-canvas" class="hidden"></canvas>
    </div>

    <!-- Result Popup -->
    <div id="res-popup" class="fixed inset-0 bg-slate-900/95 z-[200] hidden flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white rounded-[50px] p-10 max-w-lg w-full text-center shadow-2xl">
            <h3 class="font-black text-2xl text-slate-400 uppercase tracking-widest">Grading Result</h3>
            <div id="res-score" class="text-8xl font-black text-blue-600 my-6 italic">0 / 0</div>
            
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-slate-50 p-4 rounded-3xl border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Student Name Area</p>
                    <img id="res-name-img" class="h-16 mx-auto rounded-lg shadow-sm bg-white">
                </div>
                <div class="bg-slate-50 p-4 rounded-3xl border border-slate-100 flex flex-col items-center justify-center">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Full Scan View</p>
                    <button onclick="viewFullGraded()" class="text-blue-600 font-black text-sm"><i class="fa-solid fa-file-invoice"></i> View Graded</button>
                </div>
            </div>

            <div class="flex gap-4">
                <button onclick="closeResult()" class="flex-1 bg-blue-600 text-white py-5 rounded-3xl font-black text-lg shadow-xl shadow-blue-100 transition-all active:scale-95 italic">NEXT SCAN <i class="fa-solid fa-arrow-right ml-2"></i></button>
            </div>
        </div>
    </div>

    <!-- Sheet Preview -->
    <div id="preview-modal" class="fixed inset-0 bg-black/90 z-[250] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[40px] w-full max-w-4xl max-h-[95vh] overflow-hidden flex flex-col">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="font-black text-xl">Answer Sheet Preview</h3>
                <button onclick="document.getElementById('preview-modal').classList.add('hidden')" class="w-10 h-10 bg-slate-100 rounded-full text-red-500"><i class="fa-solid fa-x"></i></button>
            </div>
            <div id="preview-container" class="flex-1 overflow-auto bg-slate-800 p-8 flex justify-center"></div>
            <div class="p-6 border-t bg-slate-50 flex gap-4">
                <button id="final-download-btn" class="flex-1 bg-blue-600 text-white py-5 rounded-2xl font-black shadow-lg">DOWNLOAD PNG</button>
            </div>
        </div>
    </div>

    <div id="hidden-print-area" style="position:fixed; left:-9999px;"></div>

    <script>
        let db = {
            exams: JSON.parse(localStorage.getItem('sm_zip_exams') || '[]'),
            results: JSON.parse(localStorage.getItem('sm_zip_results') || '[]')
        };
        let isCvReady = false, scanActive = false, activeExam = null, stableFrames = 0;
        const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];

        function onOpenCvReady() {
            isCvReady = true;
            document.getElementById('cv-status').innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500"></i> AI Vision Ready';
            document.getElementById('cv-status').className = "text-[10px] font-bold text-emerald-500 flex items-center gap-2";
        }

        function toggleSidebar(state) {
            document.getElementById('sidebar').classList.toggle('-translate-x-full', !state);
            const overlay = document.getElementById('sidebar-overlay');
            overlay.style.opacity = state ? "1" : "0";
            overlay.style.pointerEvents = state ? "auto" : "none";
        }

        function switchTab(tab) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('view-' + tab).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.className = "w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-slate-400 hover:bg-slate-800 transition-all font-bold");
            document.getElementById('btn-' + tab).className = "w-full flex items-center gap-4 px-5 py-4 rounded-2xl bg-blue-600 text-white font-bold";
            if(tab === 'exams') renderExams();
            if(tab === 'history') renderHistory();
            if(tab === 'create' && !document.getElementById('edit-id').value) updateKeyGrid();
            if(window.innerWidth < 768) toggleSidebar(false);
        }

        function updateKeyGrid() {
            const q = parseInt(document.getElementById('in-q').value) || 0, o = parseInt(document.getElementById('in-o').value);
            const grid = document.getElementById('key-container'); grid.innerHTML = '';
            for(let i=0; i<q; i++) {
                const row = document.createElement('div');
                row.className = "p-4 bg-slate-800 rounded-2xl flex items-center justify-between gap-3 border border-slate-700";
                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-black text-slate-500">${i+1}</span>
                        <input type="number" step="0.25" value="1" class="q-weight w-12 h-9 bg-slate-700 border-none rounded-xl text-white text-center text-xs font-black" placeholder="Pts">
                    </div>
                    <div class="flex gap-1.5 overflow-x-auto no-scrollbar" id="q-row-${i}"></div>
                `;
                grid.appendChild(row);
                for(let j=0; j<o; j++) {
                    const b = document.createElement('div');
                    b.className = `bubble-btn opt-${i}`;
                    b.innerText = LETTERS[j];
                    b.onclick = function() { this.classList.toggle('selected'); };
                    row.querySelector(`#q-row-${i}`).appendChild(b);
                }
            }
        }

        function saveExam() {
            const name = document.getElementById('in-name').value;
            if(!name) return alert("Exam name is required");
            const qCount = parseInt(document.getElementById('in-q').value);
            const editId = document.getElementById('edit-id').value;
            
            let key = [];
            const weights = document.querySelectorAll('.q-weight');
            for(let i=0; i<qCount; i++) {
                let ans = [];
                document.querySelectorAll(`.opt-${i}`).forEach((b, idx) => { if(b.classList.contains('selected')) ans.push(idx); });
                key.push({ ans, weight: parseFloat(weights[i].value || 1) });
            }

            const examData = { 
                id: editId ? parseInt(editId) : Date.now(), 
                name, level: document.getElementById('in-level').value, 
                qCount, oCount: parseInt(document.getElementById('in-o').value), 
                key, date: new Date().toLocaleDateString() 
            };

            if(editId) {
                db.exams = db.exams.map(e => e.id === examData.id ? examData : e);
            } else {
                db.exams.push(examData);
            }

            localStorage.setItem('sm_zip_exams', JSON.stringify(db.exams));
            document.getElementById('edit-id').value = '';
            switchTab('exams');
        }

        function editExam(id) {
            const ex = db.exams.find(e => e.id === id);
            switchTab('create');
            document.getElementById('edit-id').value = ex.id;
            document.getElementById('in-name').value = ex.name;
            document.getElementById('in-level').value = ex.level;
            document.getElementById('in-q').value = ex.qCount;
            document.getElementById('in-o').value = ex.oCount;
            updateKeyGrid();
            
            const rows = document.querySelectorAll('#key-container > div');
            ex.key.forEach((k, i) => {
                rows[i].querySelector('.q-weight').value = k.weight;
                k.ans.forEach(ansIdx => {
                    rows[i].querySelectorAll('.bubble-btn')[ansIdx].classList.add('selected');
                });
            });
            document.getElementById('save-btn').innerText = "Update Exam Details";
        }

        // --- SCANNER LOGIC (ZIPGRADE CLONE ENGINE) ---
        async function startScanner(id) {
            if(!isCvReady) return alert("Engine is loading...");
            activeExam = db.exams.find(e => e.id === id);
            scanActive = true; stableFrames = 0;
            document.getElementById('scanner-modal').classList.remove('hidden');
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', focusMode: 'continuous', width: 1280 } });
            document.getElementById('video').srcObject = stream;
            document.getElementById('video').play();
            requestAnimationFrame(scanLoop);
        }

        function stopScanner() {
            scanActive = false;
            const stream = document.getElementById('video').srcObject;
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('scanner-modal').classList.add('hidden');
        }

        function scanLoop() {
            if(!scanActive) return;
            const video = document.getElementById('video');
            const canvas = document.getElementById('proc-canvas');
            const ctx = canvas.getContext('2d');

            if(video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 640; canvas.height = 480;
                ctx.drawImage(video, 0, 0, 640, 480);
                
                let src = cv.imread(canvas);
                let gray = new cv.Mat();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                cv.adaptiveThreshold(gray, gray, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 15, 5);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(gray, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let anchors = [];
                for(let i=0; i<contours.size(); i++) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    if(area > 400 && area < 4000) {
                        let rect = cv.boundingRect(cnt);
                        let ratio = rect.width / rect.height;
                        if(ratio > 0.8 && ratio < 1.2) anchors.push(rect);
                    }
                }

                if(anchors.length >= 4) {
                    anchors.sort((a, b) => (b.width * b.height) - (a.width * a.height));
                    let pts = anchors.slice(0, 4).map(r => ({x: r.x + r.width/2, y: r.y + r.height/2}));
                    pts.sort((a, b) => a.y - b.y);
                    let top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
                    let bottom = pts.slice(2, 4).sort((a, b) => a.x - b.x);
                    let sorted = [top[0], top[1], bottom[0], bottom[1]];

                    let sheetWidth = top[1].x - top[0].x;
                    if(sheetWidth > 200) {
                        stableFrames++;
                        updateFramesUI(true);
                        if(stableFrames > 25) { 
                            performCorrection(src, sorted);
                            scanActive = false;
                        } else {
                            requestAnimationFrame(scanLoop);
                        }
                    } else {
                        stableFrames = 0;
                        updateFramesUI(false);
                        requestAnimationFrame(scanLoop);
                    }
                } else {
                    stableFrames = 0;
                    updateFramesUI(false);
                    requestAnimationFrame(scanLoop);
                }

                src.delete(); gray.delete(); contours.delete(); hierarchy.delete();
            } else {
                requestAnimationFrame(scanLoop);
            }
        }

        function updateFramesUI(detected) {
            const msg = document.getElementById('status-msg');
            msg.innerText = detected ? "HOLD STEADY... GRADING" : "ALIGN CORNERS INSIDE BOXES";
            msg.className = detected ? "bg-emerald-600 text-white px-8 py-4 rounded-full text-xs font-black shadow-2xl" : "bg-black/80 text-white px-8 py-4 rounded-full text-xs font-black shadow-2xl";
            document.querySelectorAll('.target-frame').forEach(f => f.classList.toggle('detected', detected));
        }

        function performCorrection(src, pts) {
            let dstSize = new cv.Size(600, 850);
            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, 600, 0, 0, 850, 600, 850]);
            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [pts[0].x, pts[0].y, pts[1].x, pts[1].y, pts[2].x, pts[2].y, pts[3].x, pts[3].y]);
            
            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            let warped = new cv.Mat();
            cv.warpPerspective(src, warped, M, dstSize);

            // Capture Student Header
            let nameCanvas = document.createElement('canvas');
            let nameRoi = warped.roi(new cv.Rect(80, 100, 440, 70));
            cv.imshow(nameCanvas, nameRoi);

            let gray = new cv.Mat();
            cv.cvtColor(warped, gray, cv.COLOR_RGBA2GRAY);
            cv.adaptiveThreshold(gray, gray, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 15, 6);

            let score = 0, maxScore = 0;
            const startY = 240, rowH = 26, colW = 34; // Expanded bubble spacing

            activeExam.key.forEach((k, qIdx) => {
                let chosen = [];
                maxScore += k.weight;
                
                // Simplified column logic for 2-column display
                let xOffset = (qIdx < 20) ? 90 : 340; 
                let actualQIdx = (qIdx < 20) ? qIdx : qIdx - 20;
                let by = startY + (actualQIdx * rowH);

                for(let oIdx = 0; oIdx < activeExam.oCount; oIdx++) {
                    let bx = xOffset + (oIdx * colW);
                    let roi = gray.roi(new cv.Rect(bx-10, by-10, 20, 20)); // Larger sampling area
                    if(cv.countNonZero(roi) > 130) chosen.push(oIdx);
                    roi.delete();
                }

                if(JSON.stringify(chosen) === JSON.stringify(k.ans)) score += k.weight;

                // Mark visuals on warped image
                k.ans.forEach(idx => cv.circle(warped, new cv.Point(xOffset + (idx * colW), by), 12, new cv.Scalar(0, 255, 0, 255), 3));
            });

            const gradedCanvas = document.createElement('canvas');
            cv.imshow(gradedCanvas, warped);

            const res = { 
                id: Date.now(), examName: activeExam.name, score, total: maxScore, 
                date: new Date().toLocaleString(), nameImg: nameCanvas.toDataURL(), gradedImg: gradedCanvas.toDataURL()
            };
            db.results.push(res);
            localStorage.setItem('sm_zip_results', JSON.stringify(db.results));

            document.getElementById('res-score').innerText = `${score} / ${maxScore}`;
            document.getElementById('res-name-img').src = res.nameImg;
            window.latestGraded = res.gradedImg;
            document.getElementById('res-popup').classList.remove('hidden');
            
            srcTri.delete(); dstTri.delete(); M.delete(); warped.delete(); gray.delete(); nameRoi.delete();
            stopScanner();
        }

        function viewFullGraded() {
            const win = window.open();
            win.document.write(`<img src="${window.latestGraded}" style="width:100%">`);
        }

        function closeResult() {
            document.getElementById('res-popup').classList.add('hidden');
            startScanner(activeExam.id);
        }

        // --- SHEET RENDER (ZIPGRADE LOOKALIKE) ---
        function renderExams() {
            const container = document.getElementById('view-exams'); container.innerHTML = '';
            db.exams.forEach(ex => {
                const d = document.createElement('div');
                d.className = "bg-white p-6 rounded-[40px] border shadow-sm space-y-4 hover:shadow-xl transition-all";
                d.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center font-black text-xl">${ex.qCount}</div>
                        <div class="flex gap-2">
                            <button onclick="editExam(${ex.id})" class="text-slate-300 hover:text-blue-600"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteExam(${ex.id})" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div><h3 class="font-black text-slate-800 text-lg uppercase tracking-tight">${ex.name}</h3><p class="text-[10px] text-slate-400 font-bold">${ex.level}</p></div>
                    <button onclick="startScanner(${ex.id})" class="w-full bg-blue-600 text-white py-5 rounded-3xl font-black shadow-lg italic">START GRADING</button>
                    <button onclick="previewSheet(${ex.id})" class="w-full bg-slate-50 text-slate-700 py-3 rounded-2xl font-black text-[10px] uppercase">Preview Sheet</button>
                `;
                container.appendChild(d);
            });
        }

        async function previewSheet(id) {
            const ex = db.exams.find(e => e.id === id);
            const container = document.getElementById('hidden-print-area');
            container.innerHTML = '';
            
            const page = document.createElement('div');
            page.className = 'sheet-page';
            page.innerHTML = `
                <div class="black-corner c-tl"></div><div class="black-corner c-tr"></div>
                <div class="black-corner c-bl"></div><div class="black-corner c-br"></div>
                <div style="margin:25mm 10mm 5mm 10mm; display:flex; justify-content:space-between; align-items:start; border-bottom:4px solid #000; padding-bottom:15px;">
                    <div><h1 style="font-size:32px; font-weight:900; margin:0; font-family:sans-serif;">${ex.name}</h1><p style="font-size:14px; font-weight:bold; color:#444;">CLASS: ${ex.level}</p></div>
                    <div id="qr"></div>
                </div>
                <table style="width:calc(100% - 20mm); margin:10mm; border:3px solid #000; border-collapse:collapse;">
                    <tr><td style="border:3px solid #000; padding:15px; font-weight:900; font-size:18px; width:65%;">NAME: ....................................................</td>
                        <td style="border:3px solid #000; padding:15px; font-weight:900; font-size:18px;">DATE: ............</td></tr>
                </table>
                <div id="bubbles-grid" style="margin:10mm; display:flex; gap:60px;"></div>
            `;
            
            const grid = page.querySelector('#bubbles-grid');
            const itemsPerCol = 20;
            const colsCount = Math.ceil(ex.qCount / itemsPerCol);
            for(let c=0; c < colsCount; c++) {
                const col = document.createElement('div');
                col.style.width = "45%";
                const header = document.createElement('div');
                header.style.cssText = "display:flex; gap:10px; margin-bottom:8px; padding-left:35px; font-weight:900; font-size:14px;";
                header.innerHTML = LETTERS.slice(0, ex.oCount).map(l => `<span style="width:24px; text-align:center;">${l}</span>`).join('');
                col.appendChild(header);

                for(let i = c*itemsPerCol; i < Math.min((c+1)*itemsPerCol, ex.qCount); i++) {
                    const row = document.createElement('div');
                    row.style.cssText = "display:flex; gap:10px; align-items:center; margin-bottom:10px;";
                    let bubbles = '';
                    for(let j=0; j<ex.oCount; j++) {
                        bubbles += `<div style="width:24px; height:24px; border:2.5px solid #000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900; color:#ccc;">${LETTERS[j]}</div>`;
                    }
                    row.innerHTML = `<div style="width:30px; font-size:16px; font-weight:900; text-align:right;">${i+1}</div>${bubbles}`;
                    col.appendChild(row);
                }
                grid.appendChild(col);
            }
            container.appendChild(page);
            new QRCode(page.querySelector('#qr'), { text: `Z-${ex.id}`, width: 80, height: 80 });
            
            setTimeout(async () => {
                const canvas = await html2canvas(page, { scale: 2 });
                const previewImg = document.createElement('img');
                previewImg.src = canvas.toDataURL();
                previewImg.className = "max-w-full shadow-2xl rounded-sm";
                document.getElementById('preview-container').innerHTML = '';
                document.getElementById('preview-container').appendChild(previewImg);
                document.getElementById('preview-modal').classList.remove('hidden');
                document.getElementById('final-download-btn').onclick = () => {
                    const link = document.createElement('a'); link.download = `${ex.name}_Sheet.png`; link.href = canvas.toDataURL(); link.click();
                };
            }, 600);
        }

        function renderHistory() {
            const container = document.getElementById('view-history'); 
            container.innerHTML = '<h3 class="text-2xl font-black mb-6 italic">GRADING HISTORY</h3>';
            db.results.slice().reverse().forEach(r => {
                const d = document.createElement('div');
                d.className = "bg-white p-6 rounded-[35px] border border-slate-100 flex justify-between items-center shadow-sm";
                d.innerHTML = `
                    <div class="flex items-center gap-5"><img src="${r.nameImg}" class="h-12 border-2 border-slate-100 rounded-xl bg-slate-50">
                    <div><p class="font-black text-slate-800 uppercase tracking-tighter">${r.examName}</p><p class="text-[9px] text-slate-400 font-bold uppercase">${r.date}</p></div></div>
                    <div class="text-3xl font-black text-blue-600 italic underline decoration-blue-200 decoration-4 underline-offset-4">${r.score} <span class="text-xs text-slate-300">/ ${r.total}</span></div>
                `;
                container.appendChild(d);
            });
        }

        function deleteExam(id) { if(confirm("Permanently delete this exam?")) { db.exams = db.exams.filter(e => e.id !== id); localStorage.setItem('sm_zip_exams', JSON.stringify(db.exams)); renderExams(); } }

        window.onload = () => switchTab('exams');
    </script>
</body>
</html>
