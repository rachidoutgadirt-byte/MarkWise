<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMark Pro - نظام التصحيح الآلي المتقدم</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; overflow: hidden; }
        
        #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
        .sidebar-open #sidebar-overlay { display: block; }
        aside { transition: transform 0.3s ease-in-out; z-index: 50; }
        @media (max-width: 768px) { aside { position: fixed; top: 0; right: 0; height: 100%; transform: translateX(100%); } .sidebar-open aside { transform: translateX(0); } }

        /* Bubble Styles */
        .bubble-select { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .bubble-select.selected { background-color: #4f46e5; color: white; border-color: #4f46e5; }
        .bubble-correct { background-color: #10b981 !important; color: white; border-color: #10b981 !important; }
        .bubble-wrong { background-color: #ef4444 !important; color: white; border-color: #ef4444 !important; }

        /* Scanner */
        .scanner-active { display: flex !important; }
        .guide-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 75%; border: 2px solid #10b981; border-radius: 15px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.7); pointer-events: none; }

        /* OMR Sheet Generation Styles (ZipGrade Style) */
        #sheet-generator-container { position: fixed; left: -9999px; top: 0; width: 210mm; background: white; }
        .omr-sheet { width: 210mm; min-height: 297mm; padding: 10mm; background: white; position: relative; display: flex; flex-direction: column; color: black; }
        .anchor-square { position: absolute; width: 8mm; height: 8mm; background: black; }
        .anchor-tl { top: 5mm; right: 5mm; } .anchor-tr { top: 5mm; left: 5mm; }
        .anchor-bl { bottom: 5mm; right: 5mm; } .anchor-br { bottom: 5mm; left: 5mm; }
        
        .omr-header { border-bottom: 3px solid black; padding-bottom: 10px; margin-bottom: 15px; margin-top: 10px; }
        .student-info-box { border: 2px solid black; padding: 10px; border-radius: 8px; margin-bottom: 20px; }
        .q-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .q-num { width: 22px; font-weight: 900; font-size: 12px; text-align: left; border-left: 1px solid #ddd; padding-left: 4px; }
        .q-bubble { width: 18px; height: 18px; border: 1.5px solid black; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: bold; }
        .q-column { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    </style>
</head>
<body class="text-slate-900">

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl shrink-0">
            <div class="p-6 border-b border-slate-800 text-center">
                <h1 class="text-2xl font-black text-indigo-400">SMART MARK</h1>
                <p class="text-[10px] text-slate-400 mt-1 uppercase">Pro Grading System</p>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="switchTab('dashboard')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 bg-indigo-600" id="btn-dashboard">
                    <i class="fa-solid fa-chart-line w-5"></i> الإحصائيات
                </button>
                <button onclick="switchTab('create')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 text-slate-300" id="btn-create">
                    <i class="fa-solid fa-plus-circle w-5"></i> إنشاء امتحان
                </button>
                <button onclick="switchTab('manage')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 text-slate-300" id="btn-manage">
                    <i class="fa-solid fa-list-check w-5"></i> إدارة الامتحانات
                </button>
                <button onclick="switchTab('results')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 text-slate-300" id="btn-results">
                    <i class="fa-solid fa-poll w-5"></i> النتائج
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0">
            <header class="bg-white border-b p-4 flex justify-between items-center">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-600 p-2"><i class="fa-solid fa-bars-staggered"></i></button>
                <h2 id="current-tab-title" class="font-extrabold text-slate-800">لوحة القيادة</h2>
                <div id="cv-status" class="flex items-center gap-2 text-xs font-bold text-red-500">
                    <span class="w-2 h-2 bg-current rounded-full animate-pulse"></span> محرك AI معطل
                </div>
            </header>

            <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8">
                
                <!-- 1. Dashboard -->
                <section id="tab-dashboard" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><p class="text-slate-500 text-xs font-bold mb-1">الامتحانات</p><h3 class="text-3xl font-black text-indigo-600" id="stat-exams">0</h3></div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><p class="text-slate-500 text-xs font-bold mb-1">الأوراق المصححة</p><h3 class="text-3xl font-black text-emerald-600" id="stat-papers">0</h3></div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><p class="text-slate-500 text-xs font-bold mb-1">متوسط النجاح</p><h3 class="text-3xl font-black text-amber-500" id="stat-average">0%</h3></div>
                    </div>
                </section>

                <!-- 2. Create Exam -->
                <section id="tab-create" class="hidden max-w-4xl mx-auto">
                    <div class="bg-white rounded-2xl shadow-xl p-6 space-y-6 border">
                        <h3 class="text-xl font-bold border-b pb-4">إعداد امتحان جديد</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="examTitle" placeholder="عنوان الامتحان (مثلاً: اللغة العربية)" class="w-full border-2 border-slate-100 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none">
                            <input type="text" id="examClass" placeholder="القسم أو المستوى" class="w-full border-2 border-slate-100 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none">
                        </div>
                        <div class="grid grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl">
                            <div><label class="text-[10px] font-bold">عدد الأسئلة</label><input type="number" id="qCount" value="20" onchange="renderKeyGrid('create')" class="w-full p-2 rounded-lg border"></div>
                            <div><label class="text-[10px] font-bold">خيارات الإجابة</label><input type="number" id="oCount" value="4" onchange="renderKeyGrid('create')" class="w-full p-2 rounded-lg border"></div>
                            <div><label class="text-[10px] font-bold">نقطة لكل سؤال</label><input type="number" id="pointsPerQ" value="1" step="0.25" class="w-full p-2 rounded-lg border"></div>
                        </div>
                        <div class="border-t pt-4">
                            <p class="font-bold text-sm mb-3 text-indigo-600">حدد مفتاح الإجابة الصحيحة:</p>
                            <div id="answerKeyGrid" class="grid gap-2 overflow-x-auto pb-4"></div>
                        </div>
                        <button onclick="saveExam()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-indigo-700 transition">حفظ الامتحان وتوليد النموذج</button>
                    </div>
                </section>

                <!-- 3. Manage -->
                <section id="tab-manage" class="hidden">
                    <div id="manageGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </section>

                <!-- 4. Results -->
                <section id="tab-results" class="hidden">
                    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <table class="w-full text-right border-collapse">
                            <thead class="bg-slate-50 text-slate-500 text-[11px] font-bold uppercase">
                                <tr><th class="p-4">اسم التلميذ</th><th class="p-4">الامتحان</th><th class="p-4 text-center">النقطة</th><th class="p-4 text-center">إجراءات</th></tr>
                            </thead>
                            <tbody id="resultsTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Edit Key Modal -->
    <div id="editKeyModal" class="fixed inset-0 bg-slate-900/80 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-3xl rounded-3xl p-6 shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-xl font-bold mb-4 border-b pb-4">تعديل مفتاح الإجابة</h3>
            <div id="editKeyGrid" class="flex-1 overflow-y-auto grid gap-2 pb-6"></div>
            <div class="flex gap-3 pt-4 border-t">
                <button onclick="saveEditedKey()" class="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg">حفظ التغييرات</button>
                <button onclick="closeEditModal()" class="flex-1 bg-slate-100 text-slate-500 font-bold py-3 rounded-xl">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div id="scannerModal" class="fixed inset-0 bg-black z-[100] hidden flex-col">
        <div class="absolute top-6 left-6 z-50">
            <button onclick="closeScanner()" class="bg-white/20 backdrop-blur text-white px-6 py-2 rounded-full font-bold">إغلاق الكاميرا</button>
        </div>
        <div class="relative flex-1 flex items-center justify-center">
            <video id="videoInput" playsinline autoplay muted class="w-full h-full object-cover"></video>
            <div class="guide-box"></div>
            <div class="absolute bottom-10"><button onclick="processScan()" class="w-20 h-20 bg-white rounded-full border-8 border-indigo-500 shadow-2xl flex items-center justify-center"><i class="fa-solid fa-camera text-3xl text-indigo-600"></i></button></div>
        </div>
        <canvas id="processCanvas" class="hidden"></canvas>
    </div>

    <!-- Generate Tool -->
    <div id="sheet-generator-container"></div>

    <script>
        let db = { exams: [], results: [] };
        let currentExamId = null;
        let isCvLoaded = false;
        let createKey = [];
        let editingKey = [];
        let editingExamId = null;
        const ARABIC_OPTS = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح'];

        function onOpenCvReady() {
            isCvLoaded = true;
            document.getElementById('cv-status').innerHTML = '<span class="w-2 h-2 bg-emerald-500 rounded-full"></span> محرك AI جاهز';
            document.getElementById('cv-status').classList.replace('text-red-500', 'text-emerald-500');
        }

        function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }

        function switchTab(tabId) {
            ['dashboard', 'create', 'manage', 'results'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-' + t).classList.replace('bg-indigo-600', 'text-slate-300');
            });
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).classList.replace('text-slate-300', 'bg-indigo-600');
            if(document.body.classList.contains('sidebar-open')) toggleSidebar();
            if(tabId === 'manage') renderManageGrid();
            if(tabId === 'results') renderResultsTable();
            if(tabId === 'dashboard') updateStats();
        }

        function renderKeyGrid(mode, examData = null) {
            const q = mode === 'create' ? parseInt(document.getElementById('qCount').value) : examData.qCount;
            const o = mode === 'create' ? parseInt(document.getElementById('oCount').value) : examData.oCount;
            const container = document.getElementById(mode === 'create' ? 'answerKeyGrid' : 'editKeyGrid');
            
            if(mode === 'create') {
                if(createKey.length !== q) createKey = Array(q).fill().map(() => []);
            } else {
                editingKey = JSON.parse(JSON.stringify(examData.key));
            }

            container.innerHTML = '';
            container.style.gridTemplateColumns = `40px repeat(${o}, 1fr)`;

            for(let i=0; i<q; i++) {
                const num = document.createElement('div');
                num.className = "flex items-center justify-center font-bold text-slate-400 text-xs";
                num.innerText = i + 1;
                container.appendChild(num);

                for(let j=0; j<o; j++) {
                    const bubble = document.createElement('div');
                    const isSel = mode === 'create' ? createKey[i].includes(j) : editingKey[i].includes(j);
                    bubble.className = `bubble-select mx-auto ${isSel ? 'selected' : ''}`;
                    bubble.innerText = ARABIC_OPTS[j];
                    bubble.onclick = () => {
                        let target = mode === 'create' ? createKey[i] : editingKey[i];
                        const idx = target.indexOf(j);
                        if(idx > -1) target.splice(idx, 1); else target.push(j);
                        renderKeyGrid(mode, mode === 'edit' ? {qCount:q, oCount:o, key: editingKey} : null);
                    };
                    container.appendChild(bubble);
                }
            }
        }

        function saveExam() {
            const title = document.getElementById('examTitle').value;
            if(!title) return alert("الرجاء إدخال اسم الامتحان");
            const newExam = {
                id: Date.now(),
                title: title,
                class: document.getElementById('examClass').value,
                qCount: parseInt(document.getElementById('qCount').value),
                oCount: parseInt(document.getElementById('oCount').value),
                pointsPerQ: parseFloat(document.getElementById('pointsPerQ').value),
                key: JSON.parse(JSON.stringify(createKey)),
                timestamp: new Date().toISOString()
            };
            db.exams.push(newExam);
            saveData();
            alert("تم الحفظ بنجاح!");
            switchTab('manage');
        }

        function renderManageGrid() {
            const grid = document.getElementById('manageGrid');
            grid.innerHTML = '';
            db.exams.forEach(exam => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl border shadow-sm flex flex-col hover:shadow-md transition";
                card.innerHTML = `
                    <h4 class="font-bold text-lg mb-1">${exam.title}</h4>
                    <p class="text-xs text-slate-400 mb-4">${exam.class} | ${exam.qCount} سؤال</p>
                    <div class="grid grid-cols-2 gap-2 mt-auto">
                        <button onclick="startScanning(${exam.id})" class="bg-indigo-600 text-white py-2 rounded-lg text-xs font-bold">بدء التصحيح</button>
                        <button onclick="generateSheet(${exam.id})" class="bg-slate-100 text-slate-600 py-2 rounded-lg text-xs font-bold">تحميل النموذج</button>
                        <button onclick="openEditModal(${exam.id})" class="bg-amber-100 text-amber-700 py-2 rounded-lg text-xs font-bold col-span-2">تعديل مفتاح الإجابة</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- EDIT KEY LOGIC ---
        function openEditModal(id) {
            editingExamId = id;
            const exam = db.exams.find(e => e.id === id);
            renderKeyGrid('edit', exam);
            document.getElementById('editKeyModal').classList.remove('hidden');
        }

        function closeEditModal() { document.getElementById('editKeyModal').classList.add('hidden'); }

        function saveEditedKey() {
            const index = db.exams.findIndex(e => e.id === editingExamId);
            if(index > -1) {
                db.exams[index].key = JSON.parse(JSON.stringify(editingKey));
                saveData();
                closeEditModal();
                alert("تم تحديث مفتاح الإجابة بنجاح!");
            }
        }

        // --- SHEET GENERATION (ZipGrade Professional Style) ---
        async function generateSheet(id) {
            const exam = db.exams.find(e => e.id === id);
            const container = document.getElementById('sheet-generator-container');
            container.innerHTML = '';

            const sheet = document.createElement('div');
            sheet.className = "omr-sheet";
            sheet.innerHTML = `
                <div class="anchor-square anchor-tl"></div><div class="anchor-square anchor-tr"></div>
                <div class="anchor-square anchor-bl"></div><div class="anchor-square anchor-br"></div>
                
                <div class="omr-header flex justify-between items-end">
                    <div><h1 style="font-size: 24px; font-weight: 900;">ورقة إجابة: ${exam.title}</h1><p>${exam.class} | ${exam.qCount} سؤال</p></div>
                    <div id="qrcode"></div>
                </div>

                <div class="student-info-box grid grid-cols-2 gap-4">
                    <div class="border-b-2 border-black pb-1 text-sm font-bold">اسم التلميذ:</div>
                    <div class="border-b-2 border-black pb-1 text-sm font-bold">تاريخ الامتحان:</div>
                </div>

                <div class="flex-1 flex gap-8">
                    ${renderColumns(exam.qCount, exam.oCount)}
                </div>

                <div class="text-[10px] text-center mt-4 border-t pt-2 opacity-50">SMARTMARK AI STANDARDIZED SHEET - DO NOT FOLD</div>
            `;
            container.appendChild(sheet);

            new QRCode(document.getElementById("qrcode"), { text: `SM-${exam.id}`, width: 60, height: 60 });

            await new Promise(r => setTimeout(r, 600));
            const canvas = await html2canvas(sheet, { scale: 2 });
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
            pdf.save(`Sheet-${exam.title}.pdf`);
            container.innerHTML = '';
        }

        function renderColumns(qCount, oCount) {
            let html = '';
            const questionsPerCol = 25;
            const cols = Math.ceil(qCount / questionsPerCol);
            
            for(let c=0; c<cols; c++) {
                html += `<div class="q-column">`;
                const start = c * questionsPerCol;
                const end = Math.min(start + questionsPerCol, qCount);
                for(let i=start; i<end; i++) {
                    html += `<div class="q-row"><div class="q-num">${i+1}</div>`;
                    for(let j=0; j<oCount; j++) html += `<div class="q-bubble">${ARABIC_OPTS[j]}</div>`;
                    html += `</div>`;
                }
                html += `</div>`;
            }
            return html;
        }

        // --- Core Functions ---
        function saveData() { localStorage.setItem('sm_pro_db', JSON.stringify(db)); }
        window.onload = () => {
            const saved = localStorage.getItem('sm_pro_db');
            if(saved) db = JSON.parse(saved);
            renderKeyGrid('create');
            updateStats();
        };

        function updateStats() {
            document.getElementById('stat-exams').innerText = db.exams.length;
            document.getElementById('stat-papers').innerText = db.results.length;
        }

        function renderResultsTable() {
            const body = document.getElementById('resultsTableBody');
            body.innerHTML = '';
            db.results.slice().reverse().forEach(res => {
                const exam = db.exams.find(e => e.id === res.examId);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4"><img src="${res.nameImg}" class="h-8 rounded border"></td>
                    <td class="p-4 font-bold">${exam?.title || 'امتحان محذوف'}</td>
                    <td class="p-4 text-center font-black text-indigo-600">${res.score} / ${res.total}</td>
                    <td class="p-4 text-center"><button class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash"></i></button></td>
                `;
                body.appendChild(tr);
            });
        }
        
        function closeScanner() { 
            document.getElementById('scannerModal').classList.remove('scanner-active');
            if(window.stream) window.stream.getTracks().forEach(t => t.stop());
        }

        function startScanning(id) {
            currentExamId = id;
            document.getElementById('scannerModal').classList.add('scanner-active');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(s => { window.stream = s; document.getElementById('videoInput').srcObject = s; });
        }

// --- محرك التصحيح الذكي (Smart Grading Engine) ---

        function processScan() {
            if (!isCvLoaded) return alert("المحرك لا يزال يتحمل...");
            
            const video = document.getElementById('videoInput');
            const canvas = document.getElementById('processCanvas');
            const ctx = canvas.getContext('2d');

            // 1. التقاط فريم من الكاميرا
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            let src = cv.imread(canvas);
            let gray = new cv.Mat();
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            
            // 2. معالجة الصورة لتحسين الحواف
            let blurred = new cv.Mat();
            cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
            let thresholded = new cv.Mat();
            cv.adaptiveThreshold(blurred, thresholded, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);

            // 3. البحث عن أكبر مستطيل (إطار الورقة)
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(thresholded, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let maxArea = 0;
            let approx = new cv.Mat();
            let found = false;

            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);
                if (area > 50000) { // التأكد من أن الجسم المكتشف كبير بما يكفي ليكون ورقة
                    let peri = cv.arcLength(cnt, true);
                    let tmp = new cv.Mat();
                    cv.approxPolyDP(cnt, tmp, 0.02 * peri, true);
                    if (tmp.rows === 4) { // إذا وجدنا شكلاً بـ 4 زوايا
                        maxArea = area;
                        approx = tmp;
                        found = true;
                    }
                }
            }

            if (found) {
                // 4. تصحيح المنظور (جعل الورقة مسطحة ومستقيمة)
                let warped = transformPerspective(src, approx);
                
                // 5. استخراج منطقة الاسم (الجزء العلوي من الورقة)
                let nameRect = new cv.Rect(50, 60, warped.cols - 100, 90);
                let nameROI = warped.roi(nameRect);
                cv.imshow(canvas, nameROI);
                let nameImgBase64 = canvas.toDataURL();

                // 6. تحليل الدوائر (OMR Logic)
                const exam = db.exams.find(e => e.id === currentExamId);
                let examGrades = analyzeBubbles(warped, exam);

                // 7. حساب النتيجة النهائية
                let finalScore = 0;
                examGrades.forEach((studentAns, qIdx) => {
                    const correctAns = exam.key[qIdx] || [];
                    if (JSON.stringify(studentAns.sort()) === JSON.stringify(correctAns.sort()) && correctAns.length > 0) {
                        finalScore += exam.pointsPerQ;
                    }
                });

                // 8. حفظ النتيجة في قاعدة البيانات
                db.results.push({
                    id: Date.now(),
                    examId: currentExamId,
                    nameImg: nameImgBase64,
                    answers: examGrades,
                    score: finalScore,
                    total: exam.qCount * exam.pointsPerQ,
                    timestamp: new Date().toISOString()
                });

                saveData();
                alert(`تم التصحيح بنجاح! النتيجة: ${finalScore} / ${exam.qCount * exam.pointsPerQ}`);
                closeScanner();
                renderResultsTable();

                // تنظيف الذاكرة
                warped.delete(); nameROI.delete();
            } else {
                alert("لم يتم العثور على الورقة. تأكد من أن المربعات السوداء واضحة في الكاميرا.");
            }

            src.delete(); gray.delete(); blurred.delete(); thresholded.delete(); contours.delete(); hierarchy.delete();
        }

        // دالة تصحيح ميلان الورقة
        function transformPerspective(src, approx) {
            let dstW = 600; // عرض الورقة الافتراضي بعد المعالجة
            let dstH = 800; // طول الورقة الافتراضي بعد المعالجة
            
            let pts = [];
            for (let i = 0; i < 4; i++) {
                pts.push({ x: approx.data32S[i * 2], y: approx.data32S[i * 2 + 1] });
            }

            // ترتيب الزوايا: علوي-يمين، علوي-يسار، سفلي-يسار، سفلي-يمين
            pts.sort((a, b) => a.y - b.y);
            let top = pts.slice(0, 2).sort((a, b) => b.x - a.x);
            let bottom = pts.slice(2, 4).sort((a, b) => b.x - a.x);
            
            let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [top[0].x, top[0].y, top[1].x, top[1].y, bottom[1].x, bottom[1].y, bottom[0].x, bottom[0].y]);
            let dstCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [dstW, 0, 0, 0, 0, dstH, dstW, dstH]);

            let M = cv.getPerspectiveTransform(srcCoords, dstCoords);
            let warped = new cv.Mat();
            cv.warpPerspective(src, warped, M, new cv.Size(dstW, dstH));
            
            srcCoords.delete(); dstCoords.delete(); M.delete();
            return warped;
        }

        // دالة تحليل تظليل الدوائر
        function analyzeBubbles(warped, exam) {
            let gray = new cv.Mat();
            cv.cvtColor(warped, gray, cv.COLOR_RGBA2GRAY);
            let thresh = new cv.Mat();
            cv.threshold(gray, thresh, 0, 255, cv.THRESH_BINARY_INV | cv.THRESH_OTSU);

            let studentAnswers = [];
            
            // إحداثيات افتراضية لشبكة الأسئلة (يتم تعديلها حسب تصميم الورقة)
            let startY = 220; 
            let rowH = (warped.rows - startY - 50) / 25; // نفترض أن العمود الواحد فيه 25 سؤال كحد أقصى
            let colW = (warped.cols - 100) / (exam.oCount * Math.ceil(exam.qCount / 25));

            for (let i = 0; i < exam.qCount; i++) {
                let colIdx = Math.floor(i / 25);
                let rowIdx = i % 25;
                
                let qAnswers = [];
                for (let j = 0; j < exam.oCount; j++) {
                    // حساب مكان كل دائرة بدقة
                    let x = warped.cols - 120 - (colIdx * 250) - (j * 35);
                    let y = startY + (rowIdx * rowH);
                    
                    let rect = new cv.Rect(x, y, 20, 20);
                    let roi = thresh.roi(rect);
                    
                    // حساب عدد البيكسلات المظللة
                    let nonZero = cv.countNonZero(roi);
                    let totalPixels = roi.cols * roi.rows;
                    
                    if (nonZero > totalPixels * 0.5) { // إذا كان أكثر من 50% من الدائرة مسوداً
                        qAnswers.push(j);
                    }
                    roi.delete();
                }
                studentAnswers.push(qAnswers);
            }
            gray.delete(); thresh.delete();
            return studentAnswers;
        }

     
    </script>
