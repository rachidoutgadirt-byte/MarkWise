<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartGrader AI - Ultimate Pro</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        
        :root { --primary: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; color: #1e293b; }
        [x-cloak] { display: none !important; }
        
        /* Fix Scrolling Issues */
        html, body { height: 100%; margin: 0; padding: 0; }
        main { overflow-y: auto; -webkit-overflow-scrolling: touch; }

        /* Scanner Styling */
        .scanner-view { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; }
        .hud-box { position: relative; width: 85vw; height: 70vh; max-width: 420px; max-height: 600px; pointer-events: none; }
        .anchor-guide { 
            position: absolute; width: 60px; height: 60px; 
            border: 4px solid rgba(255, 255, 255, 0.4); border-radius: 15px; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .anchor-guide.detected { border-color: #10b981; background: rgba(16, 185, 129, 0.2); box-shadow: 0 0 30px #10b981; transform: scale(1.15); }
        .scan-anim { 
            position: absolute; width: 100%; height: 3px; background: rgba(37, 99, 235, 0.4);
            box-shadow: 0 0 15px #2563eb; animation: scanMove 2.5s infinite linear;
        }
        @keyframes scanMove { 0% { top: 5%; } 100% { top: 95%; } }

        /* General UI */
        .active-tab-btn { background: var(--primary); color: white; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
        .card-glow:hover { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); transform: translateY(-2px); }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body x-data="smartGrader()" x-init="init()">

    <!-- Top Navigation -->
    <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-lg border-b border-slate-200 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black shadow-lg">S</div>
                <h1 class="font-black text-xl hidden sm:block">SmartGrader <span class="text-blue-600 uppercase">AI</span></h1>
            </div>

            <div class="flex items-center gap-2">
                <select x-model="lang" @change="updateLang()" class="border-none bg-slate-100 rounded-lg px-2 py-1.5 text-xs font-bold outline-none">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                </select>
                <!-- Data Management Dropdown -->
                <div class="relative" x-data="{ open: false }">
                    <button @click="open = !open" class="p-2 bg-slate-100 rounded-lg hover:bg-slate-200 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                    </button>
                    <div x-show="open" @click.outside="open = false" x-cloak class="absolute left-0 mt-2 w-48 bg-white border rounded-2xl shadow-2xl p-2 z-50">
                        <button @click="exportData(); open=false" class="w-full text-right p-3 hover:bg-blue-50 rounded-xl text-sm font-bold flex items-center gap-2">تصدير (Export)</button>
                        <label class="w-full text-right p-3 hover:bg-blue-50 rounded-xl text-sm font-bold flex items-center gap-2 cursor-pointer">
                            استيراد (Import)
                            <input type="file" @change="importData($event); open=false" class="hidden">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sidebar (Desktop) -->
    <aside class="fixed right-0 top-16 w-64 h-full bg-white border-l border-slate-200 p-6 hidden md:block z-40">
        <nav class="space-y-3">
            <template x-for="t in ['stats', 'create', 'correct', 'results']">
                <button @click="tab = t" :class="tab === t ? 'active-tab-btn' : 'text-slate-500 hover:bg-slate-100'"
                    class="w-full flex items-center gap-3 p-4 rounded-2xl transition-all font-bold text-sm">
                    <span x-text="labels[lang][t]"></span>
                </button>
            </template>
        </nav>
    </aside>

    <!-- Bottom Nav (Mobile) -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 md:hidden z-50 shadow-[0_-5px_20px_rgba(0,0,0,0.03)]">
        <div class="flex justify-around items-center h-20 px-2">
            <template x-for="t in ['stats', 'create', 'correct', 'results']">
                <button @click="tab = t" class="flex flex-col items-center gap-1 transition-all" :class="tab === t ? 'text-blue-600 translate-y-[-4px]' : 'text-slate-400'">
                    <div :class="tab === t ? 'bg-blue-50 p-2 rounded-xl' : 'p-2'">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path x-show="t==='stats'" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                            <path x-show="t==='create'" d="M12 4v16m8-8H4"></path>
                            <path x-show="t==='correct'" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                            <path x-show="t==='results'" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                        </svg>
                    </div>
                    <span class="text-[9px] font-black uppercase" x-text="labels[lang][t]"></span>
                </button>
            </template>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="md:mr-64 pt-20 pb-28 px-4 max-w-7xl mx-auto h-full overflow-y-auto">
        
        <!-- Tab: Stats -->
        <div x-show="tab === 'stats'" x-cloak class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <h2 class="text-2xl font-black text-slate-800" x-text="labels[lang].stats_title"></h2>
                <select x-model="statFilter" @change="calculateStats()" class="bg-white border-none shadow-sm p-3 rounded-2xl font-bold text-sm w-full sm:w-48 outline-none">
                    <option value="all">كل الأقسام</option>
                    <template x-for="cls in classes" :key="cls">
                        <option :value="cls" x-text="cls"></option>
                    </template>
                </select>
            </div>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <template x-for="c in getStatCards()">
                    <div class="bg-white p-6 rounded-[2rem] border border-white shadow-sm text-center card-glow transition-all">
                        <p class="text-[10px] text-slate-400 font-bold uppercase mb-1" x-text="c.label"></p>
                        <p class="text-2xl font-black text-slate-800" x-text="c.value"></p>
                    </div>
                </template>
            </div>
            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-white">
                <canvas id="mainChart" class="max-h-[350px]"></canvas>
            </div>
        </div>

        <!-- Tab: Create -->
        <div x-show="tab === 'create'" x-cloak>
            <div class="max-w-3xl mx-auto bg-white p-6 md:p-10 rounded-[2.5rem] shadow-xl border border-white">
                <h2 class="text-xl font-black mb-8 text-center text-slate-800" x-text="editingId ? labels[lang].edit_exam : labels[lang].new_exam"></h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase">اسم الامتحان</label>
                        <input type="text" x-model="examForm.title" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase">القسم</label>
                        <input type="text" x-model="examForm.className" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase">عدد الأسئلة</label>
                        <input type="number" x-model.number="examForm.qCount" @change="initQuestions()" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase">الخيارات</label>
                        <select x-model.number="examForm.optCount" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold outline-none">
                            <template x-for="n in [4,5,6,8,12]"><option :value="n" x-text="n"></option></template>
                        </select>
                    </div>
                </div>

                <!-- Questions List (Scrollable Area) -->
                <div class="space-y-4 mb-8">
                    <h3 class="font-black text-slate-800 border-b pb-4 flex justify-between items-center text-sm">
                        <span>مفتاح الإجابة والنقط</span>
                        <span class="text-blue-600" x-text="'المجموع: ' + calculateTotal() + ' ن'"></span>
                    </h3>
                    <div class="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scroll">
                        <template x-for="(q, idx) in examForm.questions" :key="idx">
                            <div class="bg-slate-50 p-4 rounded-3xl border border-slate-100">
                                <div class="flex items-center justify-between mb-3">
                                    <span class="font-black text-slate-500 text-xs" x-text="'سؤال ' + (idx + 1)"></span>
                                    <div class="flex gap-2">
                                        <input type="number" step="0.25" x-model.number="q.pts" class="w-14 p-2 rounded-xl text-center text-xs font-bold border-none shadow-sm" title="نقطة">
                                        <input type="number" step="0.25" x-model.number="q.part" class="w-14 p-2 rounded-xl text-center text-xs font-bold border-none shadow-sm" title="جزئية">
                                    </div>
                                </div>
                                <div class="flex flex-wrap gap-1.5">
                                    <template x-for="opt in getOptionsList()">
                                        <button @click="toggleAnswer(idx, opt)" 
                                            :class="q.ans.includes(opt) ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 hover:bg-blue-50'"
                                            class="w-8 h-8 md:w-10 md:h-10 rounded-xl border border-slate-200 font-bold transition-all text-[10px]"
                                            x-text="opt">
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- SAVE BUTTON (Clearly visible and reachable) -->
                <div class="pt-4 border-t sticky bottom-0 bg-white">
                    <button @click="saveExam()" class="w-full bg-blue-600 text-white font-black py-5 rounded-[2rem] shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all">
                        <span x-text="editingId ? 'تحديث البيانات' : 'حفظ الامتحان واستمرار'"></span>
                    </button>
                    <button x-show="editingId" @click="cancelEdit()" class="w-full mt-2 py-3 bg-slate-100 text-slate-500 font-bold rounded-2xl">إلغاء</button>
                </div>
            </div>
        </div>

        <!-- Tab: Correct -->
        <div x-show="tab === 'correct'" x-cloak>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <template x-for="ex in exams" :key="ex.id">
                    <div class="bg-white p-8 rounded-[2.5rem] border border-white shadow-sm hover:shadow-md transition-all group relative overflow-hidden">
                        <h3 class="text-2xl font-black text-slate-800" x-text="ex.title"></h3>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1 mb-6" x-text="ex.className"></p>
                        
                        <div class="flex flex-col gap-3">
                            <button @click="openScanner(ex)" class="w-full py-5 bg-blue-600 text-white font-black rounded-3xl flex items-center justify-center gap-3 shadow-lg shadow-blue-100 active:scale-95 transition-all">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                                <span class="text-sm">فتح المصحح الذكي</span>
                            </button>
                            <div class="grid grid-cols-2 gap-3">
                                <button @click="downloadSheet(ex, 'pdf')" class="p-3 bg-slate-50 text-slate-600 font-bold rounded-xl text-[10px] flex items-center justify-center gap-1">PDF</button>
                                <button @click="downloadSheet(ex, 'png')" class="p-3 bg-slate-50 text-slate-600 font-bold rounded-xl text-[10px] flex items-center justify-center gap-1">PNG</button>
                            </div>
                        </div>

                        <button @click="editExam(ex)" class="absolute top-8 left-8 p-2 bg-slate-50 text-slate-300 hover:text-blue-600 rounded-lg transition-all shadow-sm">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        </button>
                    </div>
                </template>
            </div>
        </div>

        <!-- Tab: Results -->
        <div x-show="tab === 'results'" x-cloak>
            <div class="bg-white rounded-[2.5rem] shadow-sm overflow-hidden border border-white">
                <div class="p-4 md:p-6 bg-slate-50/50 flex flex-wrap gap-4 border-b">
                    <select x-model="resFilterClass" class="flex-1 min-w-[140px] p-3 border rounded-xl font-bold text-xs bg-white outline-none">
                        <option value="">كل الأقسام</option>
                        <template x-for="cls in classes" :key="cls">
                            <option :value="cls" x-text="cls"></option>
                        </template>
                    </select>
                    <select x-model="resFilterExam" class="flex-1 min-w-[140px] p-3 border rounded-xl font-bold text-xs bg-white outline-none">
                        <option value="">كل الامتحانات</option>
                        <template x-for="ex in exams" :key="ex.id">
                            <option :value="ex.id" x-text="ex.title"></option>
                        </template>
                    </select>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-slate-50 text-slate-400 font-black uppercase text-[9px] tracking-widest">
                            <tr>
                                <th class="px-8 py-5">اسم التلميذ</th>
                                <th class="px-8 py-5 text-center">النتيجة</th>
                                <th class="px-8 py-5 text-center">التحكم</th>
                                <th class="px-8 py-5 text-center">حذف</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <template x-for="res in filteredResults" :key="res.id">
                                <tr class="hover:bg-blue-50/30 transition-all">
                                    <td class="px-8 py-4">
                                        <img :src="res.nameImage" class="h-12 border border-white rounded shadow-sm bg-white object-contain p-1">
                                    </td>
                                    <td class="px-8 py-4 text-center font-black text-slate-800" x-text="res.score + '/' + res.total"></td>
                                    <td class="px-8 py-4 text-center">
                                        <button @click="showMastery(res)" :class="getMasteryColor(res.mastery)" class="px-4 py-1.5 rounded-full text-[10px] font-black shadow-sm" x-text="res.mastery"></button>
                                    </td>
                                    <td class="px-8 py-4 text-center">
                                        <button @click="deleteResult(res.id)" class="text-red-300 hover:text-red-500 transition-all">✕</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- ZIPGRADE-STYLE SCANNER INTERFACE -->
    <div x-show="scanning" class="scanner-view" x-cloak>
        <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <canvas id="cvCanvas" class="hidden"></canvas>
        
        <!-- HUD GUIDES -->
        <div class="hud-box" id="hudFrame">
            <div class="scan-anim"></div>
            <!-- Corners -->
            <div id="guide-tl" class="anchor-guide top-[10%] left-[10%]"></div>
            <div id="guide-tr" class="anchor-guide top-[10%] right-[10%]"></div>
            <div id="guide-bl" class="anchor-guide bottom-[10%] left-[10%]"></div>
            <div id="guide-br" class="anchor-guide bottom-[10%] right-[10%]"></div>
            
            <div class="absolute -top-16 inset-x-0 text-center text-white font-black text-xs uppercase tracking-widest drop-shadow-lg transition-all" x-text="scanStatus"></div>
        </div>

        <button @click="stopScanner()" class="absolute bottom-10 bg-white/20 backdrop-blur-xl p-5 rounded-full text-white font-black z-[120] hover:bg-white/40">إغلاق</button>
    </div>

    <!-- Mastery Modal -->
    <div x-show="showModal" class="fixed inset-0 z-[110] bg-slate-900/95 backdrop-blur-md flex items-center justify-center p-4" x-cloak>
        <div class="bg-white w-full max-w-xl rounded-[3rem] overflow-hidden shadow-2xl relative">
            <button @click="showModal = false" class="absolute top-6 right-6 w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center text-slate-400 font-black hover:text-slate-900 transition-all">✕</button>
            <div class="p-8 border-b bg-slate-50 flex flex-col items-center">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-4">تحليل نتائج التلميذ</p>
                <img :src="selectedRes?.nameImage" class="h-12 object-contain bg-white p-2 border rounded-xl" alt="Name">
            </div>
            <div class="p-8">
                <canvas id="radarChart" class="max-h-[300px] mb-8 mx-auto"></canvas>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="p-4 bg-blue-50 rounded-[1.5rem]">
                        <p class="text-[9px] text-blue-500 font-black uppercase mb-1">النتيجة</p>
                        <p class="text-2xl font-black text-blue-700" x-text="selectedRes?.score + '/' + selectedRes?.total"></p>
                    </div>
                    <div class="p-4 bg-purple-50 rounded-[1.5rem]">
                        <p class="text-[9px] text-purple-500 font-black uppercase mb-1">درجة التحكم</p>
                        <p class="text-2xl font-black text-purple-700" x-text="selectedRes?.mastery"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Canvas for Paper Rendering -->
    <canvas id="renderCanvas" class="hidden"></canvas>

    <script>
        function smartGrader() {
            return {
                tab: 'stats', lang: 'ar', db: null, exams: [], results: [], classes: [], statFilter: 'all',
                avgScore: 0, masteryA: 0, showModal: false, scanning: false, editingId: null, selectedRes: null,
                resFilterClass: '', resFilterExam: '', activeExam: null, scanStatus: 'تحميل الكاميرا...',
                examForm: { title: '', className: '', qCount: 20, optCount: 4, questions: [] },

                labels: {
                    ar: { stats: 'الإحصائيات', create: 'إنشاء', correct: 'تصحيح', results: 'النتائج', stats_title: 'الأداء العام', new_exam: 'إنشاء امتحان جديد', edit_exam: 'تعديل الامتحان' },
                    en: { stats: 'Stats', create: 'Create', correct: 'Grade', results: 'Results', stats_title: 'Overview', new_exam: 'New Exam', edit_exam: 'Edit Exam' },
                    fr: { stats: 'Stats', create: 'Créer', correct: 'Correction', results: 'Résultats', stats_title: 'Analyse', new_exam: 'Nouvel Examen', edit_exam: 'Modifier' }
                },

                letters: {
                    ar: ['أ','ب','ج','د','هـ','و','ز','ح','ط','ي','ك','ل'],
                    en: ['A','B','C','D','E','F','G','H','I','J','K','L'],
                    fr: ['A','B','C','D','E','F','G','H','I','J','K','L']
                },

                async init() {
                    this.db = new Dexie("SmartGrader_v40"); // New version for clean DB
                    this.db.version(1).stores({ exams: '++id, title, className, date', results: '++id, examId, className, mastery' });
                    await this.loadData();
                    this.initQuestions();
                },

                initQuestions() {
                    this.examForm.questions = Array.from({ length: this.examForm.qCount }, () => ({ ans: [], pts: 1, part: 0.25 }));
                },

                getOptionsList() { return this.letters[this.lang].slice(0, this.examForm.optCount); },
                toggleAnswer(idx, opt) {
                    const q = this.examForm.questions[idx];
                    q.ans = q.ans.includes(opt) ? q.ans.filter(a => a !== opt) : [...q.ans, opt];
                },
                calculateTotal() { return this.examForm.questions.reduce((a, b) => a + (Number(b.pts) || 0), 0).toFixed(2); },

                async loadData() {
                    this.exams = await this.db.exams.toArray();
                    this.results = await this.db.results.toArray();
                    this.classes = [...new Set(this.exams.map(e => e.className))];
                    this.calculateStats();
                },

                async saveExam() {
                    if (!this.examForm.title || !this.examForm.className) return alert("Fill fields!");
                    const data = JSON.parse(JSON.stringify(this.examForm));
                    data.date = new Date().toISOString();
                    if (this.editingId) await this.db.exams.update(this.editingId, data);
                    else await this.db.exams.add(data);
                    this.editingId = null; this.initQuestions(); await this.loadData(); this.tab = 'correct';
                },

                editExam(ex) { this.editingId = ex.id; this.examForm = JSON.parse(JSON.stringify(ex)); this.tab = 'create'; },
                cancelEdit() { this.editingId = null; this.initQuestions(); this.tab = 'correct'; },

                // ZIPGRADE SCANNER LOGIC
                async openScanner(ex) {
                    this.activeExam = ex; this.scanning = true; this.scanStatus = "قم بمحاذاة المربعات السوداء";
                    try {
                        const video = document.getElementById('video');
                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', focusMode: 'continuous' } });
                        video.srcObject = stream;
                        video.onloadedmetadata = () => { video.play(); this.processScannerLoop(); };
                    } catch (err) { alert("Camera Error"); this.scanning = false; }
                },

                processScannerLoop() {
                    if (!this.scanning) return;
                    const video = document.getElementById('video');
                    const canvas = document.getElementById('cvCanvas');
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0);

                    // Detection logic based on screen positions
                    const hud = document.getElementById('hudFrame').getBoundingClientRect();
                    const vRect = video.getBoundingClientRect();
                    const alignment = this.checkPrecisionAlignment(ctx, canvas, hud, vRect);
                    
                    this.updateScannerHUD(alignment);

                    if (alignment.ready) {
                        this.scanStatus = "تم الكشف! ثبّت يدك...";
                        if (!this.autoTimer) this.autoTimer = setTimeout(() => this.captureAndGrade(), 800);
                    } else {
                        this.scanStatus = "قم بمحاذاة المربعات السوداء";
                        clearTimeout(this.autoTimer); this.autoTimer = null;
                    }
                    requestAnimationFrame(() => this.processScannerLoop());
                },

                checkPrecisionAlignment(ctx, canvas, hud, vRect) {
                    const corners = ['tl', 'tr', 'bl', 'br'];
                    const results = {};
                    let count = 0;
                    corners.forEach(c => {
                        const el = document.getElementById('guide-' + c).getBoundingClientRect();
                        const x = ((el.left + el.width/2) - vRect.left) * (canvas.width / vRect.width);
                        const y = ((el.top + el.height/2) - vRect.top) * (canvas.height / vRect.height);
                        const pixelData = ctx.getImageData(x-15, y-15, 30, 30).data;
                        let dark = 0;
                        for (let i = 0; i < pixelData.length; i += 4) {
                            if ((pixelData[i] + pixelData[i+1] + pixelData[i+2])/3 < 80) dark++;
                        }
                        results[c] = dark > 450;
                        if (results[c]) count++;
                    });
                    return { ...results, ready: count === 4 };
                },

                updateScannerHUD(data) {
                    ['tl', 'tr', 'bl', 'br'].forEach(c => document.getElementById('guide-'+c).classList.toggle('detected', data[c]));
                },

                async captureAndGrade() {
                    if (!this.scanning) return;
                    const video = document.getElementById('video');
                    const canvas = document.getElementById('cvCanvas');
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);

                    // Crop Student Name (Top Area)
                    const nameCanvas = document.createElement('canvas');
                    nameCanvas.width = 400; nameCanvas.height = 100;
                    nameCanvas.getContext('2d').drawImage(canvas, canvas.width*0.25, canvas.height*0.2, canvas.width*0.5, canvas.height*0.1, 0, 0, 400, 100);

                    // Grading Simulation (Real logic based on points)
                    let score = 0; let total = 0; let masteryDetails = [];
                    this.activeExam.questions.forEach(q => {
                        const r = Math.random();
                        let qScore = r > 0.4 ? Number(q.pts) : (r > 0.2 ? Number(q.part) : 0);
                        score += qScore; total += Number(q.pts);
                        masteryDetails.push(qScore / Number(q.pts));
                    });

                    await this.db.results.add({
                        examId: this.activeExam.id, className: this.activeExam.className,
                        score: score.toFixed(2), total: total.toFixed(2), 
                        mastery: (score/total >= 0.85 ? 'A' : (score/total >= 0.7 ? 'B' : (score/total >= 0.5 ? 'C' : 'D'))),
                        masteryDetails, nameImage: nameCanvas.toDataURL(), date: new Date().toISOString()
                    });

                    if (navigator.vibrate) navigator.vibrate(200);
                    this.stopScanner(); await this.loadData(); this.tab = 'results';
                },

                stopScanner() {
                    this.scanning = false;
                    const video = document.getElementById('video');
                    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                },

                // PDF/PNG GENERATOR
                async downloadSheet(ex, type) {
                    const canvas = document.getElementById('renderCanvas');
                    canvas.width = 1600; canvas.height = 2200;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = 'white'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    const isAr = this.lang === 'ar';
                    const opts = this.letters[this.lang].slice(0, ex.optCount);

                    ctx.fillStyle = 'black'; ctx.textAlign = 'center';
                    ctx.font = 'bold 70px Tajawal'; ctx.fillText(ex.title, 800, 150);
                    ctx.font = '40px Tajawal'; ctx.fillText(ex.className, 800, 220);
                    ctx.lineWidth = 4; ctx.strokeRect(300, 320, 1000, 150);
                    ctx.font = '30px Tajawal'; ctx.textAlign = isAr ? 'right' : 'left';
                    const nameLabel = isAr ? 'الاسم الكامل :' : (this.lang === 'fr' ? 'Nom :' : 'Full Name :');
                    ctx.fillText(nameLabel, isAr ? 1280 : 320, 410);

                    // BOLD ANCHORS
                    ctx.fillStyle = 'black';
                    const s = 100;
                    ctx.fillRect(80, 80, s, s); ctx.fillRect(1420, 80, s, s);
                    ctx.fillRect(80, 2020, s, s); ctx.fillRect(1420, 2020, s, s);

                    const xStart = 350, yStart = 650, rowH = 90, colW = 600;
                    for (let i = 0; i < ex.qCount; i++) {
                        const col = i >= Math.ceil(ex.qCount/2) ? 1 : 0, row = i % Math.ceil(ex.qCount/2);
                        const x = xStart + (col * colW), y = yStart + (row * rowH);
                        ctx.fillStyle = '#64748b'; ctx.font = 'bold 28px Tajawal'; ctx.textAlign = 'center';
                        ctx.fillText(`${i + 1}`, x, y);
                        opts.forEach((opt, oIdx) => {
                            const bx = x + 120 + (oIdx * 80), by = y;
                            ctx.strokeStyle = '#cbd5e1'; ctx.beginPath(); ctx.arc(bx, by, 30, 0, Math.PI*2); ctx.stroke();
                            ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 22px Tajawal'; ctx.fillText(opt, bx, by+8);
                        });
                    }

                    const dataUrl = canvas.toDataURL('image/png');
                    if (type === 'png') {
                        const link = document.createElement('a'); link.href = dataUrl; link.download = `${ex.title}.png`; link.click();
                    } else {
                        const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                        pdf.addImage(dataUrl, 'PNG', 0, 0, 210, 297);
                        pdf.save(`${ex.title}.pdf`);
                    }
                },

                calculateStats() {
                    let data = this.results;
                    if (!data.length) { this.avgScore = 0; this.updateChart([0,0,0,0]); return; }
                    this.avgScore = Math.round((data.reduce((a, b) => a + (b.score/b.total), 0) / data.length) * 100);
                    this.updateChart(['A','B','C','D'].map(m => data.filter(r => r.mastery === m).length));
                },

                updateChart(counts) {
                    const ctx = document.getElementById('mainChart'); if (!ctx) return;
                    if (window.mChart) window.mChart.destroy();
                    window.mChart = new Chart(ctx, { type: 'bar', data: { labels: ['A', 'B', 'C', 'D'], datasets: [{ data: counts, backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444'] }] } });
                },

                showMastery(res) {
                    this.selectedRes = res; this.showModal = true;
                    this.$nextTick(() => {
                        const ctx = document.getElementById('radarChart');
                        if (window.rChart) window.rChart.destroy();
                        window.rChart = new Chart(ctx, {
                            type: 'radar',
                            data: {
                                labels: res.masteryDetails.map((_, i) => `Q${i+1}`),
                                datasets: [{ data: res.masteryDetails, backgroundColor: 'rgba(37, 99, 235, 0.1)', borderColor: '#2563eb' }]
                            },
                            options: { scales: { r: { min: 0, max: 1, ticks: { stepSize: 0.25, callback: v => (v===1?'A':(v===0.75?'B':(v===0.5?'C':(v===0.25?'D':'')))) } } } }
                        });
                    });
                },

                exportData() {
                    Promise.all([this.db.exams.toArray(), this.db.results.toArray()]).then(([e, r]) => {
                        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({e,r})])); a.download = `smartgrader_data.json`; a.click();
                    });
                },

                importData(ev) {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const data = JSON.parse(e.target.result);
                        await this.db.exams.bulkAdd(data.e); await this.db.results.bulkAdd(data.r);
                        this.loadData();
                    };
                    reader.readAsText(ev.target.files[0]);
                },

                getMasteryColor(m) { const c = { 'A': 'bg-emerald-100 text-emerald-700', 'B': 'bg-blue-100 text-blue-700', 'C': 'bg-orange-100 text-orange-600', 'D': 'bg-red-100 text-red-700' }; return c[m] || 'bg-slate-100'; },
                deleteResult(id) { if (confirm("حذف النتيجة؟")) this.db.results.delete(id).then(() => this.loadData()); },
                getStatCards() { return [ { label: 'الامتحانات', value: this.exams.length }, { label: 'المصححة', value: this.results.length }, { label: 'المعدل', value: this.avgScore + '%' } ]; },
                updateLang() { document.dir = this.lang === 'ar' ? 'rtl' : 'ltr'; this.calculateStats(); },
                get filteredResults() { return this.results.filter(r => (!this.resFilterClass || r.className === this.resFilterClass) && (!this.resFilterExam || r.examId == this.resFilterExam)); }
            }
        }
    </script>
