<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMark Pro - الإصدار الاحترافي المستقر</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; overflow: hidden; }
        
        /* Sidebar Responsive */
        aside { transition: transform 0.3s ease-in-out; z-index: 50; }
        @media (max-width: 767px) { aside { position: fixed; top: 0; right: 0; bottom: 0; transform: translateX(100%); width: 280px; } .sidebar-open aside { transform: translateX(0); } }

        /* Scanner Target Viewfinders (ZipGrade Style) */
        .scanner-active { display: flex !important; }
        .target-box { position: absolute; width: 70px; height: 70px; border: 5px solid rgba(59, 130, 246, 0.4); z-index: 100; transition: all 0.2s; }
        .target-box.matched { border-color: #10b981; background: rgba(16, 185, 129, 0.1); border-width: 8px; }
        .t-tr { top: 12%; right: 10%; border-left: 0; border-bottom: 0; }
        .t-tl { top: 12%; left: 10%; border-right: 0; border-bottom: 0; }
        .t-br { bottom: 12%; right: 10%; border-left: 0; border-top: 0; }
        .t-bl { bottom: 12%; left: 10%; border-right: 0; border-top: 0; }

        /* Bubble UI */
        .bubble-select { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; transition: 0.2s; cursor: pointer; }
        .bubble-select.selected { background-color: #4f46e5; color: white; border-color: #4f46e5; transform: scale(1.1); }
        .bubble-correct { background-color: #10b981 !important; color: white; border-color: #10b981 !important; }
        .bubble-wrong { background-color: #ef4444 !important; color: white; border-color: #ef4444 !important; }

        /* Sheet Generation - Fixed Layouts */
        #sheet-gen-container { position: fixed; left: -9999px; top: 0; }
        .a4-page { width: 210mm; min-height: 297mm; background: white; position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; padding: 2mm; }
        .omr-sheet { background: white; border: 1.5px solid #000; position: relative; display: flex; flex-direction: column; color: black; box-sizing: border-box; overflow: hidden; margin: 2mm; padding: 8mm; }
        
        .layout-1 .omr-sheet { width: 200mm; height: 285mm; }
        .layout-2 .omr-sheet { width: 200mm; height: 140mm; }
        .layout-4 .omr-sheet { width: 100mm; height: 140mm; padding: 5mm; }

        .anchor { position: absolute; width: 9mm; height: 9mm; background: black; z-index: 10; }
        .an-tr { top: 0; right: 0; } .an-tl { top: 0; left: 0; }
        .an-br { bottom: 0; right: 0; } .an-bl { bottom: 0; left: 0; }

        .q-row { display: flex; align-items: center; height: 28px; margin-bottom: 3px; gap: 6px; }
        .q-num { width: 28px; font-weight: 900; font-size: 13px; text-align: left; border-left: 2px solid #000; padding-left: 4px; display: flex; align-items: center; height: 100%; }
        .q-bubble { width: 20px; height: 20px; border: 1.8px solid black; border-radius: 50%; }
        
        .col-header { display: flex; margin-bottom: 5px; padding-right: 34px; gap: 6px; }
        .header-letter { width: 20px; text-align: center; font-weight: 900; font-size: 14px; }

        #scanResultPopup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; z-index: 200; border-radius: 24px; width: 85%; max-width: 340px; padding: 25px; box-shadow: 0 30px 60px rgba(0,0,0,0.4); border: 2px solid #4f46e5; }
    </style>
</head>
<body class="text-slate-900 bg-slate-50">

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl shrink-0">
            <div class="p-8 border-b border-slate-800 text-center">
                <h1 class="text-2xl font-black text-indigo-400">SMART MARK</h1>
                <p class="text-[10px] text-slate-500 mt-1 uppercase">ZipGrade Simulation Pro</p>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="switchTab('dashboard')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 bg-indigo-600" id="btn-dashboard"><i class="fa-solid fa-chart-line"></i> الإحصائيات</button>
                <button onclick="switchTab('create')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 text-slate-400" id="btn-create"><i class="fa-solid fa-plus-circle"></i> إنشاء امتحان</button>
                <button onclick="switchTab('manage')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 text-slate-400" id="btn-manage"><i class="fa-solid fa-tasks"></i> إدارة الامتحانات</button>
                <button onclick="switchTab('results')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 text-slate-400" id="btn-results"><i class="fa-solid fa-history"></i> النتائج</button>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 w-full relative">
            <header class="bg-white border-b p-4 flex justify-between items-center shadow-sm z-10">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-600 p-2"><i class="fa-solid fa-bars text-xl"></i></button>
                <h2 id="current-tab-title" class="font-bold text-slate-800">لوحة القيادة</h2>
                <div id="cv-status" class="flex items-center gap-2 text-xs font-bold text-red-500">
                    <span class="w-2 h-2 bg-current rounded-full"></span> <span id="status-text">AI Loading...</span>
                </div>
            </header>

            <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8">
                <!-- Dashboard Content -->
                <section id="tab-dashboard" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100"><p class="text-slate-500 text-xs font-bold mb-1">الامتحانات</p><h3 class="text-4xl font-black text-indigo-600" id="stat-exams">0</h3></div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100"><p class="text-slate-500 text-xs font-bold mb-1">الأوراق</p><h3 class="text-4xl font-black text-emerald-600" id="stat-papers">0</h3></div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100"><p class="text-slate-500 text-xs font-bold mb-1">المعدل العام</p><h3 class="text-4xl font-black text-amber-500" id="stat-average">0%</h3></div>
                    </div>
                </section>

                <!-- Create Exam Content -->
                <section id="tab-create" class="hidden max-w-4xl mx-auto">
                    <div class="bg-white rounded-[40px] shadow-2xl p-8 space-y-6 border">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="examTitle" placeholder="اسم الامتحان" class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 outline-none focus:border-indigo-500 transition">
                            <input type="text" id="examClass" placeholder="القسم" class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 outline-none focus:border-indigo-500 transition">
                        </div>
                        <div class="grid grid-cols-3 gap-4 bg-slate-50 p-6 rounded-3xl border">
                            <div><label class="text-[10px] font-bold">الأسئلة</label><input type="number" id="qCount" value="20" onchange="renderKeyGrid('create')" class="w-full mt-1 p-3 rounded-xl border-none"></div>
                            <div><label class="text-[10px] font-bold">الخيارات</label><input type="number" id="oCount" value="4" onchange="renderKeyGrid('create')" class="w-full mt-1 p-3 rounded-xl border-none"></div>
                            <div><label class="text-[10px] font-bold">النقطة/س</label><input type="number" id="pointsPerQ" value="1" step="0.25" class="w-full mt-1 p-3 rounded-xl border-none"></div>
                        </div>
                        <div id="answerKeyGrid" class="grid gap-2 overflow-x-auto pb-4"></div>
                        <button onclick="saveExam()" class="w-full bg-indigo-600 text-white font-black py-5 rounded-3xl shadow-xl hover:bg-indigo-700 transition">حفظ الامتحان</button>
                    </div>
                </section>

                <!-- Manage Content -->
                <section id="tab-manage" class="hidden">
                    <div id="manageGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </section>

                <!-- Results Content -->
                <section id="tab-results" class="hidden">
                    <div class="bg-white rounded-[32px] border overflow-hidden shadow-sm">
                        <div class="overflow-x-auto">
                            <table class="w-full text-right min-w-[600px]">
                                <thead class="bg-slate-50 text-slate-400 text-[11px] font-black uppercase">
                                    <tr><th class="p-6">التلميذ</th><th class="p-6">الامتحان</th><th class="p-6 text-center">النتيجة</th><th class="p-6 text-center">إجراءات</th></tr>
                                </thead>
                                <tbody id="resultsTableBody" class="divide-y divide-slate-100"></tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Scanner Interface -->
    <div id="scannerModal" class="fixed inset-0 bg-black z-[100] hidden flex-col">
        <div class="absolute top-8 left-8 z-[110]">
            <button onclick="closeScanner()" class="bg-white/20 backdrop-blur text-white px-8 py-3 rounded-full font-black">إغلاق</button>
        </div>
        <div class="relative flex-1 flex items-center justify-center">
            <video id="videoInput" playsinline autoplay muted class="w-full h-full object-cover opacity-60"></video>
            <div class="target-box t-tr"></div><div class="target-box t-tl"></div>
            <div class="target-box t-br"></div><div class="target-box t-bl"></div>
            <div id="scanStatusMsg" class="absolute bottom-24 text-white font-bold bg-black/50 px-8 py-3 rounded-full backdrop-blur">انتظر اكتشاف الورقة...</div>
        </div>
        <canvas id="processCanvas" class="hidden"></canvas>
    </div>

    <!-- Popup Result -->
    <div id="scanResultPopup" class="text-center">
        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-check text-4xl"></i></div>
        <h3 class="font-black text-slate-800 text-xl">تم التصحيح بنجاح!</h3>
        <p id="popupScoreDisplay" class="text-5xl font-black text-indigo-600 my-6">0 / 0</p>
        <div class="flex gap-2">
            <button onclick="dismissPopup()" class="flex-1 bg-indigo-600 text-white font-bold py-4 rounded-2xl">التالي</button>
            <button onclick="cancelScan()" class="flex-1 bg-slate-100 text-slate-400 font-bold py-4 rounded-2xl">حذف</button>
        </div>
    </div>

    <!-- Modals -->
    <div id="downloadModal" class="fixed inset-0 bg-slate-900/90 hidden z-[120] flex items-center justify-center p-4">
        <div class="bg-white rounded-[40px] p-10 w-full max-w-md shadow-2xl space-y-6">
            <h3 class="text-2xl font-black">تخطيط الطباعة</h3>
            <div class="space-y-4">
                <button onclick="setDownloadLayout(1)" id="lay1" class="w-full p-4 border-2 rounded-2xl text-right font-bold flex justify-between border-indigo-500">ورقة واحدة (A4 كاملة) <i class="fa-solid fa-check"></i></button>
                <button onclick="setDownloadLayout(2)" id="lay2" class="w-full p-4 border-2 rounded-2xl text-right font-bold flex justify-between border-slate-200">ورقتان (نصف A4)</button>
                <button onclick="setDownloadLayout(4)" id="lay4" class="w-full p-4 border-2 rounded-2xl text-right font-bold flex justify-between border-slate-200">4 أوراق (ربع A4)</button>
            </div>
            <div class="flex gap-2 border-t pt-6">
                <button onclick="processDownload('pdf')" class="flex-1 bg-red-600 text-white font-bold py-4 rounded-2xl">PDF</button>
                <button onclick="processDownload('png')" class="flex-1 bg-emerald-500 text-white font-bold py-4 rounded-2xl">PNG</button>
            </div>
            <button onclick="closeDownloadModal()" class="w-full text-slate-400 font-bold">رجوع</button>
        </div>
    </div>

    <div id="editKeyModal" class="fixed inset-0 bg-slate-900/90 hidden z-[120] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-3xl rounded-[32px] p-8 shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-xl font-bold mb-4 border-b pb-4">تعديل مفتاح الإجابة</h3>
            <div id="editKeyGrid" class="flex-1 overflow-y-auto grid gap-2 pb-6"></div>
            <div class="flex gap-4 pt-4 border-t">
                <button onclick="saveEditedKey()" class="flex-1 bg-emerald-600 text-white font-black py-4 rounded-2xl">حفظ</button>
                <button onclick="closeEditModal()" class="flex-1 bg-slate-100 py-4 rounded-2xl">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Preview Detail Modal -->
    <div id="previewResultModal" class="fixed inset-0 bg-black/95 hidden z-[150] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-[32px] overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold">معاينة ورقة التلميذ</h3>
                <button onclick="closePreviewResult()" class="text-slate-400 hover:text-red-500 text-2xl">&times;</button>
            </div>
            <div class="p-8 overflow-y-auto flex-1 space-y-8">
                <div class="flex flex-col items-center text-center space-y-4">
                    <img id="prevNameImg" class="h-16 border rounded-xl p-2 bg-white object-contain" alt="Name">
                    <div id="prevScore" class="text-5xl font-black text-indigo-600">0 / 0</div>
                </div>
                <div id="prevGrid" class="grid gap-2 border-t pt-8"></div>
                <div id="masteryList" class="grid grid-cols-2 sm:grid-cols-4 gap-4 border-t pt-8"></div>
            </div>
        </div>
    </div>

    <div id="sheet-gen-container"></div>
    <audio id="shutterSound" src="https://assets.mixkit.co/active_storage/sfx/712/712-preview.mp3"></audio>

    <script>
        let db = { exams: [], results: [] };
        let isCvLoaded = false, isScanning = false, lastResultId = null;
        let createKey = [], editingExamId = null, downloadExamId = null, activeLayout = 1;
        const ARABIC_OPTS = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي', 'ك', 'ل'];

        function onOpenCvReady() {
            isCvLoaded = true;
            document.getElementById('cv-status').innerHTML = '<span class="w-2 h-2 bg-emerald-500 rounded-full"></span> AI Active';
            document.getElementById('cv-status').classList.replace('text-red-500', 'text-emerald-500');
        }

        window.onload = () => {
            const saved = localStorage.getItem('sm_pro_v5_stable');
            if(saved) db = JSON.parse(saved);
            renderKeyGrid('create');
            updateStats();
        };

        function saveData() { localStorage.setItem('sm_pro_v5_stable', JSON.stringify(db)); updateStats(); }
        function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }

        function switchTab(tabId) {
            ['dashboard', 'create', 'manage', 'results'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-' + t).classList.replace('bg-indigo-600', 'text-slate-400');
            });
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).classList.replace('text-slate-400', 'bg-indigo-600');
            if(tabId === 'manage') renderManageGrid();
            if(tabId === 'results') renderResultsTable();
            if(tabId === 'dashboard') updateStats();
            if(window.innerWidth < 768 && document.body.classList.contains('sidebar-open')) toggleSidebar();
        }

        function renderKeyGrid(mode, examData = null) {
            const q = mode === 'create' ? parseInt(document.getElementById('qCount').value) : examData.qCount;
            const o = mode === 'create' ? parseInt(document.getElementById('oCount').value) : examData.oCount;
            const container = document.getElementById(mode === 'create' ? 'answerKeyGrid' : 'editKeyGrid');
            
            if(mode === 'create') { if(createKey.length !== q) createKey = Array(q).fill().map(() => []); }
            else { if(createKey.length !== q) createKey = JSON.parse(JSON.stringify(examData.key)); }

            container.innerHTML = '';
            container.style.gridTemplateColumns = `40px repeat(${o}, 1fr)`;
            for(let i=0; i<q; i++) {
                const num = document.createElement('div');
                num.className = "flex items-center justify-center font-black text-slate-300 text-xs";
                num.innerText = i + 1;
                container.appendChild(num);
                for(let j=0; j<o; j++) {
                    const bubble = document.createElement('div');
                    const isSel = createKey[i].includes(j);
                    bubble.className = `bubble-select mx-auto ${isSel ? 'selected' : ''}`;
                    bubble.innerText = ARABIC_OPTS[j];
                    bubble.onclick = () => {
                        const idx = createKey[i].indexOf(j);
                        if(idx > -1) createKey[i].splice(idx, 1); else createKey[i].push(j);
                        renderKeyGrid(mode, examData);
                    };
                    container.appendChild(bubble);
                }
            }
        }

        function saveExam() {
            const title = document.getElementById('examTitle').value;
            if(!title) return alert("يرجى إدخال اسم الامتحان");
            db.exams.push({
                id: Date.now(), title, class: document.getElementById('examClass').value,
                qCount: parseInt(document.getElementById('qCount').value),
                oCount: parseInt(document.getElementById('oCount').value),
                pointsPerQ: parseFloat(document.getElementById('pointsPerQ').value),
                key: JSON.parse(JSON.stringify(createKey)),
                timestamp: new Date().toISOString()
            });
            saveData();
            switchTab('manage');
        }

        function renderManageGrid() {
            const grid = document.getElementById('manageGrid'); grid.innerHTML = '';
            db.exams.forEach(exam => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-3xl border shadow-sm flex flex-col";
                card.innerHTML = `
                    <h4 class="font-bold text-lg mb-1 truncate">${exam.title}</h4>
                    <p class="text-xs text-slate-400 mb-6">${exam.class} | ${exam.qCount} س</p>
                    <div class="grid grid-cols-2 gap-3 mt-auto">
                        <button onclick="startScanning(${exam.id})" class="bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-indigo-100">بدء التصحيح</button>
                        <button onclick="openDownloadModal(${exam.id})" class="bg-slate-50 py-4 rounded-2xl font-bold">النموذج</button>
                        <button onclick="openEditModal(${exam.id})" class="bg-amber-100 text-amber-700 py-4 rounded-2xl font-bold col-span-2">تعديل المفتاح</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- Restored & Fixed Key Editing ---
        function openEditModal(id) {
            editingExamId = id;
            const exam = db.exams.find(e => e.id === id);
            createKey = JSON.parse(JSON.stringify(exam.key));
            renderKeyGrid('edit', exam);
            document.getElementById('editKeyModal').classList.remove('hidden');
        }

        function saveEditedKey() {
            const idx = db.exams.findIndex(e => e.id === editingExamId);
            db.exams[idx].key = JSON.parse(JSON.stringify(createKey));
            saveData();
            closeEditModal();
        }
        function closeEditModal() { document.getElementById('editKeyModal').classList.add('hidden'); }

        // --- Sheet Generation Engine (Final Stable) ---
        function openDownloadModal(id) { downloadExamId = id; document.getElementById('downloadModal').classList.remove('hidden'); }
        function closeDownloadModal() { document.getElementById('downloadModal').classList.add('hidden'); }
        function setDownloadLayout(n) { 
            activeLayout = n; 
            [1,2,4].forEach(l => {
                document.getElementById('lay'+l).classList.replace('border-indigo-500', 'border-slate-200');
                document.getElementById('lay'+l).innerHTML = document.getElementById('lay'+l).innerHTML.replace(' <i class="fa-solid fa-check"></i>', '');
            });
            document.getElementById('lay'+n).classList.replace('border-slate-200', 'border-indigo-500');
            document.getElementById('lay'+n).innerHTML += ' <i class="fa-solid fa-check"></i>';
        }

        async function generateSheetHTML(id, layout) {
            const exam = db.exams.find(e => e.id === id);
            const container = document.getElementById('sheet-gen-container');
            container.innerHTML = `<div class="a4-page layout-${layout}"></div>`;
            const page = container.querySelector('.a4-page');
            for(let i=0; i<layout; i++) {
                const sheet = document.createElement('div');
                sheet.className = `omr-sheet`;
                sheet.innerHTML = `
                    <div class="anchor an-tl"></div><div class="anchor an-tr"></div>
                    <div class="anchor an-bl"></div><div class="anchor an-br"></div>
                    <div class="flex justify-between items-start mb-4 border-b-2 border-slate-200 pb-4 mt-8">
                        <div><h1 class="text-xl font-black">${exam.title}</h1><p class="text-[9px] font-bold text-slate-400">SMARTMARK Professional OMR</p></div>
                        <div id="qr-${i}"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-4 border-2 border-black p-3 rounded-xl">
                        <div class="border-b border-black pb-1 text-xs font-bold">اسم التلميذ: ..............................</div>
                        <div class="border-b border-black pb-1 text-xs font-bold">القسم: ${exam.class}</div>
                    </div>
                    <div class="flex-1 flex flex-wrap gap-x-8 gap-y-4 content-start overflow-hidden">${renderSheetColumns(exam.qCount, exam.oCount)}</div>
                `;
                page.appendChild(sheet);
                new QRCode(sheet.querySelector(`#qr-${i}`), { text: `SM-${exam.id}`, width: 45, height: 45 });
            }
        }

        function renderSheetColumns(qCount, oCount) {
            let html = ''; const chunkSize = 10;
            for(let c=0; c < Math.ceil(qCount/chunkSize); c++) {
                html += `<div class="column">
                    <div class="col-header">${ARABIC_OPTS.slice(0, oCount).map(l => `<div class="header-letter">${l}</div>`).join('')}</div>`;
                const start = c * chunkSize, end = Math.min(start + chunkSize, qCount);
                for(let i=start; i<end; i++) {
                    html += `<div class="q-row"><div class="q-num">${i+1}</div>`;
                    for(let j=0; j<oCount; j++) html += `<div class="q-bubble"></div>`;
                    html += `</div>`;
                }
                html += `</div>`;
            }
            return html;
        }

        async function processDownload(format) {
            await generateSheetHTML(downloadExamId, activeLayout);
            const exam = db.exams.find(e => e.id === downloadExamId);
            const canvas = await html2canvas(document.querySelector('.a4-page'), { scale: 2 });
            if(format === 'png') {
                const link = document.createElement('a'); link.download = `${exam.title}.png`; link.href = canvas.toDataURL(); link.click();
            } else {
                const { jsPDF } = window.jspdf; const pdf = new jsPDF('p', 'mm', 'a4');
                pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297); pdf.save(`${exam.title}.pdf`);
            }
            closeDownloadModal();
        }

        // --- Camera & Strict Auto-Scanning Logic ---
        function startScanning(id) {
            currentExamId = id; isScanning = true;
            document.getElementById('scannerModal').classList.add('scanner-active');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', focusMode: 'continuous', width: {ideal: 1280}, height: {ideal: 720} } })
                .then(s => { window.stream = s; document.getElementById('videoInput').srcObject = s; requestAnimationFrame(scanLoop); });
        }

        function closeScanner() { isScanning = false; document.getElementById('scannerModal').classList.remove('scanner-active'); if(window.stream) window.stream.getTracks().forEach(t => t.stop()); }

        async function scanLoop() {
            if(!isScanning || !isCvLoaded) return;
            const video = document.getElementById('videoInput');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.getElementById('processCanvas');
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);

                let src = cv.imread(canvas), gray = new cv.Mat(); cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                let thresh = new cv.Mat(); cv.adaptiveThreshold(gray, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);
                let contours = new cv.MatVector(), hierarchy = new cv.Mat();
                cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let anchors = [];
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i), area = cv.contourArea(cnt);
                    if (area > 800 && area < 6000) {
                        let peri = cv.arcLength(cnt, true), approx = new cv.Mat();
                        cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                        if (approx.rows === 4) {
                            let rect = cv.boundingRect(approx);
                            if (Math.abs(1 - rect.width/rect.height) < 0.25) anchors.push(approx);
                            else approx.delete();
                        } else approx.delete();
                    }
                }

                if (anchors.length === 4) {
                    // Geometric Validation: Are they forming a large rectangle?
                    let pts = anchors.map(a => { let r = cv.boundingRect(a); return { x: r.x + r.width/2, y: r.y + r.height/2 }; });
                    let distTop = Math.abs(pts[0].x - pts[1].x);
                    if (distTop > canvas.width * 0.3) { // Require significant distance
                        updateTargetBoxes(anchors, true);
                        isScanning = false; document.getElementById('shutterSound').play();
                        await performScan(src, anchors);
                    }
                } else {
                    updateTargetBoxes(anchors, false);
                }
                src.delete(); gray.delete(); thresh.delete(); contours.delete(); hierarchy.delete();
            }
            if(isScanning) requestAnimationFrame(scanLoop);
        }

        function updateTargetBoxes(anchors, isValid) {
            const boxes = document.querySelectorAll('.target-box');
            const msg = document.getElementById('scanStatusMsg');
            boxes.forEach(b => b.classList.toggle('matched', isValid && anchors.length === 4));
            msg.innerText = isValid ? "تم الاكتشاف! جاري التصوير..." : "صوب الكاميرا نحو المربعات الأربعة";
        }

        async function performScan(src, anchors) {
            let pts = anchors.map(a => { let r = cv.boundingRect(a); return { x: r.x + r.width/2, y: r.y + r.height/2 }; });
            pts.sort((a,b) => a.y - b.y);
            let top = pts.slice(0, 2).sort((a,b) => b.x - a.x), bottom = pts.slice(2, 4).sort((a,b) => b.x - a.x);
            let sc = cv.matFromArray(4, 1, cv.CV_32FC2, [top[0].x, top[0].y, top[1].x, top[1].y, bottom[1].x, bottom[1].y, bottom[0].x, bottom[0].y]);
            let dc = cv.matFromArray(4, 1, cv.CV_32FC2, [600, 0, 0, 0, 0, 800, 600, 800]);
            let M = cv.getPerspectiveTransform(sc, dc), warped = new cv.Mat(); cv.warpPerspective(src, warped, M, new cv.Size(600, 800));

            // ROI capture for Student Name based on precise grid
            let nameROI = warped.roi(new cv.Rect(40, 115, 520, 85));
            const canvas = document.getElementById('processCanvas'); cv.imshow(canvas, nameROI);
            let nameImg = canvas.toDataURL();

            const exam = db.exams.find(e => e.id === currentExamId);
            let grades = analyzeBubbles(warped, exam);
            let score = 0;
            grades.forEach((ans, idx) => {
                if (JSON.stringify(ans.sort()) === JSON.stringify((exam.key[idx]||[]).sort()) && (exam.key[idx]||[]).length > 0) score += exam.pointsPerQ;
            });

            lastResultId = Date.now();
            db.results.push({ id: lastResultId, examId: currentExamId, nameImg, answers: grades, score, total: exam.qCount * exam.pointsPerQ, timestamp: new Date().toISOString() });
            saveData();
            document.getElementById('popupScoreDisplay').innerText = `${score} / ${exam.qCount * exam.pointsPerQ}`;
            document.getElementById('scanResultPopup').style.display = 'block';
            warped.delete(); nameROI.delete(); sc.delete(); dc.delete(); M.delete();
        }

        function analyzeBubbles(warped, exam) {
            let gray = new cv.Mat(); cv.cvtColor(warped, gray, cv.COLOR_RGBA2GRAY);
            let thresh = new cv.Mat(); cv.threshold(gray, thresh, 0, 255, cv.THRESH_BINARY_INV | cv.THRESH_OTSU);
            let results = []; let startY = 250, rowH = (warped.rows - startY - 40) / 10;
            for (let i = 0; i < exam.qCount; i++) {
                let colIdx = Math.floor(i / 10), rowIdx = i % 10, qAns = [];
                for (let j = 0; j < exam.oCount; j++) {
                    let x = warped.cols - 110 - (colIdx * 165) - (j * 26), y = startY + (rowIdx * rowH) + 12;
                    let roi = thresh.roi(new cv.Rect(x, y, 22, 22));
                    if (cv.countNonZero(roi) > (roi.cols * roi.rows * 0.45)) qAns.push(j);
                    roi.delete();
                }
                results.push(qAns);
            }
            gray.delete(); thresh.delete(); return results;
        }

        function dismissPopup() { document.getElementById('scanResultPopup').style.display = 'none'; isScanning = true; requestAnimationFrame(scanLoop); }
        function cancelScan() { db.results = db.results.filter(r => r.id !== lastResultId); saveData(); dismissPopup(); }

        // --- Restored UI & Results Rendering ---
        function renderResultsTable() {
            const body = document.getElementById('resultsTableBody'); body.innerHTML = '';
            db.results.slice().reverse().forEach(res => {
                const exam = db.exams.find(e => e.id === res.examId);
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-6"><img src="${res.nameImg}" class="h-10 rounded-xl bg-white border shadow-sm"></td>
                    <td class="p-6 font-bold text-slate-700">${exam?.title || '?'}</td>
                    <td class="p-6 text-center font-black text-indigo-600">${res.score} / ${res.total}</td>
                    <td class="p-6 text-center flex justify-center gap-2">
                        <button onclick="viewResultDetail(${res.id})" class="text-indigo-600 bg-indigo-50 p-3 rounded-xl hover:bg-indigo-100"><i class="fa-solid fa-eye"></i></button>
                        <button onclick="deleteResult(${res.id})" class="text-slate-300 hover:text-red-500 p-3"><i class="fa-solid fa-trash"></i></button>
                    </td>`;
                body.appendChild(tr);
            });
        }

        function viewResultDetail(id) {
            const res = db.results.find(r => r.id === id), exam = db.exams.find(e => e.id === res.examId);
            document.getElementById('prevNameImg').src = res.nameImg;
            document.getElementById('prevScore').innerText = `${res.score} / ${res.total}`;
            const grid = document.getElementById('prevGrid'); grid.innerHTML = '';
            grid.style.gridTemplateColumns = `40px repeat(${exam.oCount}, 1fr)`;
            res.answers.forEach((ans, qIdx) => {
                const num = document.createElement('div'); num.className = "flex items-center text-xs font-black text-slate-300"; num.innerText = qIdx + 1; grid.appendChild(num);
                for(let j=0; j<exam.oCount; j++) {
                    const b = document.createElement('div');
                    const isCorrect = exam.key[qIdx].includes(j), isStudent = ans.includes(j);
                    b.className = `bubble-select mx-auto scale-75 ${isStudent ? (isCorrect ? 'bubble-correct' : 'bubble-wrong') : (isCorrect ? 'border-indigo-500' : '')}`;
                    b.innerText = ARABIC_OPTS[j]; grid.appendChild(b);
                }
            });
            const mastery = document.getElementById('masteryList'); mastery.innerHTML = '';
            res.answers.forEach((ans, qIdx) => {
                const isCorrect = JSON.stringify(ans.sort()) === JSON.stringify(exam.key[qIdx].sort()) && exam.key[qIdx].length > 0;
                mastery.innerHTML += `<div class="p-3 rounded-xl text-center font-black text-xs ${isCorrect ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-500'}">س${qIdx+1}: ${isCorrect ? 'متحكم' : 'غير'}</div>`;
            });
            document.getElementById('previewResultModal').classList.remove('hidden');
        }

        function closePreviewResult() { document.getElementById('previewResultModal').classList.add('hidden'); }
        function deleteResult(id) { if(confirm('حذف؟')) { db.results = db.results.filter(r => r.id !== id); saveData(); renderResultsTable(); } }
        function updateStats() {
            document.getElementById('stat-exams').innerText = db.exams.length;
            document.getElementById('stat-papers').innerText = db.results.length;
            let tot = 0; db.results.forEach(r => tot += (r.score/r.total)*100);
            document.getElementById('stat-average').innerText = (db.results.length ? Math.round(tot/db.results.length) : 0) + "%";
        }
    </script>
</body>
</html>
