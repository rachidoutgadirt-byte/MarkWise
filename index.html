<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMark Pro | النسخة الاحترافية (محاكي ZipGrade)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; overflow: hidden; }
        
        aside { transition: transform 0.3s ease-in-out; z-index: 50; }
        @media (max-width: 767px) { aside { position: fixed; top: 0; right: 0; bottom: 0; transform: translateX(100%); width: 280px; } .sidebar-open aside { transform: translateX(0); } }

        /* Scanner Target Boxes (ZipGrade Style) */
        .scanner-active { display: flex !important; }
        .target-box { position: absolute; width: 40px; height: 40px; border: 4px solid #3b82f6; border-radius: 4px; z-index: 100; transition: border-color 0.2s; }
        .target-box.matched { border-color: #10b981; }
        .t-top-right { top: 15%; right: 10%; }
        .t-top-left { top: 15%; left: 10%; }
        .t-bottom-right { bottom: 15%; right: 10%; }
        .t-bottom-left { bottom: 15%; left: 10%; }

        /* Bubble UI */
        .bubble-select { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; }
        .bubble-select.selected { background-color: #4f46e5; color: white; border-color: #4f46e5; }

        /* OMR Sheet Design */
        #sheet-gen-container { position: fixed; left: -9999px; top: 0; background: #eee; }
        .a4-page { width: 210mm; min-height: 297mm; background: white; position: relative; padding: 10mm; box-sizing: border-box; }
        .omr-sheet { background: white; border: 1px solid #000; position: relative; display: flex; flex-direction: column; color: black; margin: auto; }
        
        /* Adaptive Sizing */
        .sheet-mini { width: 100mm; min-height: 140mm; padding: 5mm; }
        .sheet-full { width: 190mm; min-height: 270mm; padding: 10mm; }

        .anchor { position: absolute; width: 8mm; height: 8mm; background: black; }
        .at-tr { top: 4mm; right: 4mm; } .at-tl { top: 4mm; left: 4mm; }
        .at-br { bottom: 4mm; right: 4mm; } .at-bl { bottom: 4mm; left: 4mm; }

        .q-row { display: flex; align-items: center; height: 32px; margin-bottom: 4px; }
        .q-num { width: 35px; font-weight: 800; font-size: 14px; text-align: left; border-left: 2px solid #000; margin-left: 10px; padding-left: 6px; line-height: 1; display: flex; align-items: center; height: 100%; }
        .q-bubble { width: 26px; height: 26px; border: 2px solid black; border-radius: 50%; margin: 0 4px; }
        
        .col-header { display: flex; margin: 10px 0 5px 0; padding-right: 45px; }
        .header-letter { width: 26px; margin: 0 4px; text-align: center; font-weight: 900; font-size: 16px; }

        /* Result Popup */
        #scanResultPopup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; z-index: 200; border-radius: 20px; width: 80%; max-width: 300px; text-align: center; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="text-slate-900">

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl shrink-0">
            <div class="p-6 border-b border-slate-800 text-center relative">
                <h1 class="text-2xl font-black text-indigo-400 italic">SMART MARK</h1>
                <p class="text-[10px] text-slate-400 mt-1 uppercase">Pro Auto-Scanner</p>
                <button onclick="toggleSidebar()" class="md:hidden absolute top-4 left-4 text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <button onclick="switchTab('dashboard')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 bg-indigo-600" id="btn-dashboard"><i class="fa-solid fa-gauge-high"></i> الإحصائيات</button>
                <button onclick="switchTab('create')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 text-slate-300" id="btn-create"><i class="fa-solid fa-wand-magic-sparkles"></i> إنشاء امتحان</button>
                <button onclick="switchTab('manage')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 text-slate-300" id="btn-manage"><i class="fa-solid fa-layer-group"></i> إدارة الامتحانات</button>
                <button onclick="switchTab('results')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 text-slate-300" id="btn-results"><i class="fa-solid fa-clipboard-check"></i> سجل النتائج</button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50 w-full">
            <header class="bg-white border-b p-4 flex justify-between items-center shadow-sm">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-600 p-2"><i class="fa-solid fa-bars text-xl"></i></button>
                <h2 id="current-tab-title" class="font-extrabold text-slate-800">لوحة التحكم</h2>
                <div id="cv-status" class="flex items-center gap-2 text-xs font-bold text-red-500">
                    <span class="w-2 h-2 bg-current rounded-full animate-pulse"></span> <span id="status-text">جاري تحميل AI...</span>
                </div>
            </header>

            <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8">
                <!-- Dashboard Section -->
                <section id="tab-dashboard" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl border shadow-sm"><p class="text-slate-500 text-xs font-bold mb-1">الامتحانات</p><h3 class="text-3xl font-black text-indigo-600" id="stat-exams">0</h3></div>
                        <div class="bg-white p-6 rounded-2xl border shadow-sm"><p class="text-slate-500 text-xs font-bold mb-1">إجمالي النتائج</p><h3 class="text-3xl font-black text-emerald-600" id="stat-papers">0</h3></div>
                        <div class="bg-white p-6 rounded-2xl border shadow-sm"><p class="text-slate-500 text-xs font-bold mb-1">متوسط الأداء</p><h3 class="text-3xl font-black text-amber-500" id="stat-average">0%</h3></div>
                    </div>
                </section>

                <!-- Create Exam Section -->
                <section id="tab-create" class="hidden max-w-4xl mx-auto">
                    <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 space-y-6 border">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="examTitle" placeholder="اسم الامتحان" class="w-full border-2 border-slate-100 rounded-2xl px-5 py-3 outline-none">
                            <input type="text" id="examClass" placeholder="القسم" class="w-full border-2 border-slate-100 rounded-2xl px-5 py-3 outline-none">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-indigo-50 p-5 rounded-2xl">
                            <div><label class="text-[10px] font-bold">عدد الأسئلة</label><input type="number" id="qCount" value="20" onchange="renderKeyGrid('create')" class="w-full mt-1 p-2 rounded-xl"></div>
                            <div><label class="text-[10px] font-bold">عدد الخيارات</label><input type="number" id="oCount" value="4" onchange="renderKeyGrid('create')" class="w-full mt-1 p-2 rounded-xl"></div>
                            <div><label class="text-[10px] font-bold">النقطة لكل سؤال</label><input type="number" id="pointsPerQ" value="1" step="0.25" class="w-full mt-1 p-2 rounded-xl"></div>
                        </div>
                        <div id="answerKeyGrid" class="grid gap-2 overflow-x-auto pb-4 custom-scrollbar"></div>
                        <button onclick="saveExam()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-100">حفظ الامتحان</button>
                    </div>
                </section>

                <!-- Manage Section -->
                <section id="tab-manage" class="hidden">
                    <div id="manageGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </section>

                <!-- Results Section -->
                <section id="tab-results" class="hidden">
                    <div class="bg-white rounded-3xl border overflow-hidden">
                        <table class="w-full text-right">
                            <thead class="bg-slate-50 text-slate-400 text-[11px] font-black uppercase">
                                <tr><th class="p-5">التلميذ</th><th class="p-5">الامتحان</th><th class="p-5 text-center">النتيجة</th><th class="p-5 text-center">إجراءات</th></tr>
                            </thead>
                            <tbody id="resultsTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Scanner & Popup -->
    <div id="scannerModal" class="fixed inset-0 bg-black z-[100] hidden flex-col">
        <div class="absolute top-6 left-6 z-[110]">
            <button onclick="closeScanner()" class="bg-white/20 backdrop-blur text-white px-8 py-3 rounded-full font-black">إغلاق</button>
        </div>
        <div class="relative flex-1 flex items-center justify-center overflow-hidden">
            <video id="videoInput" playsinline autoplay muted class="w-full h-full object-cover"></video>
            <!-- Target Boxes -->
            <div class="target-box t-top-right"></div>
            <div class="target-box t-top-left"></div>
            <div class="target-box t-bottom-right"></div>
            <div class="target-box t-bottom-left"></div>
            <div id="scanOverlayMsg" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white font-black bg-black/40 px-6 py-2 rounded-full backdrop-blur-md">صوّب نحو المربعات السوداء</div>
        </div>
        <canvas id="processCanvas" class="hidden"></canvas>
    </div>

    <div id="scanResultPopup" class="shadow-2xl">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-check text-3xl"></i>
        </div>
        <h3 class="font-black text-slate-800 text-xl">تم التصحيح بنجاح</h3>
        <p id="popupScoreDisplay" class="text-4xl font-black text-indigo-600 my-4">0 / 0</p>
        <div class="space-y-2">
            <button onclick="dismissPopup()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">استمرار</button>
            <button onclick="cancelScan()" class="w-full bg-slate-100 text-slate-400 font-bold py-2 rounded-xl">إلغاء النتيجة</button>
        </div>
    </div>

    <!-- Modals for Edit/Download -->
    <div id="downloadModal" class="fixed inset-0 bg-slate-900/80 hidden z-[120] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-3xl p-8 shadow-2xl space-y-6">
            <h3 class="text-2xl font-black">تحميل نموذج الإجابة</h3>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="previewSheet()" class="bg-slate-100 font-bold py-4 rounded-xl">معاينة</button>
                <button onclick="processDownload('pdf')" class="bg-red-600 text-white font-bold py-4 rounded-xl">PDF</button>
                <button onclick="processDownload('png')" class="bg-emerald-600 text-white font-bold py-4 rounded-xl">PNG</button>
            </div>
            <button onclick="closeDownloadModal()" class="w-full text-slate-400 font-bold py-2">رجوع</button>
        </div>
    </div>

    <div id="editKeyModal" class="fixed inset-0 bg-slate-900/80 hidden z-[120] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-3xl rounded-3xl p-8 shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-xl font-bold mb-6 border-b pb-4">تعديل مفتاح الإجابة</h3>
            <div id="editKeyGrid" class="flex-1 overflow-y-auto grid gap-2 pb-6 custom-scrollbar"></div>
            <div class="flex gap-4 pt-4 border-t">
                <button onclick="saveEditedKey()" class="flex-1 bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-lg">حفظ التعديلات</button>
                <button onclick="closeEditModal()" class="flex-1 bg-slate-100 py-4 rounded-2xl">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="previewModal" class="fixed inset-0 bg-black/95 hidden z-[150] flex items-center justify-center p-4 overflow-y-auto">
        <div class="relative bg-white p-2 rounded shadow-2xl max-w-full">
            <button onclick="closePreview()" class="absolute -top-12 left-0 text-white text-3xl font-bold">&times;</button>
            <div id="preview-area" class="max-w-full"></div>
        </div>
    </div>

    <div id="sheet-gen-container"></div>

    <audio id="shutterSound" src="https://assets.mixkit.co/active_storage/sfx/712/712-preview.mp3"></audio>

    <script>
        let db = { exams: [], results: [] };
        let currentExamId = null;
        let isCvLoaded = false;
        let isScanning = false;
        let createKey = [];
        let editingKey = [];
        let editingExamId = null;
        let downloadExamId = null;
        let lastResultId = null;
        const ARABIC_OPTS = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي', 'ك', 'ل'];

        function onOpenCvReady() {
            isCvLoaded = true;
            document.getElementById('cv-status').innerHTML = '<span class="w-2 h-2 bg-emerald-500 rounded-full"></span> المحرك جاهز';
            document.getElementById('cv-status').classList.replace('text-red-500', 'text-emerald-500');
        }

        window.onload = () => {
            const saved = localStorage.getItem('sm_pro_v3_final');
            if(saved) db = JSON.parse(saved);
            renderKeyGrid('create');
            updateStats();
        };

        function saveData() { localStorage.setItem('sm_pro_v3_final', JSON.stringify(db)); updateStats(); }

        function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }

        function switchTab(tabId) {
            ['dashboard', 'create', 'manage', 'results'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-' + t).classList.replace('bg-indigo-600', 'text-slate-300');
            });
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).classList.replace('text-slate-300', 'bg-indigo-600');
            document.getElementById('current-tab-title').innerText = {dashboard:'لوحة القيادة', create:'إنشاء امتحان', manage:'إدارة الامتحانات', results:'النتائج'}[tabId];
            if(tabId === 'manage') renderManageGrid();
            if(tabId === 'results') renderResultsTable();
            if(tabId === 'dashboard') updateStats();
            if(window.innerWidth < 768 && document.body.classList.contains('sidebar-open')) toggleSidebar();
        }

        // Key Rendering
        function renderKeyGrid(mode, examData = null) {
            const q = mode === 'create' ? parseInt(document.getElementById('qCount').value) : examData.qCount;
            const o = mode === 'create' ? parseInt(document.getElementById('oCount').value) : examData.oCount;
            const container = document.getElementById(mode === 'create' ? 'answerKeyGrid' : 'editKeyGrid');
            if(mode === 'create') { if(createKey.length !== q) createKey = Array(q).fill().map(() => []); }
            else { editingKey = JSON.parse(JSON.stringify(examData.key)); }
            container.innerHTML = '';
            container.style.gridTemplateColumns = `40px repeat(${o}, 1fr)`;
            for(let i=0; i<q; i++) {
                const num = document.createElement('div');
                num.className = "flex items-center justify-center font-black text-slate-300 text-xs";
                num.innerText = i + 1;
                container.appendChild(num);
                for(let j=0; j<o; j++) {
                    const bubble = document.createElement('div');
                    const isSel = mode === 'create' ? createKey[i].includes(j) : editingKey[i].includes(j);
                    bubble.className = `bubble-select mx-auto ${isSel ? 'selected' : ''}`;
                    bubble.innerText = ARABIC_OPTS[j];
                    bubble.onclick = () => {
                        let target = mode === 'create' ? createKey[i] : editingKey[i];
                        const idx = target.indexOf(j);
                        if(idx > -1) target.splice(idx, 1); else target.push(j);
                        renderKeyGrid(mode, mode === 'edit' ? {qCount:q, oCount:o, key: editingKey} : null);
                    };
                    container.appendChild(bubble);
                }
            }
        }

        function saveExam() {
            const title = document.getElementById('examTitle').value;
            if(!title) return alert("يرجى إدخال اسم الامتحان");
            db.exams.push({
                id: Date.now(), title, class: document.getElementById('examClass').value,
                qCount: parseInt(document.getElementById('qCount').value),
                oCount: parseInt(document.getElementById('oCount').value),
                pointsPerQ: parseFloat(document.getElementById('pointsPerQ').value),
                key: JSON.parse(JSON.stringify(createKey)),
                timestamp: new Date().toISOString()
            });
            saveData();
            switchTab('manage');
        }

        function renderManageGrid() {
            const grid = document.getElementById('manageGrid'); grid.innerHTML = '';
            db.exams.forEach(exam => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-3xl border shadow-sm flex flex-col hover:shadow-md transition";
                card.innerHTML = `
                    <h4 class="font-bold text-lg mb-1">${exam.title}</h4>
                    <p class="text-xs text-slate-400 mb-6">${exam.class} | ${exam.qCount} سؤال</p>
                    <div class="grid grid-cols-2 gap-3 mt-auto">
                        <button onclick="startScanning(${exam.id})" class="bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-indigo-100">بدء التصحيح</button>
                        <button onclick="openDownloadModal(${exam.id})" class="bg-slate-100 py-3 rounded-xl font-bold">النموذج</button>
                        <button onclick="openEditModal(${exam.id})" class="bg-amber-50 text-amber-700 py-3 rounded-xl font-bold col-span-2">تعديل المفتاح</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- Sheet Generation Engine (ZipGrade Simulation) ---
        function openDownloadModal(id) { downloadExamId = id; document.getElementById('downloadModal').classList.remove('hidden'); }
        function closeDownloadModal() { document.getElementById('downloadModal').classList.add('hidden'); }

        async function generateSheetHTML(id) {
            const exam = db.exams.find(e => e.id === id);
            const container = document.getElementById('sheet-gen-container');
            const isMini = exam.qCount <= 20; // Adaptive Size
            container.innerHTML = `<div class="a4-page"><div class="omr-sheet ${isMini ? 'sheet-mini' : 'sheet-full'}"></div></div>`;
            const sheet = container.querySelector('.omr-sheet');
            sheet.innerHTML = `
                <div class="anchor at-tl"></div><div class="anchor at-tr"></div>
                <div class="anchor at-bl"></div><div class="anchor at-br"></div>
                <div class="flex justify-between items-center mb-6 border-b-4 border-black pb-4 mt-6">
                    <div><h1 class="text-2xl font-black">${exam.title}</h1><p class="text-xs font-bold text-slate-500">SMARTMARK AI Standardized Sheet</p></div>
                    <div id="qr-gen"></div>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="border-b-2 border-black font-bold pb-1">اسم التلميذ: ...........................................</div>
                    <div class="border-b-2 border-black font-bold pb-1">القسم: ${exam.class}</div>
                </div>
                <div class="flex-1 flex flex-wrap gap-x-12 gap-y-8 overflow-hidden">${renderSheetColumns(exam.qCount, exam.oCount)}</div>
                <div class="text-[9px] text-center mt-6 border-t pt-2 opacity-50 font-bold uppercase tracking-widest">Standardized Sheet - Do Not Fold or Bend</div>
            `;
            new QRCode(sheet.querySelector("#qr-gen"), { text: `SM-${exam.id}`, width: 60, height: 60 });
        }

        function renderSheetColumns(qCount, oCount) {
            let html = '';
            const chunkSize = 10;
            const cols = Math.ceil(qCount / 20); // Force max 2 columns per group for clarity

            for(let c = 0; c < Math.ceil(qCount / chunkSize); c++) {
                html += `<div class="column">
                    <div class="col-header">${ARABIC_OPTS.slice(0, oCount).map(l => `<div class="header-letter">${l}</div>`).join('')}</div>`;
                const start = c * chunkSize;
                const end = Math.min(start + chunkSize, qCount);
                for(let i = start; i < end; i++) {
                    html += `<div class="q-row"><div class="q-num">${i+1}</div>`;
                    for(let j = 0; j < oCount; j++) html += `<div class="q-bubble"></div>`;
                    html += `</div>`;
                }
                html += `</div>`;
            }
            return html;
        }

        async function processDownload(format) {
            await generateSheetHTML(downloadExamId);
            const exam = db.exams.find(e => e.id === downloadExamId);
            const canvas = await html2canvas(document.querySelector('.a4-page'), { scale: 2 });
            if(format === 'png') {
                const link = document.createElement('a'); link.download = `${exam.title}.png`; link.href = canvas.toDataURL(); link.click();
            } else {
                const { jsPDF } = window.jspdf; const pdf = new jsPDF('p', 'mm', 'a4');
                pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297); pdf.save(`${exam.title}.pdf`);
            }
            closeDownloadModal();
        }

        async function previewSheet() {
            await generateSheetHTML(downloadExamId);
            const canvas = await html2canvas(document.querySelector('.a4-page'), { scale: 1 });
            document.getElementById('preview-area').innerHTML = '';
            document.getElementById('preview-area').appendChild(canvas);
            document.getElementById('previewModal').classList.remove('hidden');
        }

        function closePreview() { document.getElementById('previewModal').classList.add('hidden'); }

        // --- Camera & Intelligent Auto-Scanning Logic ---
        function startScanning(id) {
            currentExamId = id;
            isScanning = true;
            document.getElementById('scannerModal').classList.add('scanner-active');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', focusMode: 'continuous', width: {ideal: 1280}, height: {ideal: 720} } })
                .then(s => { window.stream = s; document.getElementById('videoInput').srcObject = s; requestAnimationFrame(scanLoop); });
        }

        function closeScanner() {
            isScanning = false;
            document.getElementById('scannerModal').classList.remove('scanner-active');
            if(window.stream) window.stream.getTracks().forEach(t => t.stop());
        }

        async function scanLoop() {
            if(!isScanning || !isCvLoaded) return;
            const video = document.getElementById('videoInput');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.getElementById('processCanvas');
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);

                let src = cv.imread(canvas);
                let gray = new cv.Mat(); cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                let thresh = new cv.Mat(); cv.adaptiveThreshold(gray, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);
                
                let contours = new cv.MatVector(); let hierarchy = new cv.Mat();
                cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let anchorsFound = [];
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    if (area > 500 && area < 5000) { // Anchors Size Range
                        let peri = cv.arcLength(cnt, true);
                        let approx = new cv.Mat();
                        cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                        if (approx.rows === 4) { // Square
                            let rect = cv.boundingRect(approx);
                            let ratio = Math.abs(1 - rect.width / rect.height);
                            if (ratio < 0.3) anchorsFound.push(approx);
                            else approx.delete();
                        } else approx.delete();
                    }
                }

                // Check Alignment with Target Boxes
                updateTargetBoxes(anchorsFound, canvas.width, canvas.height);

                if (anchorsFound.length === 4) {
                    isScanning = false; // Pause
                    document.getElementById('shutterSound').play();
                    await performFinalScan(src, anchorsFound);
                }

                src.delete(); gray.delete(); thresh.delete(); contours.delete(); hierarchy.delete();
            }
            if(isScanning) requestAnimationFrame(scanLoop);
        }

        function updateTargetBoxes(anchors, w, h) {
            const boxes = document.querySelectorAll('.target-box');
            boxes.forEach(b => b.classList.remove('matched'));
            // Simplified logic: If anchors are found and distributed across screen, highlight boxes
            if (anchors.length >= 1) boxes[0].classList.add('matched');
            if (anchors.length >= 2) boxes[1].classList.add('matched');
            if (anchors.length >= 3) boxes[2].classList.add('matched');
            if (anchors.length >= 4) boxes[3].classList.add('matched');
        }

        async function performFinalScan(src, anchors) {
            // Find 4 outer corners from anchors
            let pts = anchors.map(a => {
                let rect = cv.boundingRect(a);
                return { x: rect.x + rect.width/2, y: rect.y + rect.height/2 };
            });
            pts.sort((a,b) => a.y - b.y);
            let top = pts.slice(0, 2).sort((a,b) => b.x - a.x);
            let bottom = pts.slice(2, 4).sort((a,b) => b.x - a.x);
            
            let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [top[0].x, top[0].y, top[1].x, top[1].y, bottom[1].x, bottom[1].y, bottom[0].x, bottom[0].y]);
            let dstCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [600, 0, 0, 0, 0, 800, 600, 800]);
            let M = cv.getPerspectiveTransform(srcCoords, dstCoords);
            let warped = new cv.Mat(); cv.warpPerspective(src, warped, M, new cv.Size(600, 800));

            let nameROI = warped.roi(new cv.Rect(40, 70, 520, 70));
            const canvas = document.getElementById('processCanvas');
            cv.imshow(canvas, nameROI);
            let nameImg = canvas.toDataURL();

            const exam = db.exams.find(e => e.id === currentExamId);
            let examGrades = analyzeBubbles(warped, exam);
            let score = 0;
            examGrades.forEach((ans, idx) => {
                if (JSON.stringify(ans.sort()) === JSON.stringify((exam.key[idx]||[]).sort()) && (exam.key[idx]||[]).length > 0) score += exam.pointsPerQ;
            });

            lastResultId = Date.now();
            db.results.push({ id: lastResultId, examId: currentExamId, nameImg, answers: examGrades, score, total: exam.qCount * exam.pointsPerQ, timestamp: new Date().toISOString() });
            saveData();

            document.getElementById('popupScoreDisplay').innerText = `${score} / ${exam.qCount * exam.pointsPerQ}`;
            document.getElementById('scanResultPopup').style.display = 'block';

            warped.delete(); nameROI.delete(); srcCoords.delete(); dstCoords.delete(); M.delete();
        }

        function analyzeBubbles(warped, exam) {
            let gray = new cv.Mat(); cv.cvtColor(warped, gray, cv.COLOR_RGBA2GRAY);
            let thresh = new cv.Mat(); cv.threshold(gray, thresh, 0, 255, cv.THRESH_BINARY_INV | cv.THRESH_OTSU);
            let results = [];
            let startY = 230; 
            let rowH = (warped.rows - startY - 50) / 20;

            for (let i = 0; i < exam.qCount; i++) {
                let colIdx = Math.floor(i / 20); let rowIdx = i % 20;
                let qAns = [];
                for (let j = 0; j < exam.oCount; j++) {
                    let x = warped.cols - 110 - (colIdx * 200) - (j * 28);
                    let y = startY + (rowIdx * rowH) + 14;
                    let roi = thresh.roi(new cv.Rect(x, y, 22, 22));
                    if (cv.countNonZero(roi) > (roi.cols * roi.rows * 0.45)) qAns.push(j);
                    roi.delete();
                }
                results.push(qAns);
            }
            gray.delete(); thresh.delete(); return results;
        }

        function dismissPopup() {
            document.getElementById('scanResultPopup').style.display = 'none';
            isScanning = true;
            requestAnimationFrame(scanLoop);
        }

        function cancelScan() {
            db.results = db.results.filter(r => r.id !== lastResultId);
            saveData();
            dismissPopup();
        }

        // Stats & UI
        function updateStats() {
            document.getElementById('stat-exams').innerText = db.exams.length;
            document.getElementById('stat-papers').innerText = db.results.length;
            let total = 0; db.results.forEach(r => total += (r.score/r.total)*100);
            document.getElementById('stat-average').innerText = db.results.length ? Math.round(total/db.results.length) + "%" : "0%";
        }

        function renderResultsTable() {
            const body = document.getElementById('resultsTableBody'); body.innerHTML = '';
            db.results.slice().reverse().forEach(res => {
                const exam = db.exams.find(e => e.id === res.examId);
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-5"><img src="${res.nameImg}" class="h-10 rounded border bg-white"></td>
                    <td class="p-5 font-bold">${exam?.title || '?'}</td>
                    <td class="p-5 text-center font-black text-indigo-600">${res.score} / ${res.total}</td>
                    <td class="p-5 text-center"><button onclick="deleteResult(${res.id})" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash"></i></button></td>`;
                body.appendChild(tr);
            });
        }

        function deleteResult(id) { if(confirm('حذف النتيجة؟')) { db.results = db.results.filter(r => r.id !== id); saveData(); renderResultsTable(); } }
        function openEditModal(id) { editingExamId = id; const exam = db.exams.find(e => e.id === id); renderKeyGrid('edit', exam); document.getElementById('editKeyModal').classList.remove('hidden'); }
        function closeEditModal() { document.getElementById('editKeyModal').classList.add('hidden'); }
        function saveEditedKey() { const idx = db.exams.findIndex(e => e.id === editingExamId); db.exams[idx].key = JSON.parse(JSON.stringify(editingKey)); saveData(); closeEditModal(); }
    </script>
