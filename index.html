<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartMark Pro | النسخة الاحترافية الكاملة</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; overflow: hidden; touch-action: manipulation; }
        
        .bubble-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; transition: 0.2s; cursor: pointer; background: white; color: #64748b; flex-shrink: 0; }
        .bubble-btn.selected { background-color: #4f46e5 !important; color: white !important; border-color: #4f46e5 !important; transform: scale(1.1); }

        .target-frame { position: absolute; width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.2); border-radius: 12px; transition: all 0.3s; }
        .target-frame.detected { border-color: #10b981; background: rgba(16, 185, 129, 0.1); border-width: 6px; }
        .tf-tl { top: 10%; left: 10%; } .tf-tr { top: 10%; right: 10%; }
        .tf-bl { bottom: 15%; left: 10%; } .tf-br { bottom: 15%; right: 10%; }

        .sheet-page { width: 210mm; min-height: 297mm; padding: 15mm; background: white; position: relative; box-sizing: border-box; color: black; }
        .black-corner { position: absolute; width: 12mm; height: 12mm; background: black; border-radius: 2px; }
        .c-tl { top: 10mm; left: 10mm; } .c-tr { top: 10mm; right: 10mm; }
        .c-bl { bottom: 10mm; left: 10mm; } .c-br { bottom: 10mm; right: 10mm; }

        .sidebar-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-900 bg-slate-50">

    <div id="sidebar-overlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/60 z-40 md:hidden opacity-0 pointer-events-none transition-opacity duration-300"></div>
    
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:relative inset-y-0 right-0 w-72 bg-slate-900 text-white flex flex-col z-50 transform translate-x-full md:translate-x-0 sidebar-transition">
            <div class="p-8 border-b border-slate-800">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                        <i class="fa-solid fa-bolt-lightning text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black tracking-tight text-white">SmartMark</h1>
                        <p class="text-[9px] text-slate-500 font-bold uppercase tracking-tighter">Professional OMR v7.0</p>
                    </div>
                </div>
            </div>
            
            <nav class="flex-1 p-4 space-y-2 mt-4">
                <button onclick="switchTab('exams')" id="btn-exams" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl bg-indigo-600 transition-all font-bold">
                    <i class="fa-solid fa-rectangle-list"></i> الامتحانات
                </button>
                <button onclick="switchTab('create')" id="btn-create" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-slate-400 hover:bg-slate-800 transition-all font-bold">
                    <i class="fa-solid fa-circle-plus"></i> إنشاء جديد
                </button>
                <button onclick="switchTab('history')" id="btn-history" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-slate-400 hover:bg-slate-800 transition-all font-bold">
                    <i class="fa-solid fa-chart-column"></i> النتائج والمراجعة
                </button>
            </nav>

            <div class="p-4 m-4 bg-slate-800/40 rounded-2xl border border-slate-700/50">
                <div id="cv-status" class="text-[10px] font-bold text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> جاري تهيئة الذكاء الاصطناعي...
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-white relative">
            <header class="h-16 border-b px-6 flex items-center justify-between bg-white/80 backdrop-blur-md sticky top-0 z-30">
                <button onclick="toggleSidebar(true)" class="md:hidden p-2 text-slate-600"><i class="fa-solid fa-bars-staggered"></i></button>
                <h2 id="tab-title" class="font-black text-slate-800 tracking-tight text-lg">إدارة الامتحانات</h2>
                <div class="flex items-center gap-3">
                    <div class="text-left hidden sm:block">
                        <p class="text-[10px] font-black text-slate-400 uppercase leading-none text-left">المشرف</p>
                        <p class="text-xs font-bold text-slate-700 leading-none mt-1">الأستاذ(ة)</p>
                    </div>
                    <div class="w-10 h-10 bg-indigo-50 rounded-full border-2 border-white shadow-sm flex items-center justify-center text-indigo-600">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8">
                <!-- Tab: Exams View -->
                <section id="view-exams" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></section>
                
                <!-- Tab: Create Exam -->
                <section id="view-create" class="hidden max-w-5xl mx-auto pb-20">
                    <div class="bg-white rounded-[32px] border shadow-sm overflow-hidden">
                        <div class="p-6 md:p-10 space-y-8">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase pr-2">اسم المادة / الامتحان</label>
                                    <input type="text" id="in-name" placeholder="مثلاً: مادة الرياضيات" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 outline-none transition-all font-bold">
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase pr-2">المستوى الدراسي</label>
                                    <input type="text" id="in-level" placeholder="مثلاً: السنة الثالثة" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 outline-none transition-all font-bold">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-6">
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase pr-2">عدد الأسئلة</label>
                                    <input type="number" id="in-q" value="20" class="w-full p-4 bg-slate-50 rounded-2xl font-black border-2 border-transparent focus:border-indigo-500 outline-none">
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase pr-2">عدد الخيارات</label>
                                    <select id="in-o" class="w-full p-4 bg-slate-50 rounded-2xl font-black border-2 border-transparent focus:border-indigo-500 outline-none">
                                        <option value="4">4 (أ-د)</option>
                                        <option value="6">6 (أ-و)</option>
                                        <option value="12">12 (أ-ل)</option>
                                    </select>
                                </div>
                                <div class="space-y-2 col-span-2 sm:col-span-1">
                                    <label class="text-[10px] font-black text-slate-400 uppercase pr-2">درجة كل سؤال</label>
                                    <input type="number" id="in-weight" value="1" step="0.5" class="w-full p-4 bg-slate-50 rounded-2xl font-black border-2 border-transparent focus:border-indigo-500 outline-none">
                                </div>
                            </div>

                            <div class="bg-slate-900 rounded-[32px] p-6 text-white">
                                <div class="flex items-center justify-between mb-6">
                                    <div>
                                        <h4 class="font-black text-lg">مفتاح الإجابة الصحيحة</h4>
                                        <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">حدد الإجابات الصحيحة لكل سؤال</p>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="updateKeyGrid()" class="text-xs bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl transition-all font-bold">تحديث الشبكة</button>
                                    </div>
                                </div>
                                <div id="key-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[500px] overflow-y-auto pr-2 custom-scroll"></div>
                            </div>

                            <button onclick="saveExam()" class="w-full bg-indigo-600 text-white py-6 rounded-2xl font-black text-xl shadow-xl shadow-indigo-200 hover:bg-indigo-700 active:scale-[0.98] transition-all">حفظ واعتماد الامتحان</button>
                        </div>
                    </div>
                </section>

                <!-- Tab: History & Results -->
                <section id="view-history" class="hidden space-y-6 pb-20"></section>
            </div>
        </main>
    </div>

    <!-- Live Scanner Modal -->
    <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden overflow-hidden select-none">
        <video id="video" class="w-full h-full object-cover opacity-60" playsinline muted></video>
        
        <div id="f-tl" class="target-frame tf-tl"></div>
        <div id="f-tr" class="target-frame tf-tr"></div>
        <div id="f-bl" class="target-frame tf-bl"></div>
        <div id="f-br" class="target-frame tf-br"></div>

        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div id="capture-feedback" class="w-full h-full border-[20px] border-emerald-500 opacity-0 transition-opacity duration-300"></div>
        </div>

        <div class="absolute bottom-12 inset-x-0 flex flex-col items-center gap-6">
            <div id="status-msg" class="bg-black/60 backdrop-blur-xl border border-white/10 text-white px-8 py-4 rounded-3xl text-xs font-black tracking-widest uppercase transition-all">وجه الكاميرا داخل الأطر...</div>
            <div class="flex items-center gap-6">
                <button onclick="stopScanner()" class="w-16 h-16 bg-white/10 rounded-full border border-white/20 text-white flex items-center justify-center text-xl backdrop-blur-md hover:bg-red-500 transition-all"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <canvas id="proc-canvas" class="hidden"></canvas>
    </div>

    <!-- Result Popup -->
    <div id="res-popup" class="fixed inset-0 bg-slate-900/95 z-[200] hidden flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-white rounded-[40px] p-10 max-w-sm w-full text-center shadow-2xl scale-in border-8 border-indigo-600/10">
            <div class="w-24 h-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                <i class="fa-solid fa-check-double text-4xl"></i>
            </div>
            <h3 class="font-black text-2xl text-slate-800">تم التصحيح بنجاح</h3>
            <div id="res-score" class="text-7xl font-black text-indigo-600 my-6 italic tracking-tighter">0 / 0</div>
            <div class="bg-slate-50 rounded-2xl p-4 mb-8 border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-2">اسم التلميذ (الملتقط)</p>
                <img id="res-name-img" class="mx-auto h-16 object-contain rounded-lg bg-white border border-slate-200">
            </div>
            <button onclick="closeResult()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-lg shadow-xl shadow-slate-300 active:scale-95 transition-all">الاستمرار في المسح</button>
        </div>
    </div>

    <!-- Sheet Preview / Hidden Canvas -->
    <div id="hidden-print-area" style="position:fixed; left:-9999px;"></div>

    <script>
        // --- Database & Global State ---
        let db = {
            exams: JSON.parse(localStorage.getItem('sm_pro_exams') || '[]'),
            results: JSON.parse(localStorage.getItem('sm_pro_results') || '[]')
        };
        let isCvReady = false, scanActive = false, activeExam = null, stableCounter = 0;
        const LETTERS = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي', 'ك', 'ل'];

        // --- Core UI Logic ---
        function onOpenCvReady() {
            isCvReady = true;
            const status = document.getElementById('cv-status');
            status.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500"></i> محرك الذكاء جاهز';
            status.className = "text-[10px] font-bold text-emerald-500 flex items-center gap-2";
        }

        function toggleSidebar(state) {
            document.getElementById('sidebar').classList.toggle('translate-x-full', !state);
            const overlay = document.getElementById('sidebar-overlay');
            overlay.style.opacity = state ? "1" : "0";
            overlay.style.pointerEvents = state ? "auto" : "none";
        }

        function switchTab(tab) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('view-' + tab).classList.remove('hidden');
            
            document.querySelectorAll('nav button').forEach(b => b.className = "w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-slate-400 hover:bg-slate-800 transition-all font-bold");
            document.getElementById('btn-' + tab).className = "w-full flex items-center gap-4 px-5 py-4 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 transition-all font-bold";
            
            if(tab === 'exams') renderExams();
            if(tab === 'history') renderHistory();
            if(tab === 'create') updateKeyGrid();
            if(window.innerWidth < 768) toggleSidebar(false);
        }

        // --- Exam Creation Logic ---
        function updateKeyGrid() {
            const q = parseInt(document.getElementById('in-q').value) || 0, o = parseInt(document.getElementById('in-o').value);
            const grid = document.getElementById('key-container'); grid.innerHTML = '';
            for(let i=0; i<q; i++) {
                const row = document.createElement('div');
                row.className = "p-4 bg-slate-800 rounded-2xl flex items-center justify-between hover:bg-slate-700 transition-colors";
                row.innerHTML = `<span class="text-xs font-black text-slate-500">س ${i+1}</span><div class="flex gap-1.5 overflow-x-auto no-scrollbar" id="q-row-${i}"></div>`;
                grid.appendChild(row);
                for(let j=0; j<o; j++) {
                    const b = document.createElement('div');
                    b.className = `bubble-btn opt-${i}`;
                    b.innerText = LETTERS[j];
                    b.onclick = function() {
                        this.classList.toggle('selected');
                        // Optional: Single choice logic if needed: 
                        // Array.from(this.parentNode.children).forEach(c => {if(c!==this) c.classList.remove('selected')});
                    };
                    row.querySelector(`#q-row-${i}`).appendChild(b);
                }
            }
        }

        function saveExam() {
            const name = document.getElementById('in-name').value;
            if(!name) return alert("المرجو إدخال اسم المادة");
            const qCount = parseInt(document.getElementById('in-q').value);
            const qWeight = parseFloat(document.getElementById('in-weight').value);
            let key = [];
            for(let i=0; i<qCount; i++) {
                let ans = [];
                document.querySelectorAll(`.opt-${i}`).forEach((b, idx) => { if(b.classList.contains('selected')) ans.push(idx); });
                key.push(ans);
            }
            db.exams.push({ 
                id: Date.now(), name, level: document.getElementById('in-level').value, 
                qCount, oCount: parseInt(document.getElementById('in-o').value), 
                key, weight: qWeight, date: new Date().toLocaleDateString('ar-MA') 
            });
            localStorage.setItem('sm_pro_exams', JSON.stringify(db.exams));
            switchTab('exams');
        }

        // --- SCANNER ENGINE (CV LOGIC) ---
        async function startScanner(id) {
            if(!isCvReady) return alert("المحرك قيد التحميل، انتظر ثواني...");
            activeExam = db.exams.find(e => e.id === id);
            scanActive = true; stableCounter = 0;
            document.getElementById('scanner-modal').classList.remove('hidden');
            
            const constraints = { video: { facingMode: 'environment', focusMode: 'continuous', width: {ideal: 1280}, height: {ideal: 720} } };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            document.getElementById('video').srcObject = stream;
            document.getElementById('video').play();
            requestAnimationFrame(scanLoop);
        }

        function stopScanner() {
            scanActive = false;
            const stream = document.getElementById('video').srcObject;
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('scanner-modal').classList.add('hidden');
        }

        function scanLoop() {
            if(!scanActive) return;
            const video = document.getElementById('video');
            const canvas = document.getElementById('proc-canvas');
            const ctx = canvas.getContext('2d');

            if(video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 640; canvas.height = 480;
                ctx.drawImage(video, 0, 0, 640, 480);
                
                let src = cv.imread(canvas);
                let gray = new cv.Mat();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                cv.adaptiveThreshold(gray, gray, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(gray, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let anchors = [];
                for(let i=0; i<contours.size(); i++) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    if(area > 150 && area < 2000) {
                        let rect = cv.boundingRect(cnt);
                        let ratio = rect.width / rect.height;
                        if(ratio > 0.7 && ratio < 1.3) anchors.push(rect);
                    }
                }

                if(anchors.length >= 4) {
                    // Sorting points: TL, TR, BL, BR
                    let pts = anchors.map(r => ({x: r.x + r.width/2, y: r.y + r.height/2}));
                    pts.sort((a, b) => a.y - b.y);
                    let top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
                    let bottom = pts.slice(2, 4).sort((a, b) => a.x - b.x);
                    let sorted = [top[0], top[1], bottom[0], bottom[1]];

                    updateScannerUI(true);
                    stableCounter++;

                    if(stableCounter > 15) { // If stable for 15 frames
                        processOMR(src, sorted);
                        scanActive = false;
                    } else {
                        requestAnimationFrame(scanLoop);
                    }
                } else {
                    stableCounter = 0;
                    updateScannerUI(false);
                    requestAnimationFrame(scanLoop);
                }

                src.delete(); gray.delete(); contours.delete(); hierarchy.delete();
            } else {
                requestAnimationFrame(scanLoop);
            }
        }

        function updateScannerUI(detected) {
            const frames = ['f-tl', 'f-tr', 'f-bl', 'f-br'];
            frames.forEach(f => document.getElementById(f).classList.toggle('detected', detected));
            const msg = document.getElementById('status-msg');
            msg.innerText = detected ? "ثبت الكاميرا... جاري التصحيح" : "وجه المربعات الأربعة داخل الأطر...";
            msg.classList.toggle('bg-emerald-600', detected);
        }

        function processOMR(src, pts) {
            // Perspective Warp to a fixed 600x800 sheet
            let dstSize = new cv.Size(600, 800);
            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, 600, 0, 0, 800, 600, 800]);
            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [pts[0].x, pts[0].y, pts[1].x, pts[1].y, pts[2].x, pts[2].y, pts[3].x, pts[3].y]);
            
            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            let warped = new cv.Mat();
            cv.warpPerspective(src, warped, M, dstSize);

            // Extract Name Area
            let nameRect = new cv.Rect(60, 110, 350, 60);
            let nameRoi = warped.roi(nameRect);
            let nameCanvas = document.createElement('canvas');
            cv.imshow(nameCanvas, nameRoi);
            const nameImgData = nameCanvas.toDataURL();

            // Analyze Bubbles
            let gray = new cv.Mat();
            cv.cvtColor(warped, gray, cv.COLOR_RGBA2GRAY);
            cv.threshold(gray, gray, 150, 255, cv.THRESH_BINARY_INV);

            let score = 0;
            const startY = 240, rowH = 22, colW = 30; // Grid settings

            activeExam.key.forEach((correctIndices, qIdx) => {
                let chosen = [];
                for(let oIdx = 0; oIdx < activeExam.oCount; oIdx++) {
                    let bx = 80 + (oIdx * colW);
                    let by = startY + (qIdx * rowH);
                    
                    let roi = gray.roi(new cv.Rect(bx-8, by-8, 16, 16));
                    let darkness = cv.countNonZero(roi);
                    roi.delete();

                    if(darkness > 85) chosen.push(oIdx);
                }
                // Multiple choices logic: must match exactly
                if(JSON.stringify(chosen) === JSON.stringify(correctIndices)) {
                    score += activeExam.weight;
                }
            });

            // Store Result
            const res = { 
                id: Date.now(), examId: activeExam.id, examName: activeExam.name, 
                score, total: activeExam.qCount * activeExam.weight, 
                date: new Date().toLocaleString('ar-MA'), nameImg: nameImgData 
            };
            db.results.push(res);
            localStorage.setItem('sm_pro_results', JSON.stringify(db.results));

            // Final UI Update
            document.getElementById('res-score').innerText = `${score} / ${res.total}`;
            document.getElementById('res-name-img').src = nameImgData;
            document.getElementById('res-popup').classList.remove('hidden');
            
            dstTri.delete(); srcTri.delete(); M.delete(); warped.delete(); gray.delete(); nameRoi.delete();
            stopScanner();
        }

        function closeResult() {
            document.getElementById('res-popup').classList.add('hidden');
            switchTab('history');
        }

        // --- Render UI Components ---
        function renderExams() {
            const container = document.getElementById('view-exams'); container.innerHTML = '';
            db.exams.forEach(ex => {
                const d = document.createElement('div');
                d.className = "bg-white p-6 rounded-[32px] border shadow-sm space-y-5 hover:shadow-md transition-shadow";
                d.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex flex-col items-center justify-center">
                            <span class="text-lg font-black leading-none">${ex.qCount}</span>
                            <span class="text-[8px] font-bold uppercase">سؤال</span>
                        </div>
                        <div>
                            <h3 class="font-black text-slate-800 leading-tight">${ex.name}</h3>
                            <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">${ex.level} | ${ex.date}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-2">
                        <button onclick="startScanner(${ex.id})" class="bg-indigo-600 text-white py-4 rounded-2xl font-black text-sm shadow-lg shadow-indigo-100 hover:bg-indigo-700 active:scale-95 transition-all"><i class="fa-solid fa-camera-viewfinder mr-2"></i> تصحيح الأوراق</button>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="downloadSheet(${ex.id}, 'png')" class="bg-slate-50 text-slate-700 py-3 rounded-xl font-bold text-[10px] hover:bg-slate-100 transition-all">تحميل PNG</button>
                            <button onclick="deleteExam(${ex.id})" class="bg-red-50 text-red-500 py-3 rounded-xl font-bold text-[10px] hover:bg-red-100 transition-all">حذف</button>
                        </div>
                    </div>`;
                container.appendChild(d);
            });
        }

        function renderHistory() {
            const container = document.getElementById('view-history'); 
            container.innerHTML = '<div class="flex justify-between items-center mb-6"><h3 class="text-2xl font-black">سجل النتائج الأخير</h3><button onclick="clearHistory()" class="text-xs text-red-500 font-bold">مسح الكل</button></div>';
            
            if(db.results.length === 0) {
                container.innerHTML += `<div class="bg-slate-50 rounded-3xl p-10 text-center border-2 border-dashed border-slate-200 text-slate-400 font-bold">لا توجد نتائج مسجلة حالياً</div>`;
                return;
            }

            db.results.slice().reverse().forEach(r => {
                const d = document.createElement('div');
                d.className = "bg-white p-5 rounded-[28px] border border-slate-100 flex flex-wrap gap-4 justify-between items-center shadow-sm";
                d.innerHTML = `
                    <div class="flex items-center gap-4">
                        <img src="${r.nameImg}" class="w-32 h-10 object-contain bg-slate-50 rounded-lg border">
                        <div>
                            <p class="font-black text-slate-800">${r.examName}</p>
                            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">${r.date}</p>
                        </div>
                    </div>
                    <div class="text-3xl font-black text-indigo-600 italic tracking-tighter">${r.score} <span class="text-xs text-slate-300 not-italic">/ ${r.total}</span></div>
                `;
                container.appendChild(d);
            });
        }

        // --- Sheet Generation (PDF/PNG) ---
        async function downloadSheet(id, format) {
            const ex = db.exams.find(e => e.id === id);
            const container = document.getElementById('hidden-print-area');
            container.innerHTML = '';
            
            const page = document.createElement('div');
            page.className = 'sheet-page';
            page.innerHTML = `
                <div class="black-corner c-tl"></div><div class="black-corner c-tr"></div>
                <div class="black-corner c-bl"></div><div class="black-corner c-br"></div>
                <div style="margin:20mm 10mm 5mm 10mm; border-bottom:5px solid #000; padding-bottom:12px; display:flex; justify-content:space-between; align-items:end;">
                    <div><h1 style="font-size:32px; font-weight:900; margin:0;">${ex.name}</h1><p style="margin:5px 0 0 0; font-weight:900; font-size:16px; color:#666; text-transform:uppercase;">المستوى: ${ex.level}</p></div>
                    <div id="qr"></div>
                </div>
                <div style="margin:5mm 10mm 15mm 10mm; display:flex; gap:15px;">
                    <div style="flex:2; border:3px solid #000; padding:18px; font-weight:900; font-size:18px;">الاسم الكامل: ................................................................</div>
                    <div style="flex:1; border:3px solid #000; padding:18px; font-weight:900; font-size:18px;">القسم: ............</div>
                </div>
                <div id="grid-container" style="margin:0 10mm; display:flex; flex-wrap:wrap; gap:50px;"></div>
            `;
            
            const grid = page.querySelector('#grid-container');
            const itemsPerCol = 20;
            const colsCount = Math.ceil(ex.qCount / itemsPerCol);
            
            for(let c=0; c < colsCount; c++) {
                const col = document.createElement('div');
                col.style.width = "calc(100% / " + colsCount + " - 40px)";
                for(let i = c*itemsPerCol; i < Math.min((c+1)*itemsPerCol, ex.qCount); i++) {
                    const row = document.createElement('div');
                    row.style.cssText = "display:flex; gap:8px; align-items:center; margin-bottom:8px;";
                    let bubbles = '';
                    for(let j=0; j<ex.oCount; j++) {
                        bubbles += `<div style="width:18px; height:18px; border:1.8px solid #000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:bold;">${LETTERS[j]}</div>`;
                    }
                    row.innerHTML = `<div style="width:25px; font-size:12px; font-weight:900; border-left:3px solid #000; padding-left:5px;">${i+1}</div>${bubbles}`;
                    col.appendChild(row);
                }
                grid.appendChild(col);
            }
            container.appendChild(page);
            new QRCode(page.querySelector('#qr'), { text: `SM-${ex.id}`, width: 80, height: 80, correctLevel: QRCode.CorrectLevel.H });
            
            setTimeout(async () => {
                const canvas = await html2canvas(page, { scale: 3, useCORS: true });
                if(format === 'png') {
                    const link = document.createElement('a'); link.download = `${ex.name}_ورقة_الإجابة.png`; link.href = canvas.toDataURL(); link.click();
                } else {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    pdf.addImage(canvas.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, 210, 297);
                    pdf.save(`${ex.name}_Sheet.pdf`);
                }
            }, 800);
        }

        function deleteExam(id) { if(confirm("هل أنت متأكد من حذف هذا الامتحان نهائياً؟")) { db.exams = db.exams.filter(e => e.id !== id); localStorage.setItem('sm_pro_exams', JSON.stringify(db.exams)); renderExams(); } }
        function clearHistory() { if(confirm("مسح كافة النتائج؟")) { db.results = []; localStorage.setItem('sm_pro_results', JSON.stringify(db.results)); renderHistory(); } }

        window.onload = () => switchTab('exams');
    </script>
</body>
</html>
