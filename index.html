<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMark Pro | نظام التصحيح الآلي المتكامل</title>
    
    <!-- المكاتب البرمجية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; overflow: hidden; }
        
        /* --- نظام القائمة الجانبية المتجاوب --- */
        #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
        .sidebar-open #sidebar-overlay { display: block; }

        aside { transition: transform 0.3s ease-in-out; z-index: 50; }

        @media (max-width: 767px) {
            aside { position: fixed; top: 0; right: 0; bottom: 0; transform: translateX(100%); width: 280px; }
            .sidebar-open aside { transform: translateX(0); }
        }

        /* فقاعات الاختيار */
        .bubble-select { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .bubble-select.selected { background-color: #4f46e5; color: white; border-color: #4f46e5; }

        /* الكاميرا */
        .scanner-active { display: flex !important; }
        .guide-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 75%; border: 3px solid #10b981; border-radius: 20px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.7); pointer-events: none; }

        /* --- تصميم ورقة الإجابة المطور (FIXED ALIGNMENT) --- */
        #sheet-gen-container { position: fixed; left: -9999px; top: 0; background: #eee; padding: 20px; }
        .a4-page { width: 210mm; min-height: 297mm; background: white; margin: 0 auto; box-sizing: border-box; position: relative; display: flex; flex-wrap: wrap; align-content: flex-start; padding: 5mm; }
        .omr-sheet { background: white; border: 1px solid #eee; position: relative; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; color: black; }
        
        .anchor { position: absolute; width: 7mm; height: 7mm; background: black; }
        .t-r { top: 3mm; right: 3mm; } .t-l { top: 3mm; left: 3mm; }
        .b-r { bottom: 3mm; right: 3mm; } .b-l { bottom: 3mm; left: 3mm; }

        .sheet-header { border-bottom: 2px solid black; margin: 10mm 10mm 5mm; padding-bottom: 5px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 0 10mm 12mm; }
        .info-item { border-bottom: 1px solid #000; padding: 5px 0; font-size: 14px; font-weight: bold; }

        .questions-container { display: flex; gap: 40px; margin: 0 10mm; flex: 1; justify-content: flex-start; }
        .column { display: flex; flex-direction: column; }
        
        /* تنسيق رأس العمود (الحروف) */
        .col-header { display: flex; margin-bottom: 10px; padding-right: 40px; }
        .header-letter { width: 20px; margin: 0 2.5px; text-align: center; font-weight: 900; font-size: 15px; }
        
        /* تنسيق صف السؤال (المحاذاة الدقيقة) */
        .q-row { display: flex; align-items: center; height: 26px; margin-bottom: 4px; }
        .q-num { 
            width: 32px; 
            height: 100%;
            display: flex;
            align-items: center; 
            justify-content: flex-start;
            font-weight: 800; 
            font-size: 12px; 
            border-left: 1.5px solid #000; 
            margin-left: 8px; 
            padding-left: 5px; 
            line-height: 1;
        }
        .q-bubble { width: 20px; height: 20px; border: 1.5px solid black; border-radius: 50%; margin: 0 2.5px; }

        .layout-1 .omr-sheet { width: 100%; height: 100%; padding: 5mm; }
        .layout-2 .omr-sheet { width: 100%; height: 49%; margin-bottom: 1%; border: 1px dashed #ccc; }
        .layout-4 .omr-sheet { width: 49%; height: 49%; margin: 0.5%; border: 1px dashed #ccc; }
    </style>
</head>
<body class="text-slate-900">

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="flex h-screen overflow-hidden">
        <!-- القائمة الجانبية -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl shrink-0">
            <div class="p-6 border-b border-slate-800 text-center relative">
                <h1 class="text-2xl font-black text-indigo-400">SMART MARK</h1>
                <p class="text-[10px] text-slate-400 mt-1 uppercase">Pro Version 2.0</p>
                <button onclick="toggleSidebar()" class="md:hidden absolute top-4 left-4 text-slate-400">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <button onclick="switchTab('dashboard')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 bg-indigo-600" id="btn-dashboard">
                    <i class="fa-solid fa-chart-line"></i> الإحصائيات
                </button>
                <button onclick="switchTab('create')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 text-slate-300" id="btn-create">
                    <i class="fa-solid fa-file-signature"></i> إنشاء امتحان
                </button>
                <button onclick="switchTab('manage')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 text-slate-300" id="btn-manage">
                    <i class="fa-solid fa-list-check"></i> إدارة الامتحانات
                </button>
                <button onclick="switchTab('results')" class="nav-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3 text-slate-300" id="btn-results">
                    <i class="fa-solid fa-square-poll-vertical"></i> النتائج
                </button>
            </nav>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <header class="bg-white border-b p-4 flex justify-between items-center shadow-sm">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-600 p-2 hover:bg-slate-100 rounded-lg">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h2 id="current-tab-title" class="font-extrabold text-slate-800">لوحة التحكم</h2>
                <div id="cv-status" class="flex items-center gap-2 text-[10px] md:text-xs font-bold text-red-500">
                    <span class="w-2 h-2 bg-current rounded-full"></span> <span class="hidden sm:inline">النظام يتحمل...</span>
                </div>
            </header>

            <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8">
                <!-- 1. Dashboard -->
                <section id="tab-dashboard" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><p class="text-slate-500 text-xs font-bold">الامتحانات</p><h3 class="text-3xl font-black text-indigo-600" id="stat-exams">0</h3></div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><p class="text-slate-500 text-xs font-bold">أوراق مصححة</p><h3 class="text-3xl font-black text-emerald-600" id="stat-papers">0</h3></div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><p class="text-slate-500 text-xs font-bold">متوسط النجاح</p><h3 class="text-3xl font-black text-amber-500" id="stat-average">0%</h3></div>
                    </div>
                </section>

                <!-- 2. Create Exam -->
                <section id="tab-create" class="hidden max-w-4xl mx-auto">
                    <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 space-y-6 border">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="examTitle" placeholder="اسم الامتحان" class="w-full border-2 border-slate-100 rounded-2xl px-5 py-3 outline-none">
                            <input type="text" id="examClass" placeholder="القسم" class="w-full border-2 border-slate-100 rounded-2xl px-5 py-3 outline-none">
                        </div>
                        <div class="grid grid-cols-3 gap-4 bg-indigo-50 p-5 rounded-2xl">
                            <div><label class="text-[10px] font-bold">الأسئلة</label><input type="number" id="qCount" value="20" onchange="renderKeyGrid('create')" class="w-full p-2 rounded-xl"></div>
                            <div><label class="text-[10px] font-bold">الخيارات</label><input type="number" id="oCount" value="4" onchange="renderKeyGrid('create')" class="w-full p-2 rounded-xl"></div>
                            <div><label class="text-[10px] font-bold">النقطة</label><input type="number" id="pointsPerQ" value="1" step="0.25" class="w-full p-2 rounded-xl"></div>
                        </div>
                        <div id="answerKeyGrid" class="grid gap-2 overflow-x-auto pb-4 custom-scrollbar"></div>
                        <button onclick="saveExam()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl">حفظ الامتحان</button>
                    </div>
                </section>

                <!-- 3. Manage -->
                <section id="tab-manage" class="hidden">
                    <div id="manageGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </section>

                <!-- 4. Results -->
                <section id="tab-results" class="hidden">
                    <div class="bg-white rounded-3xl border overflow-hidden overflow-x-auto">
                        <table class="w-full text-right min-w-[500px]">
                            <thead class="bg-slate-50 text-slate-400 text-[11px] font-black uppercase">
                                <tr><th class="p-5">الاسم</th><th class="p-5">الامتحان</th><th class="p-5 text-center">النتيجة</th><th class="p-5 text-center">إجراءات</th></tr>
                            </thead>
                            <tbody id="resultsTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modals (Download, Preview, Edit, Scanner) - Same as previous version but with fixed layout logic -->
    <div id="downloadModal" class="fixed inset-0 bg-slate-900/80 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
            <h3 class="text-xl font-black">خيارات الطباعة</h3>
            <select id="dlLayout" class="w-full border-2 border-slate-100 rounded-xl p-4 font-bold outline-none">
                <option value="1">ورقة كاملة (A4)</option>
                <option value="2">ورقتان (نصف A4)</option>
                <option value="4">4 ورقات (ربع A4)</option>
            </select>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="previewSheet()" class="bg-slate-100 font-bold py-3 rounded-xl">معاينة</button>
                <button onclick="processDownload('pdf')" class="bg-red-600 text-white font-bold py-3 rounded-xl">PDF</button>
                <button onclick="processDownload('png')" class="bg-emerald-600 text-white font-bold py-3 rounded-xl">PNG</button>
            </div>
            <button onclick="closeDownloadModal()" class="w-full text-slate-400 font-bold">إلغاء</button>
        </div>
    </div>

    <div id="previewModal" class="fixed inset-0 bg-black/90 hidden z-[110] flex items-center justify-center p-4">
        <div class="relative bg-white p-2 rounded shadow-2xl max-w-full overflow-auto">
            <button onclick="closePreview()" class="absolute -top-10 left-0 text-white text-3xl">&times;</button>
            <div id="preview-area"></div>
        </div>
    </div>

    <div id="editKeyModal" class="fixed inset-0 bg-slate-900/80 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-3xl rounded-3xl p-8 shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-xl font-bold mb-4 border-b pb-4">تعديل المفتاح</h3>
            <div id="editKeyGrid" class="flex-1 overflow-y-auto grid gap-2 pb-6"></div>
            <div class="flex gap-4 pt-4 border-t">
                <button onclick="saveEditedKey()" class="flex-1 bg-emerald-600 text-white font-black py-4 rounded-2xl">حفظ</button>
                <button onclick="closeEditModal()" class="flex-1 bg-slate-100 py-4 rounded-2xl">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="scannerModal" class="fixed inset-0 bg-black z-[100] hidden flex-col">
        <div class="absolute top-6 left-6 z-50">
            <button onclick="closeScanner()" class="bg-white/20 backdrop-blur text-white px-6 py-2 rounded-full">إغلاق</button>
        </div>
        <div class="relative flex-1 flex items-center justify-center">
            <video id="videoInput" playsinline autoplay muted class="w-full h-full object-cover"></video>
            <div class="guide-box"></div>
            <div class="absolute bottom-10"><button onclick="processScan()" class="w-20 h-20 bg-white rounded-full border-[8px] border-indigo-500 flex items-center justify-center"><i class="fa-solid fa-camera text-3xl text-indigo-600"></i></button></div>
        </div>
        <canvas id="processCanvas" class="hidden"></canvas>
    </div>

    <div id="sheet-gen-container"></div>

    <script>
        let db = { exams: [], results: [] };
        let currentExamId = null;
        let isCvLoaded = false;
        let createKey = [];
        let editingKey = [];
        let editingExamId = null;
        let downloadExamId = null;
        const ARABIC_OPTS = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي'];

        // Core Functions
        function onOpenCvReady() {
            isCvLoaded = true;
            document.getElementById('cv-status').innerHTML = '<span class="w-2 h-2 bg-emerald-500 rounded-full"></span> المحرك جاهز';
            document.getElementById('cv-status').classList.replace('text-red-500', 'text-emerald-500');
        }

        window.onload = () => {
            const saved = localStorage.getItem('sm_pro_v2_final');
            if(saved) db = JSON.parse(saved);
            renderKeyGrid('create');
            updateStats();
        };

        function saveData() { localStorage.setItem('sm_pro_v2_final', JSON.stringify(db)); updateStats(); }

        function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }

        function switchTab(tabId) {
            ['dashboard', 'create', 'manage', 'results'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-' + t).classList.replace('bg-indigo-600', 'text-slate-300');
            });
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).classList.replace('text-slate-300', 'bg-indigo-600');
            const titles = { 'dashboard': 'لوحة القيادة', 'create': 'إنشاء امتحان', 'manage': 'إدارة الامتحانات', 'results': 'النتائج' };
            document.getElementById('current-tab-title').innerText = titles[tabId];
            if(tabId === 'manage') renderManageGrid();
            if(tabId === 'results') renderResultsTable();
            if(tabId === 'dashboard') updateStats();
            if(window.innerWidth < 768 && document.body.classList.contains('sidebar-open')) toggleSidebar();
        }

        function renderKeyGrid(mode, examData = null) {
            const q = mode === 'create' ? parseInt(document.getElementById('qCount').value) : examData.qCount;
            const o = mode === 'create' ? parseInt(document.getElementById('oCount').value) : examData.oCount;
            const container = document.getElementById(mode === 'create' ? 'answerKeyGrid' : 'editKeyGrid');
            if(mode === 'create') { if(createKey.length !== q) createKey = Array(q).fill().map(() => []); }
            else { editingKey = JSON.parse(JSON.stringify(examData.key)); }
            container.innerHTML = '';
            container.style.gridTemplateColumns = `40px repeat(${o}, 1fr)`;
            for(let i=0; i<q; i++) {
                const num = document.createElement('div');
                num.className = "flex items-center justify-center font-black text-slate-300 text-xs";
                num.innerText = i + 1;
                container.appendChild(num);
                for(let j=0; j<o; j++) {
                    const bubble = document.createElement('div');
                    const isSel = mode === 'create' ? createKey[i].includes(j) : editingKey[i].includes(j);
                    bubble.className = `bubble-select mx-auto ${isSel ? 'selected' : ''}`;
                    bubble.innerText = ARABIC_OPTS[j];
                    bubble.onclick = () => {
                        let target = mode === 'create' ? createKey[i] : editingKey[i];
                        const idx = target.indexOf(j);
                        if(idx > -1) target.splice(idx, 1); else target.push(j);
                        renderKeyGrid(mode, mode === 'edit' ? {qCount:q, oCount:o, key: editingKey} : null);
                    };
                    container.appendChild(bubble);
                }
            }
        }

        function saveExam() {
            const title = document.getElementById('examTitle').value;
            if(!title) return alert("اسم الامتحان مطلوب");
            db.exams.push({
                id: Date.now(), title, class: document.getElementById('examClass').value,
                qCount: parseInt(document.getElementById('qCount').value),
                oCount: parseInt(document.getElementById('oCount').value),
                pointsPerQ: parseFloat(document.getElementById('pointsPerQ').value),
                key: JSON.parse(JSON.stringify(createKey)),
                timestamp: new Date().toISOString()
            });
            saveData();
            switchTab('manage');
        }

        function renderManageGrid() {
            const grid = document.getElementById('manageGrid'); grid.innerHTML = '';
            db.exams.forEach(exam => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-3xl border shadow-sm flex flex-col";
                card.innerHTML = `
                    <h4 class="font-bold text-lg mb-1">${exam.title}</h4>
                    <p class="text-xs text-slate-400 mb-6">${exam.class}</p>
                    <div class="grid grid-cols-2 gap-3 mt-auto">
                        <button onclick="startScanning(${exam.id})" class="bg-indigo-600 text-white py-3 rounded-xl font-bold">تصحيح</button>
                        <button onclick="openDownloadModal(${exam.id})" class="bg-slate-100 py-3 rounded-xl font-bold">تحميل</button>
                        <button onclick="openEditModal(${exam.id})" class="bg-amber-50 text-amber-700 py-3 rounded-xl font-bold col-span-2">تعديل</button>
                        <button onclick="deleteExam(${exam.id})" class="col-span-2 text-red-300 text-[10px] py-1">حذف الامتحان</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Sheet Logic (Fixed Alignment)
        function openDownloadModal(id) { downloadExamId = id; document.getElementById('downloadModal').classList.remove('hidden'); }
        function closeDownloadModal() { document.getElementById('downloadModal').classList.add('hidden'); }

        async function previewSheet() {
            await generateSheetHTML(downloadExamId, parseInt(document.getElementById('dlLayout').value));
            const canvas = await html2canvas(document.querySelector('.a4-page'), { scale: 1 });
            document.getElementById('preview-area').innerHTML = '';
            document.getElementById('preview-area').appendChild(canvas);
            document.getElementById('previewModal').classList.remove('hidden');
        }

        function closePreview() { document.getElementById('previewModal').classList.add('hidden'); }

        async function processDownload(format) {
            const exam = db.exams.find(e => e.id === downloadExamId);
            await generateSheetHTML(downloadExamId, parseInt(document.getElementById('dlLayout').value));
            const canvas = await html2canvas(document.querySelector('.a4-page'), { scale: 2 });
            if(format === 'png') {
                const link = document.createElement('a'); link.download = `${exam.title}.png`; link.href = canvas.toDataURL(); link.click();
            } else {
                const { jsPDF } = window.jspdf; const pdf = new jsPDF('p', 'mm', 'a4');
                pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297); pdf.save(`${exam.title}.pdf`);
            }
            closeDownloadModal();
        }

        async function generateSheetHTML(id, layout) {
            const exam = db.exams.find(e => e.id === id);
            const container = document.getElementById('sheet-gen-container');
            container.innerHTML = `<div class="a4-page layout-${layout}"></div>`;
            const page = container.querySelector('.a4-page');
            for(let i=0; i<layout; i++) {
                const sheet = document.createElement('div');
                sheet.className = "omr-sheet";
                sheet.innerHTML = `
                    <div class="anchor t-r"></div><div class="anchor t-l"></div><div class="anchor b-r"></div><div class="anchor b-l"></div>
                    <div class="sheet-header flex justify-between items-center">
                        <div><h1 class="text-xl font-black">${exam.title}</h1><p class="text-[9px] font-bold text-slate-400">SMARTMARK AI System</p></div>
                        <div id="qr-${i}"></div>
                    </div>
                    <div class="info-grid"><div class="info-item">اسم التلميذ: ...................................</div><div class="info-item">القسم: ${exam.class}</div></div>
                    <div class="questions-container">${renderSheetColumns(exam.qCount, exam.oCount)}</div>
                    <div class="p-4 text-[7px] text-center font-bold text-slate-200 uppercase">STANDARDIZED SHEET - DO NOT FOLD</div>
                `;
                page.appendChild(sheet);
                new QRCode(sheet.querySelector(`#qr-${i}`), { text: `SM-${exam.id}`, width: 50, height: 50 });
            }
        }

        function renderSheetColumns(qCount, oCount) {
            let html = ''; const qPerCol = 20; const cols = Math.ceil(qCount / qPerCol);
            for(let c=0; c<cols; c++) {
                html += `<div class="column">
                    <div class="col-header">${ARABIC_OPTS.slice(0, oCount).map(l => `<div class="header-letter">${l}</div>`).join('')}</div>`;
                const start = c * qPerCol; const end = Math.min(start + qPerCol, qCount);
                for(let i=start; i<end; i++) {
                    html += `<div class="q-row"><div class="q-num">${i+1}</div>`;
                    for(let j=0; j<oCount; j++) html += `<div class="q-bubble"></div>`;
                    html += `</div>`;
                }
                html += `</div>`;
            }
            return html;
        }

        // OpenCV Engine Logic
        function startScanning(id) {
            currentExamId = id; document.getElementById('scannerModal').classList.add('scanner-active');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(s => { window.stream = s; document.getElementById('videoInput').srcObject = s; });
        }

        function closeScanner() { document.getElementById('scannerModal').classList.remove('scanner-active'); if(window.stream) window.stream.getTracks().forEach(t => t.stop()); }

        function processScan() {
            if (!isCvLoaded) return alert("انتظر تحميل المحرك...");
            const video = document.getElementById('videoInput');
            const canvas = document.getElementById('processCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let src = cv.imread(canvas);
            let gray = new cv.Mat(); cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            let blurred = new cv.Mat(); cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
            let thresh = new cv.Mat(); cv.adaptiveThreshold(blurred, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);
            let contours = new cv.MatVector(); let hierarchy = new cv.Mat();
            cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
            let found = false; let approx = new cv.Mat();
            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i); let area = cv.contourArea(cnt);
                if (area > 50000) {
                    let peri = cv.arcLength(cnt, true); let tmp = new cv.Mat();
                    cv.approxPolyDP(cnt, tmp, 0.02 * peri, true);
                    if (tmp.rows === 4) { approx = tmp; found = true; break; }
                }
            }
            if (found) {
                let warped = transformPerspective(src, approx);
                let nameROI = warped.roi(new cv.Rect(40, 70, warped.cols - 80, 70));
                cv.imshow(canvas, nameROI); let nameImg = canvas.toDataURL();
                const exam = db.exams.find(e => e.id === currentExamId);
                let examGrades = analyzeBubbles(warped, exam);
                let score = 0;
                examGrades.forEach((studentAns, qIdx) => {
                    const correctAns = exam.key[qIdx] || [];
                    if (JSON.stringify(studentAns.sort()) === JSON.stringify(correctAns.sort()) && correctAns.length > 0) score += exam.pointsPerQ;
                });
                db.results.push({ id: Date.now(), examId: currentExamId, nameImg, answers: examGrades, score, total: exam.qCount * exam.pointsPerQ, timestamp: new Date().toISOString() });
                saveData(); alert(`النتيجة: ${score} / ${exam.qCount * exam.pointsPerQ}`);
                closeScanner(); renderResultsTable(); warped.delete(); nameROI.delete();
            } else { alert("لم يتم اكتشاف الورقة."); }
            src.delete(); gray.delete(); blurred.delete(); thresh.delete(); contours.delete(); hierarchy.delete();
        }

        function transformPerspective(src, approx) {
            let pts = []; for (let i = 0; i < 4; i++) pts.push({ x: approx.data32S[i * 2], y: approx.data32S[i * 2 + 1] });
            pts.sort((a, b) => a.y - b.y);
            let top = pts.slice(0, 2).sort((a, b) => b.x - a.x);
            let bottom = pts.slice(2, 4).sort((a, b) => b.x - a.x);
            let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [top[0].x, top[0].y, top[1].x, top[1].y, bottom[1].x, bottom[1].y, bottom[0].x, bottom[0].y]);
            let dstCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [600, 0, 0, 0, 0, 800, 600, 800]);
            let M = cv.getPerspectiveTransform(srcCoords, dstCoords);
            let warped = new cv.Mat(); cv.warpPerspective(src, warped, M, new cv.Size(600, 800));
            srcCoords.delete(); dstCoords.delete(); M.delete(); return warped;
        }

        function analyzeBubbles(warped, exam) {
            let gray = new cv.Mat(); cv.cvtColor(warped, gray, cv.COLOR_RGBA2GRAY);
            let thresh = new cv.Mat(); cv.threshold(gray, thresh, 0, 255, cv.THRESH_BINARY_INV | cv.THRESH_OTSU);
            let results = []; let startY = 230; let rowH = (warped.rows - startY - 50) / 20;
            for (let i = 0; i < exam.qCount; i++) {
                let colIdx = Math.floor(i / 20); let rowIdx = i % 20; let qAnswers = [];
                for (let j = 0; j < exam.oCount; j++) {
                    let x = warped.cols - 110 - (colIdx * 200) - (j * 25);
                    let y = startY + (rowIdx * rowH) + 12;
                    let roi = thresh.roi(new cv.Rect(x, y, 18, 18));
                    if (cv.countNonZero(roi) > (roi.cols * roi.rows * 0.45)) qAnswers.push(j);
                    roi.delete();
                }
                results.push(qAnswers);
            }
            gray.delete(); thresh.delete(); return results;
        }

        function updateStats() {
            document.getElementById('stat-exams').innerText = db.exams.length;
            document.getElementById('stat-papers').innerText = db.results.length;
            let total = 0; db.results.forEach(r => total += (r.score/r.total)*100);
            document.getElementById('stat-average').innerText = db.results.length ? Math.round(total/db.results.length) + "%" : "0%";
        }

        function renderResultsTable() {
            const body = document.getElementById('resultsTableBody'); body.innerHTML = '';
            db.results.slice().reverse().forEach(res => {
                const exam = db.exams.find(e => e.id === res.examId);
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-5"><img src="${res.nameImg}" class="h-10 rounded border bg-white"></td>
                    <td class="p-5 font-bold">${exam?.title || '?'}</td>
                    <td class="p-5 text-center font-black text-indigo-600">${res.score} / ${res.total}</td>
                    <td class="p-5 text-center"><button onclick="deleteResult(${res.id})" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash"></i></button></td>`;
                body.appendChild(tr);
            });
        }

        function deleteExam(id) { if(confirm('حذف الامتحان؟')) { db.exams = db.exams.filter(e => e.id !== id); db.results = db.results.filter(r => r.examId !== id); saveData(); renderManageGrid(); } }
        function deleteResult(id) { if(confirm('حذف النتيجة؟')) { db.results = db.results.filter(r => r.id !== id); saveData(); renderResultsTable(); } }
        function openEditModal(id) { editingExamId = id; const exam = db.exams.find(e => e.id === id); renderKeyGrid('edit', exam); document.getElementById('editKeyModal').classList.remove('hidden'); }
        function closeEditModal() { document.getElementById('editKeyModal').classList.add('hidden'); }
        function saveEditedKey() { const idx = db.exams.findIndex(e => e.id === editingExamId); db.exams[idx].key = JSON.parse(JSON.stringify(editingKey)); saveData(); closeEditModal(); }
    </script>
</body>
