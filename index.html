<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartMark Pro | الذكاء الاصطناعي للتصحيح</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <!-- تحميل OpenCV.js -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; overflow: hidden; touch-action: manipulation; }
        
        /* تصميم الإطار مثل ZipGrade */
        .target-box { position: absolute; width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.3); border-radius: 10px; transition: 0.2s; }
        .target-box.found { border-color: #10b981; background: rgba(16, 185, 129, 0.2); }
        .t-tl { top: 15%; left: 10%; } .t-tr { top: 15%; right: 10%; }
        .t-bl { bottom: 20%; left: 10%; } .t-br { bottom: 20%; right: 10%; }

        .bubble-active { background: #1e293b !important; color: white !important; }
        
        /* ورقة الإجابة */
        .a4-page { width: 210mm; min-height: 297mm; padding: 10mm; background: white; position: relative; box-sizing: border-box; }
        .anchor { position: absolute; width: 12mm; height: 12mm; background: black; border-radius: 2px; }
        .an-tl { top: 8mm; left: 8mm; } .an-tr { top: 8mm; right: 8mm; }
        .an-bl { bottom: 8mm; left: 8mm; } .an-br { bottom: 8mm; right: 8mm; }

        .sheet-header-row { display: flex; gap: 4px; margin-bottom: 2px; justify-content: center; }
        .letter-label { width: 20px; text-align: center; font-size: 9px; font-weight: 900; }
        .q-row { display: flex; gap: 4px; align-items: center; margin-bottom: 5px; justify-content: center; }
        .q-num { width: 22px; font-size: 10px; font-weight: bold; border-left: 2px solid #000; padding-left: 3px; }
        .bubble-outline { width: 18px; height: 18px; border: 1.5px solid #000; border-radius: 50%; }

        #result-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 300; width: 85%; max-width: 350px; }
    </style>
</head>
<body class="text-slate-900">

    <div id="sidebar-overlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/60 z-40 md:hidden opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:relative inset-y-0 right-0 w-72 bg-slate-900 text-white flex flex-col z-50 transform translate-x-full md:translate-x-0 transition-transform duration-300">
            <div class="p-8 border-b border-slate-800">
                <h1 class="text-2xl font-black text-indigo-400">SmartMark</h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest">المصحح الآلي الذكي</p>
            </div>
            <nav class="flex-1 p-4 space-y-2 mt-4">
                <button onclick="switchTab('exams')" id="nav-exams" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl bg-indigo-600 shadow-lg shadow-indigo-500/20"><i class="fa-solid fa-layer-group"></i> الامتحانات</button>
                <button onclick="switchTab('create')" id="nav-create" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-slate-400 hover:bg-slate-800"><i class="fa-solid fa-plus"></i> إنشاء امتحان</button>
                <button onclick="switchTab('history')" id="nav-history" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-slate-400 hover:bg-slate-800"><i class="fa-solid fa-clock-rotate-left"></i> النتائج</button>
            </nav>
            <div id="cv-status" class="p-4 m-4 bg-red-500/10 border border-red-500/20 rounded-xl text-[10px] text-red-400 text-center font-bold">جاري تحميل محرك التصحيح...</div>
        </aside>

        <!-- Main -->
        <main class="flex-1 flex flex-col min-w-0 bg-white relative">
            <header class="h-16 border-b px-6 flex items-center justify-between sticky top-0 bg-white/80 backdrop-blur-md z-30">
                <button onclick="toggleSidebar(true)" class="md:hidden p-2 text-slate-600"><i class="fa-solid fa-bars-staggered text-xl"></i></button>
                <h2 id="header-title" class="font-black text-slate-800">إدارة الامتحانات</h2>
                <div class="w-10 h-10 bg-slate-100 rounded-full border flex items-center justify-center text-slate-400"><i class="fa-solid fa-user"></i></div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8">
                <section id="tab-exams" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></section>
                
                <section id="tab-create" class="hidden max-w-3xl mx-auto space-y-6">
                    <div class="bg-white p-8 rounded-[32px] border shadow-sm space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="ex-name" placeholder="اسم المادة" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 outline-none">
                            <input type="text" id="ex-level" placeholder="المستوى" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="number" id="ex-q" value="20" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-indigo-500 outline-none">
                            <select id="ex-o" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-indigo-500 outline-none">
                                <option value="4">4 خيارات</option>
                                <option value="6">6 خيارات</option>
                                <option value="12">12 خياراً</option>
                            </select>
                        </div>
                        <div class="bg-slate-900 p-6 rounded-3xl">
                            <h4 class="text-white font-bold mb-4">مفتاح التصحيح (اختر الإجابات)</h4>
                            <div id="key-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-80 overflow-y-auto p-2"></div>
                        </div>
                        <button onclick="saveExam()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black shadow-xl shadow-indigo-100 transition-all active:scale-95">حفظ وإضافة الامتحان</button>
                    </div>
                </section>

                <section id="tab-history" class="hidden space-y-4"></section>
            </div>
        </main>
    </div>

    <!-- Scanner Interface (ZipGrade Style) -->
    <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden overflow-hidden">
        <video id="video" class="w-full h-full object-cover opacity-80" playsinline></video>
        
        <!-- Viewfinder Targets -->
        <div id="box-tl" class="target-box t-tl"></div>
        <div id="box-tr" class="target-box t-tr"></div>
        <div id="box-bl" class="target-box t-bl"></div>
        <div id="box-br" class="target-box t-br"></div>

        <div class="absolute bottom-12 inset-x-0 flex flex-col items-center gap-4">
            <div id="scan-status" class="bg-black/60 backdrop-blur-md text-white px-8 py-3 rounded-full text-xs font-bold border border-white/10">جاري البحث عن المربعات الأربعة...</div>
            <button onclick="stopScanner()" class="w-16 h-16 bg-white/10 rounded-full border border-white/20 text-white flex items-center justify-center text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <canvas id="proc-canvas" class="hidden"></canvas>
    </div>

    <!-- Result Popup -->
    <div id="result-popup" class="bg-white rounded-[40px] p-8 shadow-2xl text-center border-4 border-indigo-600">
        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-check text-4xl"></i>
        </div>
        <h3 class="font-black text-2xl text-slate-800">تم التصحيح!</h3>
        <p id="res-score" class="text-6xl font-black text-indigo-600 my-6">0 / 0</p>
        <button onclick="closeResult()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">تصحيح ورقة أخرى</button>
    </div>

    <!-- Hidden Area for Generation -->
    <div id="print-area" style="position:fixed; left:-9999px;"></div>

    <script>
        let db = { exams: JSON.parse(localStorage.getItem('sm_v5_exams') || '[]'), results: JSON.parse(localStorage.getItem('sm_v5_results') || '[]') };
        let isCvLoaded = false, scanActive = false, activeExam = null;
        const LETTERS = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي', 'ك', 'ل'];

        function onOpenCvReady() {
            isCvLoaded = true;
            const status = document.getElementById('cv-status');
            status.innerHTML = "🟢 نظام التصحيح جاهز";
            status.className = "p-4 m-4 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-[10px] text-emerald-500 text-center font-bold";
        }

        // --- Tabs ---
        function toggleSidebar(state) {
            document.getElementById('sidebar').classList.toggle('translate-x-full', !state);
            const overlay = document.getElementById('sidebar-overlay');
            overlay.style.opacity = state ? "1" : "0";
            overlay.style.pointerEvents = state ? "auto" : "none";
        }

        function switchTab(tab) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('bg-indigo-600', 'text-slate-400'));
            document.getElementById('nav-' + tab).classList.replace('text-slate-400', 'bg-indigo-600');
            if(tab === 'exams') renderExams();
            if(tab === 'history') renderHistory();
            if(tab === 'create') updateKeyGrid();
            if(window.innerWidth < 768) toggleSidebar(false);
        }

        // --- Exams ---
        function updateKeyGrid() {
            const q = parseInt(document.getElementById('ex-q').value), o = parseInt(document.getElementById('ex-o').value);
            const grid = document.getElementById('key-grid'); grid.innerHTML = '';
            for(let i=0; i<q; i++) {
                const d = document.createElement('div');
                d.className = "p-3 bg-slate-800 rounded-xl flex items-center gap-3";
                d.innerHTML = `<span class="text-xs font-bold text-slate-500 w-6">${i+1}</span><div class="flex gap-1" id="q-${i}"></div>`;
                grid.appendChild(d);
                for(let j=0; j<o; j++) {
                    const b = document.createElement('button');
                    b.className = `w-7 h-7 rounded-full border border-slate-600 text-[10px] font-bold text-white transition-all opt-${i}`;
                    b.innerText = LETTERS[j];
                    b.onclick = () => b.classList.toggle('bubble-active');
                    d.querySelector(`#q-${i}`).appendChild(b);
                }
            }
        }
        document.getElementById('ex-q').onchange = updateKeyGrid;
        document.getElementById('ex-o').onchange = updateKeyGrid;

        function saveExam() {
            const name = document.getElementById('ex-name').value, level = document.getElementById('ex-level').value;
            if(!name) return alert("المرجو إدخال اسم المادة");
            const q = parseInt(document.getElementById('ex-q').value);
            let key = [];
            for(let i=0; i<q; i++) {
                let ans = [];
                document.querySelectorAll(`.opt-${i}`).forEach((b, idx) => { if(b.classList.contains('bubble-active')) ans.push(idx); });
                key.push(ans);
            }
            db.exams.push({ id: Date.now(), name, level, qCount: q, oCount: parseInt(document.getElementById('ex-o').value), key, date: new Date().toLocaleDateString() });
            localStorage.setItem('sm_v5_exams', JSON.stringify(db.exams));
            switchTab('exams');
        }

        function renderExams() {
            const container = document.getElementById('tab-exams'); container.innerHTML = '';
            db.exams.forEach(ex => {
                const d = document.createElement('div');
                d.className = "bg-white p-6 rounded-[32px] border shadow-sm space-y-4";
                d.innerHTML = `<div class="flex items-center gap-4"><div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center font-black">${ex.qCount}</div>
                    <div><h3 class="font-black text-slate-800">${ex.name}</h3><p class="text-[10px] text-slate-400 font-bold uppercase">${ex.level}</p></div></div>
                    <div class="grid grid-cols-2 gap-2"><button onclick="startScanner(${ex.id})" class="col-span-2 bg-slate-900 text-white py-4 rounded-2xl font-black"><i class="fa-solid fa-camera mr-2"></i> بدء المسح الضوئي</button>
                    <button onclick="downloadSheet(${ex.id})" class="bg-indigo-50 text-indigo-600 py-3 rounded-2xl font-black text-xs">تحميل الورقة</button>
                    <button onclick="deleteExam(${ex.id})" class="bg-red-50 text-red-500 py-3 rounded-2xl font-black text-xs">حذف</button></div>`;
                container.appendChild(d);
            });
        }

        function deleteExam(id) { if(confirm("حذف الامتحان؟")) { db.exams = db.exams.filter(e => e.id !== id); localStorage.setItem('sm_v5_exams', JSON.stringify(db.exams)); renderExams(); } }

        // --- SCANNER ENGINE (THE REAL ZIPGRADE LOGIC) ---
        async function startScanner(id) {
            if(!isCvLoaded) return alert("بانتظار تحميل محرك OpenCV...");
            activeExam = db.exams.find(e => e.id === id);
            scanActive = true;
            document.getElementById('scanner-modal').classList.remove('hidden');
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', focusMode: 'continuous', width: {ideal: 1280}, height: {ideal: 720} } });
            document.getElementById('video').srcObject = stream;
            document.getElementById('video').play();
            requestAnimationFrame(scanLoop);
        }

        function stopScanner() {
            scanActive = false;
            const s = document.getElementById('video').srcObject;
            if(s) s.getTracks().forEach(t => t.stop());
            document.getElementById('scanner-modal').classList.add('hidden');
        }

        function scanLoop() {
            if(!scanActive) return;
            const video = document.getElementById('video');
            const canvas = document.getElementById('proc-canvas');
            const ctx = canvas.getContext('2d');

            if(video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 640; canvas.height = 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                let src = cv.imread(canvas);
                let gray = new cv.Mat();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                cv.adaptiveThreshold(gray, gray, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(gray, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let anchors = [];
                for(let i=0; i<contours.size(); i++) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    if(area > 200 && area < 2000) {
                        let rect = cv.boundingRect(cnt);
                        let ratio = rect.width / rect.height;
                        if(ratio > 0.8 && ratio < 1.2) {
                            anchors.push(rect);
                        }
                    }
                }

                // رسم الحالة على Viewfinders
                updateTargetBoxes(anchors);

                if(anchors.length === 4) {
                    processPaper(src, anchors);
                } else {
                    requestAnimationFrame(scanLoop);
                }

                src.delete(); gray.delete(); contours.delete(); hierarchy.delete();
            } else {
                requestAnimationFrame(scanLoop);
            }
        }

        function updateTargetBoxes(anchors) {
            const boxes = ['tl', 'tr', 'bl', 'br'];
            boxes.forEach(b => document.getElementById('box-'+b).classList.remove('found'));
            
            if(anchors.length > 0) document.getElementById('scan-status').innerText = `تم العثور على ${anchors.length} مربعات...`;
            
            // محاكاة الإضاءة الخضراء
            if(anchors.length === 4) {
                boxes.forEach(b => document.getElementById('box-'+b).classList.add('found'));
                document.getElementById('scan-status').innerText = "تم الالتقاط! جاري التحليل...";
            }
        }

        function processPaper(src, anchors) {
            // 1. Perspective Transform (تعديل الورقة لتصبح مستطيلة تماماً)
            anchors.sort((a,b) => a.y - b.y);
            let top = anchors.slice(0,2).sort((a,b) => a.x - b.x);
            let bottom = anchors.slice(2,4).sort((a,b) => a.x - b.x);

            let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [
                top[0].x, top[0].y, top[1].x + top[1].width, top[1].y,
                bottom[0].x, bottom[0].y + bottom[0].height, bottom[1].x + bottom[1].width, bottom[1].y + bottom[1].height
            ]);
            let dstCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, 600, 800, 0, 800, 600, 800]);
            let M = cv.getPerspectiveTransform(srcCoords, dstCoords);
            let warped = new cv.Mat();
            cv.warpPerspective(src, warped, M, new cv.Size(600, 800));

            // 2. تحليل الدوائر (Bubble Logic)
            let score = 0;
            let gray = new cv.Mat();
            cv.cvtColor(warped, gray, cv.COLOR_RGBA2GRAY);
            cv.threshold(gray, gray, 0, 255, cv.THRESH_BINARY_INV | cv.THRESH_OTSU);

            // إحداثيات افتراضية تعتمد على شكل الورقة المولدة
            for(let i=0; i<activeExam.qCount; i++) {
                let colIdx = Math.floor(i / 20);
                let rowIdx = i % 20;
                let studentAns = [];

                for(let j=0; j<activeExam.oCount; j++) {
                    let bx = 80 + (colIdx * 180) + (j * 25);
                    let by = 280 + (rowIdx * 22);
                    
                    let roi = gray.roi(new cv.Rect(bx, by, 18, 18));
                    let darkness = cv.countNonZero(roi);
                    if(darkness > (roi.cols * roi.rows * 0.5)) studentAns.push(j);
                    roi.delete();
                }

                // قارن مع المفتاح
                if(JSON.stringify(studentAns) === JSON.stringify(activeExam.key[i])) score++;
            }

            // 3. التقاط صورة الاسم
            let nameCanvas = document.createElement('canvas');
            cv.imshow(nameCanvas, warped.roi(new cv.Rect(50, 150, 500, 80)));

            // حفظ النتيجة
            const result = {
                id: Date.now(), examId: activeExam.id, examName: activeExam.name,
                score, total: activeExam.qCount, date: new Date().toLocaleString('ar-MA'),
                nameImg: nameCanvas.toDataURL()
            };
            db.results.push(result);
            localStorage.setItem('sm_v5_results', JSON.stringify(db.results));

            // إظهار النتيجة
            scanActive = false;
            document.getElementById('res-score').innerText = `${score} / ${activeExam.qCount}`;
            document.getElementById('result-popup').style.display = 'block';

            M.delete(); warped.delete(); gray.delete();
        }

        function closeResult() {
            document.getElementById('result-popup').style.display = 'none';
            startScanner(activeExam.id);
        }

        // --- History & Sheets ---
        function renderHistory() {
            const container = document.getElementById('tab-history'); container.innerHTML = '<h3 class="text-xl font-black mb-6">سجل النتائج</h3>';
            db.results.slice().reverse().forEach(r => {
                const d = document.createElement('div');
                d.className = "bg-white p-4 rounded-3xl border flex items-center justify-between";
                d.innerHTML = `<div class="flex items-center gap-4"><img src="${r.nameImg}" class="h-10 border rounded-lg">
                    <div><p class="font-bold text-sm">${r.examName}</p><p class="text-[9px] text-slate-400 font-bold">${r.date}</p></div></div>
                    <div class="text-xl font-black text-indigo-600">${r.score}/${r.total}</div>`;
                container.appendChild(d);
            });
        }

        async function downloadSheet(id) {
            const ex = db.exams.find(e => e.id === id);
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = '';
            
            const page = document.createElement('div');
            page.className = 'a4-page';
            page.id = 'sheet-to-print';
            page.innerHTML = `
                <div class="anchor an-tl"></div><div class="anchor an-tr"></div>
                <div class="anchor an-bl"></div><div class="anchor an-br"></div>
                <div style="margin:20mm 10mm 10mm 10mm; border-bottom:3px solid #000; padding-bottom:10px; display:flex; justify-content:space-between; align-items:end;">
                    <div><h1 style="font-size:24px; font-weight:900; margin:0;">${ex.name}</h1><p style="margin:0; font-weight:bold;">${ex.level}</p></div>
                    <div id="qr"></div>
                </div>
                <div style="margin:0 10mm 15mm 10mm; display:flex; gap:10px;">
                    <div style="flex:2; border:2px solid #000; padding:12px; font-weight:900;">اسم التلميذ:</div>
                    <div style="flex:1; border:2px solid #000; padding:12px; font-weight:900;">القسم:</div>
                </div>
            `;

            const grid = document.createElement('div');
            grid.style.cssText = "display:flex; flex-wrap:wrap; gap:30px; margin:0 10mm;";
            const perCol = 20;
            for(let c=0; c < Math.ceil(ex.qCount/perCol); c++) {
                const col = document.createElement('div');
                for(let i = c*perCol; i < Math.min((c+1)*perCol, ex.qCount); i++) {
                    if(i % 10 === 0) {
                        const h = document.createElement('div'); h.className = 'sheet-header-row';
                        h.innerHTML = `<div style="width:22px"></div>` + LETTERS.slice(0, ex.oCount).map(l => `<div class="letter-label">${l}</div>`).join('');
                        col.appendChild(h);
                    }
                    const row = document.createElement('div'); row.className = 'q-row';
                    row.innerHTML = `<div class="q-num">${i+1}</div>` + `<div class="bubble-outline"></div>`.repeat(ex.oCount);
                    col.appendChild(row);
                }
                grid.appendChild(col);
            }
            page.appendChild(grid);
            printArea.appendChild(page);
            
            new QRCode(page.querySelector('#qr'), { text: `EX-${ex.id}`, width: 60, height: 60 });
            
            setTimeout(async () => {
                const canvas = await html2canvas(page, { scale: 3 });
                const link = document.createElement('a'); link.download = `${ex.name}.png`; link.href = canvas.toDataURL(); link.click();
            }, 500);
        }

        window.onload = () => switchTab('exams');
    </script>
</body>
</html>
