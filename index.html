<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartMark Pro v8 | النظام المتكامل</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; overflow: hidden; }
        
        .bubble-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; background: white; }
        .bubble-btn.selected { background-color: #4f46e5 !important; color: white !important; border-color: #4f46e5; transform: scale(1.1); }

        .target-frame { position: absolute; width: 60px; height: 60px; border: 5px solid rgba(255,255,255,0.2); border-radius: 12px; transition: 0.3s; z-index: 101; }
        .target-frame.detected { border-color: #10b981; background: rgba(16, 185, 129, 0.2); box-shadow: 0 0 20px #10b981; }
        .tf-tl { top: 12%; left: 10%; } .tf-tr { top: 12%; right: 10%; }
        .tf-bl { bottom: 20%; left: 10%; } .tf-br { bottom: 20%; right: 10%; }

        .sheet-page { width: 210mm; min-height: 297mm; padding: 15mm; background: white; position: relative; color: black; box-sizing: border-box; }
        .black-corner { position: absolute; width: 14mm; height: 14mm; background: black; border-radius: 2px; }
        .c-tl { top: 10mm; left: 10mm; } .c-tr { top: 10mm; right: 10mm; }
        .c-bl { bottom: 10mm; left: 10mm; } .c-br { bottom: 10mm; right: 10mm; }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-900">

    <!-- Sidebar & Overlay -->
    <div id="sidebar-overlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/60 z-40 md:hidden opacity-0 pointer-events-none transition-opacity"></div>
    
    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="fixed md:relative inset-y-0 right-0 w-72 bg-slate-900 text-white flex flex-col z-50 transform translate-x-full md:translate-x-0 transition-transform duration-300">
            <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30"><i class="fa-solid fa-microchip"></i></div>
                <div><h1 class="text-xl font-black">SmartMark</h1><p class="text-[9px] text-slate-500 font-bold uppercase">Pro Edition v8.0</p></div>
            </div>
            
            <nav class="flex-1 p-4 space-y-2 mt-4">
                <button onclick="switchTab('exams')" id="btn-exams" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl bg-indigo-600 transition-all font-bold"><i class="fa-solid fa-layer-group"></i> الامتحانات</button>
                <button onclick="switchTab('create')" id="btn-create" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-slate-400 hover:bg-slate-800 transition-all font-bold"><i class="fa-solid fa-plus-circle"></i> إنشاء امتحان</button>
                <button onclick="switchTab('history')" id="btn-history" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-slate-400 hover:bg-slate-800 transition-all font-bold"><i class="fa-solid fa-clock-rotate-left"></i> السجل</button>
            </nav>

            <div class="p-4 m-4 bg-slate-800/50 rounded-2xl border border-slate-700/50">
                <div id="cv-status" class="text-[10px] font-bold text-amber-400 flex items-center gap-2"><i class="fa-solid fa-spinner fa-spin"></i> تهيئة OpenCV...</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <header class="h-16 border-b px-6 flex items-center justify-between bg-white z-30">
                <button onclick="toggleSidebar(true)" class="md:hidden p-2 text-slate-600"><i class="fa-solid fa-bars-staggered"></i></button>
                <h2 id="tab-title" class="font-black text-slate-800">قائمة الامتحانات</h2>
                <div class="w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-600 border border-indigo-100"><i class="fa-solid fa-user-gear"></i></div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8">
                <!-- Tab: Exams -->
                <section id="view-exams" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></section>
                
                <!-- Tab: Create/Edit -->
                <section id="view-create" class="hidden max-w-5xl mx-auto pb-20">
                    <div class="bg-white rounded-[32px] border shadow-sm p-6 md:p-10 space-y-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <input type="hidden" id="edit-id">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase pr-2">اسم المادة</label>
                                <input type="text" id="in-name" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 outline-none font-bold">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase pr-2">المستوى</label>
                                <input type="text" id="in-level" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 outline-none font-bold">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase pr-2">عدد الأسئلة</label>
                                <input type="number" id="in-q" value="20" onchange="updateKeyGrid()" class="w-full p-4 bg-slate-50 rounded-2xl font-black border-2 border-transparent focus:border-indigo-500 outline-none">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase pr-2">عدد الخيارات</label>
                                <select id="in-o" onchange="updateKeyGrid()" class="w-full p-4 bg-slate-50 rounded-2xl font-black border-2 border-transparent focus:border-indigo-500 outline-none">
                                    <option value="4">4 خيارات (أ-د)</option>
                                    <option value="6">6 خيارات (أ-و)</option>
                                    <option value="12">12 خياراً (أ-ل)</option>
                                </select>
                            </div>
                        </div>

                        <div class="bg-slate-900 rounded-[32px] p-6">
                            <h4 class="text-white font-black mb-6">مفتاح الإجابة وتوزيع النقاط</h4>
                            <div id="key-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-4 max-h-[400px] overflow-y-auto custom-scroll pr-2"></div>
                        </div>

                        <button onclick="saveExam()" id="save-btn" class="w-full bg-indigo-600 text-white py-6 rounded-2xl font-black text-xl shadow-xl shadow-indigo-100 transition-all active:scale-95">حفظ الامتحان</button>
                    </div>
                </section>

                <!-- Tab: History -->
                <section id="view-history" class="hidden space-y-4 pb-20"></section>
            </div>
        </main>
    </div>

    <!-- Scanner Modal (PRO DESIGN) -->
    <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden overflow-hidden">
        <video id="video" class="w-full h-full object-cover opacity-60" playsinline muted></video>
        
        <!-- Targets -->
        <div id="f-tl" class="target-frame tf-tl"></div>
        <div id="f-tr" class="target-frame tf-tr"></div>
        <div id="f-bl" class="target-frame tf-bl"></div>
        <div id="f-br" class="target-frame tf-br"></div>

        <div class="absolute bottom-12 inset-x-0 flex flex-col items-center gap-6 z-[110]">
            <div id="status-msg" class="bg-black/80 backdrop-blur-xl border border-white/20 text-white px-8 py-4 rounded-3xl text-xs font-black tracking-widest uppercase transition-all">وجه الكاميرا داخل الإطارات...</div>
            <div class="flex gap-4">
                <button onclick="stopScanner()" class="w-16 h-16 bg-red-500/20 rounded-full border border-red-500 text-red-500 flex items-center justify-center text-xl backdrop-blur-md"><i class="fa-solid fa-x"></i></button>
            </div>
        </div>
        <canvas id="proc-canvas" class="hidden"></canvas>
    </div>

    <!-- Enhanced Result Popup -->
    <div id="res-popup" class="fixed inset-0 bg-slate-900/95 z-[200] hidden flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-white rounded-[40px] p-8 max-w-lg w-full text-center shadow-2xl">
            <h3 class="font-black text-2xl text-slate-800">نتيجة التصحيح</h3>
            <div id="res-score" class="text-6xl font-black text-indigo-600 my-4 italic">0 / 0</div>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-slate-50 p-3 rounded-2xl">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-2">اسم الطالب</p>
                    <img id="res-name-img" class="h-14 mx-auto rounded border bg-white">
                </div>
                <div class="bg-slate-50 p-3 rounded-2xl">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-2">صورة الورقة</p>
                    <button onclick="viewFullGraded()" class="h-14 w-full bg-white rounded border flex items-center justify-center text-indigo-600 text-xs font-bold"><i class="fa-solid fa-eye mr-2"></i> معاينة</button>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="closeResult()" class="flex-1 bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg transition-all active:scale-95">الاستمرار في المسح</button>
                <button onclick="switchTab('history'); document.getElementById('res-popup').classList.add('hidden');" class="bg-slate-100 text-slate-700 px-6 rounded-2xl font-bold"><i class="fa-solid fa-list"></i></button>
            </div>
        </div>
    </div>

    <!-- Sheet Preview Modal -->
    <div id="preview-modal" class="fixed inset-0 bg-black/80 z-[250] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-black">معاينة ورقة الإجابة</h3>
                <button onclick="document.getElementById('preview-modal').classList.add('hidden')" class="p-2 text-red-500"><i class="fa-solid fa-x"></i></button>
            </div>
            <div id="preview-container" class="flex-1 overflow-auto bg-slate-200 p-4 flex justify-center"></div>
            <div class="p-4 border-t flex gap-4">
                <button id="final-download-btn" class="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-bold">تحميل الآن (PNG)</button>
            </div>
        </div>
    </div>

    <div id="hidden-print-area" style="position:fixed; left:-9999px;"></div>

    <script>
        // --- Database & Global State ---
        let db = {
            exams: JSON.parse(localStorage.getItem('sm_pro_v8_exams') || '[]'),
            results: JSON.parse(localStorage.getItem('sm_pro_v8_results') || '[]')
        };
        let isCvReady = false, scanActive = false, activeExam = null, stableFrames = 0;
        const LETTERS = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي', 'ك', 'ل'];

        function onOpenCvReady() {
            isCvReady = true;
            document.getElementById('cv-status').innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500"></i> محرك الذكاء جاهز';
            document.getElementById('cv-status').className = "text-[10px] font-bold text-emerald-500 flex items-center gap-2";
        }

        function toggleSidebar(state) {
            document.getElementById('sidebar').classList.toggle('translate-x-full', !state);
            const overlay = document.getElementById('sidebar-overlay');
            overlay.style.opacity = state ? "1" : "0";
            overlay.style.pointerEvents = state ? "auto" : "none";
        }

        function switchTab(tab) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('view-' + tab).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.className = "w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-slate-400 hover:bg-slate-800 transition-all font-bold");
            document.getElementById('btn-' + tab).className = "w-full flex items-center gap-4 px-5 py-4 rounded-2xl bg-indigo-600 text-white font-bold";
            if(tab === 'exams') renderExams();
            if(tab === 'history') renderHistory();
            if(tab === 'create' && !document.getElementById('edit-id').value) updateKeyGrid();
            if(window.innerWidth < 768) toggleSidebar(false);
        }

        // --- Exam Creation & Weighting ---
        function updateKeyGrid() {
            const q = parseInt(document.getElementById('in-q').value) || 0, o = parseInt(document.getElementById('in-o').value);
            const grid = document.getElementById('key-container'); grid.innerHTML = '';
            for(let i=0; i<q; i++) {
                const row = document.createElement('div');
                row.className = "p-4 bg-slate-800 rounded-2xl flex items-center justify-between gap-3";
                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] font-black text-slate-500">س ${i+1}</span>
                        <input type="number" step="0.25" value="1" class="q-weight w-12 h-8 bg-slate-700 border-none rounded-lg text-white text-center text-xs font-bold" placeholder="نقط">
                    </div>
                    <div class="flex gap-1 overflow-x-auto no-scrollbar" id="q-row-${i}"></div>
                `;
                grid.appendChild(row);
                for(let j=0; j<o; j++) {
                    const b = document.createElement('div');
                    b.className = `bubble-btn opt-${i}`;
                    b.innerText = LETTERS[j];
                    b.onclick = function() { this.classList.toggle('selected'); };
                    row.querySelector(`#q-row-${i}`).appendChild(b);
                }
            }
        }

        function saveExam() {
            const name = document.getElementById('in-name').value;
            if(!name) return alert("المرجو إدخال اسم المادة");
            const qCount = parseInt(document.getElementById('in-q').value);
            const editId = document.getElementById('edit-id').value;
            
            let key = [];
            const weights = document.querySelectorAll('.q-weight');
            for(let i=0; i<qCount; i++) {
                let ans = [];
                document.querySelectorAll(`.opt-${i}`).forEach((b, idx) => { if(b.classList.contains('selected')) ans.push(idx); });
                key.push({ ans, weight: parseFloat(weights[i].value || 1) });
            }

            const examData = { 
                id: editId ? parseInt(editId) : Date.now(), 
                name, level: document.getElementById('in-level').value, 
                qCount, oCount: parseInt(document.getElementById('in-o').value), 
                key, date: new Date().toLocaleDateString('ar-MA') 
            };

            if(editId) {
                db.exams = db.exams.map(e => e.id === examData.id ? examData : e);
            } else {
                db.exams.push(examData);
            }

            localStorage.setItem('sm_pro_v8_exams', JSON.stringify(db.exams));
            document.getElementById('edit-id').value = '';
            switchTab('exams');
        }

        function editExam(id) {
            const ex = db.exams.find(e => e.id === id);
            switchTab('create');
            document.getElementById('edit-id').value = ex.id;
            document.getElementById('in-name').value = ex.name;
            document.getElementById('in-level').value = ex.level;
            document.getElementById('in-q').value = ex.qCount;
            document.getElementById('in-o').value = ex.oCount;
            updateKeyGrid();
            
            const rows = document.querySelectorAll('#key-container > div');
            ex.key.forEach((k, i) => {
                rows[i].querySelector('.q-weight').value = k.weight;
                k.ans.forEach(ansIdx => {
                    rows[i].querySelectorAll('.bubble-btn')[ansIdx].classList.add('selected');
                });
            });
            document.getElementById('save-btn').innerText = "تحديث التغييرات";
        }

        // --- SCANNER LOGIC (HIGH STABILITY VERSION) ---
        async function startScanner(id) {
            if(!isCvReady) return alert("انتظر تحميل المحرك...");
            activeExam = db.exams.find(e => e.id === id);
            scanActive = true; stableFrames = 0;
            document.getElementById('scanner-modal').classList.remove('hidden');
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', focusMode: 'continuous', width: {ideal: 1280} } });
            document.getElementById('video').srcObject = stream;
            document.getElementById('video').play();
            requestAnimationFrame(scanLoop);
        }

        function stopScanner() {
            scanActive = false;
            const stream = document.getElementById('video').srcObject;
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('scanner-modal').classList.add('hidden');
        }

        function scanLoop() {
            if(!scanActive) return;
            const video = document.getElementById('video');
            const canvas = document.getElementById('proc-canvas');
            const ctx = canvas.getContext('2d');

            if(video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 640; canvas.height = 480;
                ctx.drawImage(video, 0, 0, 640, 480);
                
                let src = cv.imread(canvas);
                let gray = new cv.Mat();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                cv.adaptiveThreshold(gray, gray, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(gray, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let anchors = [];
                for(let i=0; i<contours.size(); i++) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    if(area > 300 && area < 2500) {
                        let rect = cv.boundingRect(cnt);
                        let ratio = rect.width / rect.height;
                        if(ratio > 0.7 && ratio < 1.3) anchors.push(rect);
                    }
                }

                // --- Triple Validation Logic ---
                if(anchors.length >= 4) {
                    anchors.sort((a, b) => (b.width * b.height) - (a.width * a.height));
                    let pts = anchors.slice(0, 4).map(r => ({x: r.x + r.width/2, y: r.y + r.height/2}));
                    
                    // 1. Sort points
                    pts.sort((a, b) => a.y - b.y);
                    let top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
                    let bottom = pts.slice(2, 4).sort((a, b) => a.x - b.x);
                    let sorted = [top[0], top[1], bottom[0], bottom[1]];

                    // 2. Check Coverage (Area)
                    let width = top[1].x - top[0].x;
                    let height = bottom[0].y - top[0].y;
                    let sheetArea = width * height;

                    if(sheetArea > (640 * 480 * 0.25)) { // 25% of screen area
                        stableFrames++;
                        updateFramesUI(true);
                        if(stableFrames > 20) { // Stable for 20 frames
                            performCorrection(src, sorted);
                            scanActive = false;
                        } else {
                            requestAnimationFrame(scanLoop);
                        }
                    } else {
                        stableFrames = 0;
                        updateFramesUI(false);
                        requestAnimationFrame(scanLoop);
                    }
                } else {
                    stableFrames = 0;
                    updateFramesUI(false);
                    requestAnimationFrame(scanLoop);
                }

                src.delete(); gray.delete(); contours.delete(); hierarchy.delete();
            } else {
                requestAnimationFrame(scanLoop);
            }
        }

        function updateFramesUI(detected) {
            const msg = document.getElementById('status-msg');
            msg.innerText = detected ? "ثبت الكاميرا... جاري القراءة" : "وجه الكاميرا داخل الإطارات...";
            msg.className = detected ? "bg-emerald-600 text-white px-8 py-4 rounded-3xl text-xs font-black transition-all" : "bg-black/80 text-white px-8 py-4 rounded-3xl text-xs font-black transition-all";
            document.querySelectorAll('.target-frame').forEach(f => f.classList.toggle('detected', detected));
        }

        function performCorrection(src, pts) {
            let dstSize = new cv.Size(600, 800);
            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, 600, 0, 0, 800, 600, 800]);
            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [pts[0].x, pts[0].y, pts[1].x, pts[1].y, pts[2].x, pts[2].y, pts[3].x, pts[3].y]);
            
            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            let warped = new cv.Mat();
            cv.warpPerspective(src, warped, M, dstSize);

            // Capture Name Image
            let nameCanvas = document.createElement('canvas');
            let nameRoi = warped.roi(new cv.Rect(60, 110, 350, 60));
            cv.imshow(nameCanvas, nameRoi);

            // Analysis
            let gray = new cv.Mat();
            cv.cvtColor(warped, gray, cv.COLOR_RGBA2GRAY);
            cv.adaptiveThreshold(gray, gray, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 15, 5);

            let score = 0, maxScore = 0;
            const startY = 240, rowH = 22, colW = 30;

            activeExam.key.forEach((k, qIdx) => {
                let chosen = [];
                maxScore += k.weight;
                for(let oIdx = 0; oIdx < activeExam.oCount; oIdx++) {
                    let bx = 80 + (oIdx * colW), by = startY + (qIdx * rowH);
                    let roi = gray.roi(new cv.Rect(bx-8, by-8, 16, 16));
                    if(cv.countNonZero(roi) > 90) chosen.push(oIdx);
                    roi.delete();
                }

                const isCorrect = JSON.stringify(chosen) === JSON.stringify(k.ans);
                if(isCorrect) score += k.weight;

                // Visual Feedback on warped image
                k.ans.forEach(idx => {
                    cv.circle(warped, new cv.Point(80 + (idx * colW), startY + (qIdx * rowH)), 10, new cv.Scalar(0, 255, 0, 255), 2);
                });
                chosen.forEach(idx => {
                    if(!k.ans.includes(idx)) cv.circle(warped, new cv.Point(80 + (idx * colW), startY + (qIdx * rowH)), 10, new cv.Scalar(255, 0, 0, 255), 2);
                });
            });

            const fullGradedCanvas = document.createElement('canvas');
            cv.imshow(fullGradedCanvas, warped);

            const res = { 
                id: Date.now(), examName: activeExam.name, score, total: maxScore, 
                date: new Date().toLocaleString('ar-MA'), 
                nameImg: nameCanvas.toDataURL(),
                gradedImg: fullGradedCanvas.toDataURL()
            };
            db.results.push(res);
            localStorage.setItem('sm_pro_v8_results', JSON.stringify(db.results));

            document.getElementById('res-score').innerText = `${score} / ${maxScore}`;
            document.getElementById('res-name-img').src = res.nameImg;
            window.latestGradedImg = res.gradedImg;
            document.getElementById('res-popup').classList.remove('hidden');
            
            srcTri.delete(); dstTri.delete(); M.delete(); warped.delete(); gray.delete(); nameRoi.delete();
            stopScanner();
        }

        function viewFullGraded() {
            const win = window.open();
            win.document.write(`<img src="${window.latestGradedImg}" style="width:100%">`);
        }

        function closeResult() {
            document.getElementById('res-popup').classList.add('hidden');
            startScanner(activeExam.id); // Stay in scanning mode
        }

        // --- UI & Rendering ---
        function renderExams() {
            const container = document.getElementById('view-exams'); container.innerHTML = '';
            db.exams.forEach(ex => {
                const d = document.createElement('div');
                d.className = "bg-white p-6 rounded-[32px] border shadow-sm space-y-4";
                d.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center font-black">${ex.qCount}</div>
                        <div class="flex gap-2">
                            <button onclick="editExam(${ex.id})" class="text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteExam(${ex.id})" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div><h3 class="font-black text-slate-800">${ex.name}</h3><p class="text-[10px] text-slate-400 font-bold uppercase">${ex.level}</p></div>
                    <button onclick="startScanner(${ex.id})" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-indigo-100">بدء التصحيح</button>
                    <button onclick="previewSheet(${ex.id})" class="w-full bg-slate-50 text-slate-700 py-3 rounded-2xl font-bold text-xs">معاينة الورقة</button>
                `;
                container.appendChild(d);
            });
        }

        async function previewSheet(id) {
            const ex = db.exams.find(e => e.id === id);
            const container = document.getElementById('hidden-print-area');
            container.innerHTML = '';
            
            const page = document.createElement('div');
            page.className = 'sheet-page';
            page.innerHTML = `
                <div class="black-corner c-tl"></div><div class="black-corner c-tr"></div>
                <div class="black-corner c-bl"></div><div class="black-corner c-br"></div>
                <div style="margin:20mm 10mm 5mm 10mm; border-bottom:4px solid #000; padding-bottom:12px; display:flex; justify-content:space-between; align-items:end;">
                    <div><h1 style="font-size:28px; font-weight:900; margin:0;">${ex.name}</h1><p style="margin:5px 0 0 0; font-weight:900; font-size:14px; color:#666;">${ex.level}</p></div>
                    <div id="qr"></div>
                </div>
                <div style="margin:5mm 10mm 15mm 10mm; display:flex; gap:15px;">
                    <div style="flex:2; border:3px solid #000; padding:15px; font-weight:900;">الاسم الكامل: ................................................................</div>
                    <div style="flex:1; border:3px solid #000; padding:15px; font-weight:900;">القسم: ............</div>
                </div>
                <div id="bubbles-grid" style="margin:0 10mm; display:flex; flex-wrap:wrap; gap:40px;"></div>
            `;
            
            const grid = page.querySelector('#bubbles-grid');
            const itemsPerCol = 20;
            for(let c=0; c < Math.ceil(ex.qCount / itemsPerCol); c++) {
                const col = document.createElement('div');
                for(let i = c*itemsPerCol; i < Math.min((c+1)*itemsPerCol, ex.qCount); i++) {
                    const row = document.createElement('div');
                    row.style.cssText = "display:flex; gap:6px; align-items:center; margin-bottom:6px;";
                    let bubbles = '';
                    for(let j=0; j<ex.oCount; j++) bubbles += `<div style="width:18px; height:18px; border:2px solid #000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:bold;">${LETTERS[j]}</div>`;
                    row.innerHTML = `<div style="width:22px; font-size:11px; font-weight:900; border-left:3px solid #000; padding-left:4px;">${i+1}</div>${bubbles}`;
                    col.appendChild(row);
                }
                grid.appendChild(col);
            }
            container.appendChild(page);
            new QRCode(page.querySelector('#qr'), { text: `ID-${ex.id}`, width: 70, height: 70 });
            
            setTimeout(async () => {
                const canvas = await html2canvas(page, { scale: 2 });
                const previewImg = document.createElement('img');
                previewImg.src = canvas.toDataURL();
                previewImg.className = "max-w-full shadow-lg";
                document.getElementById('preview-container').innerHTML = '';
                document.getElementById('preview-container').appendChild(previewImg);
                document.getElementById('preview-modal').classList.remove('hidden');
                document.getElementById('final-download-btn').onclick = () => {
                    const link = document.createElement('a'); link.download = `${ex.name}.png`; link.href = canvas.toDataURL(); link.click();
                };
            }, 500);
        }

        function renderHistory() {
            const container = document.getElementById('view-history'); 
            container.innerHTML = '<h3 class="text-xl font-black mb-6">سجل التصحيح</h3>';
            db.results.slice().reverse().forEach(r => {
                const d = document.createElement('div');
                d.className = "bg-white p-4 rounded-2xl border flex justify-between items-center";
                d.innerHTML = `
                    <div class="flex items-center gap-4"><img src="${r.nameImg}" class="h-10 border rounded bg-slate-50">
                    <div><p class="font-bold text-sm text-slate-800">${r.examName}</p><p class="text-[9px] text-slate-400 font-bold uppercase">${r.date}</p></div></div>
                    <div class="text-2xl font-black text-indigo-600">${r.score} <span class="text-xs text-slate-300">/ ${r.total}</span></div>
                `;
                container.appendChild(d);
            });
        }

        function deleteExam(id) { if(confirm("حذف الامتحان؟")) { db.exams = db.exams.filter(e => e.id !== id); localStorage.setItem('sm_pro_v8_exams', JSON.stringify(db.exams)); renderExams(); } }

        window.onload = () => switchTab('exams');
    </script>
</body>
</html>
