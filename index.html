<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMark Ultimate Pro</title>
    
    <!-- CSS & Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Tajawal:wght@400;700;900&display=swap');
        
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --accent: #10b981;
            --dark: #0f172a;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f1f5f9;
            color: var(--dark);
        }

        /* Glassmorphism Classes */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .sidebar-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-item:hover {
            transform: translateX(-5px);
            background: rgba(99, 102, 241, 0.1);
        }

        /* Scanner Visualizer */
        .scanner-frame {
            position: absolute;
            inset: 0;
            border: 2px solid transparent;
            background: 
                linear-gradient(to right, var(--primary) 40px, transparent 40px) 0 0,
                linear-gradient(to bottom, var(--primary) 40px, transparent 40px) 0 0,
                linear-gradient(to left, var(--primary) 40px, transparent 40px) 100% 0,
                linear-gradient(to bottom, var(--primary) 40px, transparent 40px) 100% 0,
                linear-gradient(to right, var(--primary) 40px, transparent 40px) 0 100%,
                linear-gradient(to top, var(--primary) 40px, transparent 40px) 0 100%,
                linear-gradient(to left, var(--primary) 40px, transparent 40px) 100% 100%,
                linear-gradient(to top, var(--primary) 40px, transparent 40px) 100% 100%;
            background-repeat: no-repeat;
            background-size: 80px 80px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="antialiased">

    <!-- App Shell -->
    <div class="flex h-screen overflow-hidden">
        
        <!-- Modern Sidebar -->
        <aside class="w-72 glass border-l flex flex-col hidden md:flex">
            <div class="p-8 text-center">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-indigo-200 mb-4">
                    <i class="fas fa-graduation-cap text-white text-2xl"></i>
                </div>
                <h1 class="text-xl font-black tracking-tight">SMARTMARK <span class="text-indigo-600">PRO</span></h1>
            </div>

            <nav class="flex-1 px-4 space-y-2 mt-4">
                <a href="#" onclick="showSection('dashboard')" class="sidebar-item flex items-center gap-4 p-4 rounded-2xl font-bold text-slate-600 hover:text-indigo-600">
                    <i class="fas fa-columns text-lg"></i> الإحصائيات العامة
                </a>
                <a href="#" onclick="showSection('students')" class="sidebar-item flex items-center gap-4 p-4 rounded-2xl font-bold text-slate-600 hover:text-indigo-600">
                    <i class="fas fa-users text-lg"></i> إدارة الطلاب
                </a>
                <a href="#" onclick="showSection('exams')" class="sidebar-item flex items-center gap-4 p-4 rounded-2xl font-bold text-slate-600 hover:text-indigo-600">
                    <i class="fas fa-file-signature text-lg"></i> الامتحانات والنتائج
                </a>
            </nav>

            <div class="p-6">
                <div class="bg-indigo-600 rounded-3xl p-6 text-white shadow-xl">
                    <p class="text-xs opacity-80 mb-2">حالة المحرك</p>
                    <div class="flex items-center gap-2">
                        <div id="status-blob" class="w-3 h-3 bg-red-400 rounded-full animate-pulse"></div>
                        <span id="status-text" class="text-sm font-bold">جاري تحميل AI...</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto relative">
            
            <!-- Sections -->
            <div id="section-dashboard" class="p-8 space-y-8 animate-in fade-in duration-500">
                <header class="flex justify-between items-center">
                    <div>
                        <h2 class="text-3xl font-black">مرحباً بك، أيها المعلم 👋</h2>
                        <p class="text-slate-500">هذا ما يحدث في فصولك اليوم</p>
                    </div>
                </header>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="glass p-8 rounded-[2rem] shadow-sm">
                        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center mb-4"><i class="fas fa-file-alt"></i></div>
                        <p class="text-sm text-slate-500 font-bold">إجمالي الامتحانات</p>
                        <h3 class="text-3xl font-black mt-1" id="dash-exams-count">0</h3>
                    </div>
                    <div class="glass p-8 rounded-[2rem] shadow-sm">
                        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center mb-4"><i class="fas fa-user-graduate"></i></div>
                        <p class="text-sm text-slate-500 font-bold">الطلاب المسجلون</p>
                        <h3 class="text-3xl font-black mt-1" id="dash-students-count">0</h3>
                    </div>
                    <!-- المزيد من البطاقات هنا -->
                </div>
            </div>

            <!-- Student Management Section -->
            <div id="section-students" class="hidden p-8 animate-in slide-in-from-bottom-5">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-3xl font-black">إدارة الطلاب</h2>
                    <button onclick="openAddStudentModal()" class="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold shadow-lg shadow-indigo-200">
                        <i class="fas fa-plus ml-2"></i> إضافة طالب جديد
                    </button>
                </div>
                
                <div class="glass rounded-[2rem] overflow-hidden shadow-sm">
                    <table class="w-full text-right">
                        <thead class="bg-slate-50 border-b">
                            <tr>
                                <th class="p-6 text-slate-500">اسم الطالب</th>
                                <th class="p-6 text-slate-500">رقم التعريف</th>
                                <th class="p-6 text-slate-500">القسم</th>
                                <th class="p-6 text-slate-500">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="students-list">
                            <!-- القائمة تظهر برمجياً -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Scanner Overlay -->
            <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden">
                <div class="scanner-frame"></div>
                <video id="video-feed" class="w-full h-full object-cover" autoplay playsinline></video>
                <div class="absolute bottom-12 left-0 right-0 text-center">
                    <button onclick="closeScanner()" class="bg-white/20 backdrop-blur-xl text-white px-12 py-4 rounded-full font-bold">إيقاف المسح</button>
                </div>
            </div>

        </main>
    </div>

    <!-- Modals & Feedback UI (Popups) -->
    <div id="modal-bg" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] hidden flex items-center justify-center">
        <div id="modal-content" class="bg-white w-[500px] rounded-[3rem] p-10 shadow-2xl">
            <!-- المحتوى يتغير حسب الحاجة -->
        </div>
    </div>

    <!-- Scripts Logic -->
    <script>
        // 1. Database Setup (IndexedDB)
        const db = new Dexie("SmartMarkDB");
        db.version(1).stores({
            students: '++id, name, studentId, class',
            exams: '++id, title, date, qCount, key',
            results: '++id, examId, studentId, score'
        });

        // 2. State Management
        let currentSection = 'dashboard';

        // 3. UI Logic
        function showSection(name) {
            document.getElementById(`section-${currentSection}`).classList.add('hidden');
            document.getElementById(`section-${name}`).classList.remove('hidden');
            currentSection = name;
            loadData();
        }

        async function loadData() {
            // تحديث الإحصائيات من قاعدة البيانات
            const studentCount = await db.students.count();
            const examCount = await db.exams.count();
            document.getElementById('dash-students-count').innerText = studentCount;
            document.getElementById('dash-exams-count').innerText = examCount;

            if (currentSection === 'students') renderStudents();
        }

        async function renderStudents() {
            const students = await db.students.toArray();
            const list = document.getElementById('students-list');
            list.innerHTML = students.map(s => `
                <tr class="border-b hover:bg-slate-50 transition">
                    <td class="p-6 font-bold">${s.name}</td>
                    <td class="p-6 font-mono text-slate-500">${s.studentId}</td>
                    <td class="p-6">${s.class}</td>
                    <td class="p-6">
                        <button onclick="deleteStudent(${s.id})" class="text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        // 4. Camera & OpenCV Integration
        async function startScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            const video = document.getElementById('video-feed');
            
            // طلب الكاميرا الخلفية تحديداً
            const constraints = {
                video: { facingMode: { exact: "environment" } }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                // تراجع للكاميرا المتوفرة إذا لم تكن الخلفية موجودة (مثل الحاسوب)
                const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = fallbackStream;
            }
        }

        function closeScanner() {
            const video = document.getElementById('video-feed');
            const stream = video.srcObject;
            stream.getTracks().forEach(track => track.stop());
            document.getElementById('scanner-modal').classList.add('hidden');
        }

        // 5. Initialize
        window.onload = () => {
            loadData();
            // تفقد حالة OpenCV
            setTimeout(() => {
                if(typeof cv !== 'undefined') {
                    document.getElementById('status-blob').classList.replace('bg-red-400', 'bg-emerald-400');
                    document.getElementById('status-text').innerText = 'المحرك جاهز';
                }
            }, 3000);
        };

        // وظيفة إضافة طالب كمثال على استخدام DB
        async function addSampleStudent() {
            await db.students.add({
                name: "محمد علي",
                studentId: "2023001",
                class: "الثاني ثانوي"
            });
            loadData();
        }
    </script>
</body>
</html>
