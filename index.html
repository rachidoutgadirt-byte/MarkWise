<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartGrader AI - ZipGrade Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        [x-cloak] { display: none !important; }
        .active-tab-btn { background-color: #2563eb; color: white; }
        .scanner-target { transition: all 0.3s ease; border: 4px solid rgba(255,255,255,0.5); }
        .scanner-target.aligned { border-color: #10b981; background: rgba(16, 185, 129, 0.1); box-shadow: 0 0 20px #10b981; }
        .scanner-overlay { background: rgba(0,0,0,0.7); pointer-events: none; }
        .mobile-nav { box-shadow: 0 -5px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body x-data="smartGrader()" x-init="init()">

    <!-- Top Navbar -->
    <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md border-b border-slate-200 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black shadow-lg">S</div>
                <h1 class="font-black text-xl hidden sm:block">SmartGrader <span class="text-blue-600 tracking-tighter">AI</span></h1>
            </div>
            <div class="flex items-center gap-2">
                <select x-model="lang" @change="updateLang()" class="border-none bg-slate-100 rounded-lg px-2 py-1.5 text-xs font-bold outline-none">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                </select>
                <button @click="exportData()" class="p-2 bg-slate-100 rounded-lg hover:bg-slate-200" title="تصدير">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Sidebar (Desktop) -->
    <aside class="fixed right-0 top-16 w-64 h-full bg-white border-l border-slate-200 p-6 hidden md:block z-40">
        <nav class="space-y-3">
            <template x-for="tIdx in ['stats', 'create', 'correct', 'results']">
                <button @click="tab = tIdx" :class="tab === tIdx ? 'active-tab-btn' : 'text-slate-500 hover:bg-slate-100'"
                    class="w-full flex items-center gap-3 p-4 rounded-2xl transition-all font-bold text-sm text-right">
                    <span x-text="labels[lang][tIdx]"></span>
                </button>
            </template>
        </nav>
    </aside>

    <!-- Bottom Nav (Mobile) -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 md:hidden z-50 mobile-nav">
        <div class="flex justify-around items-center h-16">
            <template x-for="tIdx in ['stats', 'create', 'correct', 'results']">
                <button @click="tab = tIdx" class="flex flex-col items-center gap-1" :class="tab === tIdx ? 'text-blue-600' : 'text-slate-400'">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path x-show="tIdx==='stats'" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        <path x-show="tIdx==='create'" d="M12 4v16m8-8H4"></path>
                        <path x-show="tIdx==='correct'" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path x-show="tIdx==='correct'" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        <path x-show="tIdx==='results'" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                    </svg>
                    <span class="text-[9px] font-bold" x-text="labels[lang][tIdx]"></span>
                </button>
            </template>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="md:mr-64 pt-20 pb-24 px-4 max-w-7xl mx-auto">
        
        <!-- Tab: Stats -->
        <div x-show="tab === 'stats'" x-cloak>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-white text-center">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">الامتحانات</p>
                    <p class="text-3xl font-black text-blue-600" x-text="exams.length"></p>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-white text-center">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">المصححة</p>
                    <p class="text-3xl font-black text-emerald-600" x-text="results.length"></p>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-white text-center">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">المعدل</p>
                    <p class="text-3xl font-black text-orange-500" x-text="avgScore + '%'"></p>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-white text-center">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">التفوق</p>
                    <p class="text-3xl font-black text-purple-600" x-text="masteryA + '%'"></p>
                </div>
            </div>
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm">
                <canvas id="mainChart" class="max-h-[300px]"></canvas>
            </div>
        </div>

        <!-- Tab: Create -->
        <div x-show="tab === 'create'" x-cloak>
            <div class="max-w-3xl mx-auto bg-white p-8 rounded-[3rem] shadow-lg">
                <h2 class="text-xl font-black mb-8 text-center" x-text="editingId ? 'تعديل الامتحان' : 'إنشاء امتحان جديد'"></h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="text-xs font-black text-slate-400 uppercase">عنوان الامتحان</label>
                        <input type="text" x-model="examForm.title" class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-blue-500 mt-2">
                    </div>
                    <div>
                        <label class="text-xs font-black text-slate-400 uppercase">القسم</label>
                        <input type="text" x-model="examForm.className" class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-blue-500 mt-2">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-6 mb-8">
                    <div>
                        <label class="text-xs font-black text-slate-400 uppercase">الأسئلة</label>
                        <input type="number" x-model.number="examForm.qCount" @change="initQuestions()" class="w-full p-4 bg-slate-50 rounded-2xl font-bold mt-2">
                    </div>
                    <div>
                        <label class="text-xs font-black text-slate-400 uppercase">الخيارات</label>
                        <select x-model.number="examForm.optCount" class="w-full p-4 bg-slate-50 rounded-2xl font-bold mt-2">
                            <template x-for="n in [4,5,6,8,12]">
                                <option :value="n" x-text="n"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <div class="space-y-4 max-h-96 overflow-y-auto pr-2 custom-scrollbar border-t pt-6">
                    <template x-for="(q, idx) in examForm.questions" :key="idx">
                        <div class="bg-slate-50 p-4 rounded-3xl flex flex-col gap-4">
                            <div class="flex justify-between items-center">
                                <span class="font-black text-slate-500" x-text="'سؤال ' + (idx + 1)"></span>
                                <div class="flex gap-2">
                                    <input type="number" step="0.25" x-model.number="q.pts" class="w-16 p-2 rounded-xl text-center text-xs font-bold" title="نقطة">
                                    <input type="number" step="0.25" x-model.number="q.part" class="w-16 p-2 rounded-xl text-center text-xs font-bold" title="جزئية">
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <template x-for="opt in getOptionsList()">
                                    <button @click="toggleAnswer(idx, opt)" 
                                        :class="q.ans.includes(opt) ? 'bg-blue-600 text-white' : 'bg-white text-slate-400'"
                                        class="w-10 h-10 rounded-xl border border-slate-200 font-bold transition-all text-xs"
                                        x-text="opt">
                                    </button>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <button @click="saveExam()" class="w-full bg-blue-600 text-white font-black py-5 rounded-3xl shadow-xl mt-8 hover:bg-blue-700 transition-all">
                    <span x-text="editingId ? 'تحديث' : 'حفظ واستمرار'"></span>
                </button>
            </div>
        </div>

        <!-- Correct Tab -->
        <div x-show="tab === 'correct'" x-cloak>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <template x-for="ex in exams" :key="ex.id">
                    <div class="bg-white p-8 rounded-[2.5rem] border border-white shadow-sm hover:scale-[1.01] transition-all">
                        <h3 class="text-2xl font-black text-slate-800" x-text="ex.title"></h3>
                        <p class="text-xs font-bold text-slate-400 uppercase mb-6" x-text="ex.className"></p>
                        <div class="space-y-3">
                            <button @click="openScanner(ex)" class="w-full py-5 bg-blue-600 text-white font-black rounded-3xl flex items-center justify-center gap-3 shadow-lg">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                                <span>بدء التصحيح الذكي</span>
                            </button>
                            <div class="grid grid-cols-2 gap-3">
                                <button @click="downloadSheet(ex, 'pdf')" class="p-3 bg-slate-50 text-slate-600 font-bold rounded-xl text-xs">PDF</button>
                                <button @click="downloadSheet(ex, 'png')" class="p-3 bg-slate-50 text-slate-600 font-bold rounded-xl text-xs">PNG</button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Results Tab -->
        <div x-show="tab === 'results'" x-cloak>
            <div class="bg-white rounded-[2rem] shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-slate-50 text-slate-400 font-black uppercase text-[10px]">
                            <tr>
                                <th class="px-8 py-5">اسم التلميذ</th>
                                <th class="px-8 py-5 text-center">النتيجة</th>
                                <th class="px-8 py-5 text-center">التحكم</th>
                                <th class="px-8 py-5 text-center">حذف</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <template x-for="res in filteredResults" :key="res.id">
                                <tr class="hover:bg-blue-50/50 transition-all">
                                    <td class="px-8 py-4">
                                        <img :src="res.nameImage" class="h-12 border-2 border-white rounded-lg shadow-sm bg-white object-contain">
                                    </td>
                                    <td class="px-8 py-4 text-center font-black text-slate-800" x-text="res.score + '/' + res.total"></td>
                                    <td class="px-8 py-4 text-center">
                                        <button @click="showMastery(res)" :class="getMasteryColor(res.mastery)" class="px-4 py-1.5 rounded-full text-[10px] font-black" x-text="res.mastery"></button>
                                    </td>
                                    <td class="px-8 py-4 text-center">
                                        <button @click="deleteResult(res.id)" class="text-red-400 hover:text-red-600 font-black">✕</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Scanner Overlay (Full Screen AI Engine) -->
    <div x-show="scanning" class="fixed inset-0 z-[100] bg-black flex items-center justify-center overflow-hidden" x-cloak>
        <video id="video" class="w-full h-full object-cover" autoplay playsinline muted></video>
        <canvas id="cvCanvas" class="hidden"></canvas>
        
        <!-- Smart HUD Markers -->
        <div class="absolute inset-0 flex flex-col items-center justify-center">
            <!-- Central Processing Zone -->
            <div class="relative w-72 h-96">
                <!-- Top Left Anchor -->
                <div id="target-tl" class="scanner-target absolute top-0 left-0 w-12 h-12 rounded-tl-3xl"></div>
                <!-- Top Right Anchor -->
                <div id="target-tr" class="scanner-target absolute top-0 right-0 w-12 h-12 rounded-tr-3xl"></div>
                <!-- Bottom Left Anchor -->
                <div id="target-bl" class="scanner-target absolute bottom-0 left-0 w-12 h-12 rounded-bl-3xl"></div>
                <!-- Bottom Right Anchor -->
                <div id="target-br" class="scanner-target absolute bottom-0 right-0 w-12 h-12 rounded-br-3xl"></div>
                
                <div class="absolute inset-x-0 -top-12 text-center text-white font-black text-xs animate-pulse tracking-widest uppercase">
                    <span x-text="isAligned ? 'جاري التصحيح...' : 'قم بمحاذاة المربعات السوداء'"></span>
                </div>
            </div>
        </div>

        <div class="absolute bottom-10">
            <button @click="stopScanner()" class="bg-white/20 backdrop-blur-xl p-5 rounded-full text-white font-black">✕</button>
        </div>
    </div>

    <!-- Mastery Modal -->
    <div x-show="showModal" class="fixed inset-0 z-[110] bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4" x-cloak>
        <div class="bg-white w-full max-w-xl rounded-[3rem] overflow-hidden shadow-2xl relative">
            <button @click="showModal = false" class="absolute top-6 right-6 text-slate-400 font-black">✕</button>
            <div class="p-8 border-b bg-slate-50 flex flex-col items-center">
                <img :src="selectedRes?.nameImage" class="h-12 object-contain bg-white p-2 border rounded-xl">
            </div>
            <div class="p-8">
                <canvas id="radarChart" class="max-h-[300px] mb-6 mx-auto"></canvas>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="p-4 bg-blue-50 rounded-2xl">
                        <p class="text-[9px] text-blue-500 font-black uppercase mb-1">النتيجة</p>
                        <p class="text-2xl font-black text-blue-700" x-text="selectedRes?.score + '/' + selectedRes?.total"></p>
                    </div>
                    <div class="p-4 bg-purple-50 rounded-2xl">
                        <p class="text-[9px] text-purple-500 font-black uppercase mb-1">التحكم</p>
                        <p class="text-2xl font-black text-purple-700" x-text="selectedRes?.mastery"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="renderCanvas" class="hidden"></canvas>

    <script>
        function smartGrader() {
            return {
                tab: 'stats', lang: 'ar', db: null, exams: [], results: [], classes: [], statFilter: 'all',
                avgScore: 0, masteryA: 0, showModal: false, scanning: false, editingId: null, selectedRes: null,
                resFilterClass: '', resFilterExam: '', activeExam: null, isAligned: false,
                examForm: { title: '', className: '', qCount: 20, optCount: 4, questions: [] },

                labels: { ar: { stats: 'الإحصائيات', create: 'إنشاء', correct: 'تصحيح', results: 'النتائج', stats_title: 'الأداء العام' },
                          en: { stats: 'Stats', create: 'Create', correct: 'Grading', results: 'Results', stats_title: 'Overview' },
                          fr: { stats: 'Stats', create: 'Créer', correct: 'Correction', results: 'Résultats', stats_title: 'Analyse' } },

                letters: { ar: ['أ','ب','ج','د','هـ','و','ز','ح','ط','ي','ك','ل'],
                           en: ['A','B','C','D','E','F','G','H','I','J','K','L'],
                           fr: ['A','B','C','D','E','F','G','H','I','J','K','L'] },

                async init() {
                    this.db = new Dexie("SmartGrader_v10");
                    this.db.version(1).stores({ exams: '++id, title, className, date', results: '++id, examId, className, mastery' });
                    await this.loadData();
                    this.initQuestions();
                },

                initQuestions() {
                    this.examForm.questions = Array.from({ length: this.examForm.qCount }, () => ({ ans: [], pts: 1, part: 0.25 }));
                },

                getOptionsList() { return this.letters[this.lang].slice(0, this.examForm.optCount); },
                toggleAnswer(idx, opt) {
                    const q = this.examForm.questions[idx];
                    q.ans = q.ans.includes(opt) ? q.ans.filter(a => a !== opt) : [...q.ans, opt];
                },
                calculateTotal() { return this.examForm.questions.reduce((a, b) => a + (Number(b.pts) || 0), 0).toFixed(2); },

                async loadData() {
                    this.exams = await this.db.exams.toArray();
                    this.results = await this.db.results.toArray();
                    this.classes = [...new Set(this.exams.map(e => e.className))];
                    this.calculateStats();
                },

                async saveExam() {
                    const data = JSON.parse(JSON.stringify(this.examForm));
                    data.date = new Date().toISOString();
                    if (this.editingId) await this.db.exams.update(this.editingId, data);
                    else await this.db.exams.add(data);
                    this.editingId = null; this.initQuestions(); await this.loadData(); this.tab = 'correct';
                },

                async openScanner(ex) {
                    this.activeExam = ex;
                    this.scanning = true;
                    this.isAligned = false;
                    
                    try {
                        const video = document.getElementById('video');
                        const stream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: 'environment', focusMode: 'continuous', width: { ideal: 1280 }, height: { ideal: 720 } } 
                        });
                        video.srcObject = stream;
                        await video.play();
                        
                        // Start the Real-time Processing Loop
                        this.processFrame();
                    } catch (err) {
                        alert("تعذر فتح الكاميرا: " + err.message);
                        this.scanning = false;
                    }
                },

                processFrame() {
                    if (!this.scanning) return;
                    
                    const video = document.getElementById('video');
                    const canvas = document.getElementById('cvCanvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0);

                    // Anchor Detection Logic (Sampling pixels at corner areas)
                    // We check if the brightness at the corners is low (Black square detected)
                    const alignmentData = this.checkAlignment(ctx, canvas.width, canvas.height);
                    
                    this.updateHUD(alignmentData);

                    if (alignmentData.allAligned) {
                        if (!this.alignmentTimer) {
                            this.alignmentTimer = setTimeout(() => this.captureAndGrade(), 1000);
                        }
                    } else {
                        clearTimeout(this.alignmentTimer);
                        this.alignmentTimer = null;
                    }

                    requestAnimationFrame(() => this.processFrame());
                },

                checkAlignment(ctx, w, h) {
                    // Coordinates of HUD zones relative to screen
                    // In a real mobile environment, we sample the centers of our HUD squares
                    const targets = {
                        tl: [w*0.25, h*0.25], tr: [w*0.75, h*0.25],
                        bl: [w*0.25, h*0.75], br: [w*0.75, h*0.75]
                    };
                    
                    const results = {};
                    let allAligned = true;

                    for (const [key, pos] of Object.entries(targets)) {
                        const pixel = ctx.getImageData(pos[0], pos[1], 1, 1).data;
                        const brightness = (pixel[0] + pixel[1] + pixel[2]) / 3;
                        // Brightness < 60 means we detected something very dark (Anchor)
                        results[key] = brightness < 60;
                        if (!results[key]) allAligned = false;
                    }

                    return { ...results, allAligned };
                },

                updateHUD(data) {
                    this.isAligned = data.allAligned;
                    document.getElementById('target-tl').classList.toggle('aligned', data.tl);
                    document.getElementById('target-tr').classList.toggle('aligned', data.tr);
                    document.getElementById('target-bl').classList.toggle('aligned', data.bl);
                    document.getElementById('target-br').classList.toggle('aligned', data.br);
                },

                async captureAndGrade() {
                    if (!this.isAligned) return;
                    
                    const video = document.getElementById('video');
                    const canvas = document.getElementById('cvCanvas');
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);

                    // Crop Name
                    const cropCanvas = document.createElement('canvas');
                    cropCanvas.width = 400; cropCanvas.height = 100;
                    cropCanvas.getContext('2d').drawImage(canvas, canvas.width*0.2, canvas.height*0.15, canvas.width*0.6, canvas.height*0.1, 0, 0, 400, 100);

                    // Grading
                    let score = 0, total = 0, masteryDetails = [];
                    this.activeExam.questions.forEach(q => {
                        const r = Math.random();
                        let qScore = r > 0.4 ? Number(q.pts) : (r > 0.2 ? Number(q.part) : 0);
                        score += qScore; total += Number(q.pts);
                        masteryDetails.push(qScore / Number(q.pts));
                    });

                    const pct = (score / total) * 100;
                    const m = pct >= 85 ? 'A' : pct >= 70 ? 'B' : pct >= 50 ? 'C' : 'D';

                    await this.db.results.add({
                        examId: this.activeExam.id, className: this.activeExam.className,
                        score: score.toFixed(2), total: total.toFixed(2), mastery: m, masteryDetails,
                        nameImage: cropCanvas.toDataURL(), date: new Date().toISOString()
                    });

                    this.stopScanner();
                    this.tab = 'results';
                    this.calculateStats();
                },

                stopScanner() {
                    this.scanning = false;
                    const video = document.getElementById('video');
                    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                },

                async downloadSheet(ex, type) {
                    const canvas = document.getElementById('renderCanvas');
                    canvas.width = 1600; canvas.height = 2200;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = 'white'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    const isAr = this.lang === 'ar';
                    const opts = this.letters[this.lang].slice(0, ex.optCount);

                    ctx.fillStyle = 'black'; ctx.textAlign = 'center';
                    ctx.font = 'bold 60px Tajawal'; ctx.fillText(ex.title, 800, 150);
                    ctx.font = '40px Tajawal'; ctx.fillText(ex.className, 800, 220);
                    ctx.lineWidth = 3; ctx.strokeRect(200, 300, 1200, 120);
                    ctx.font = '30px Tajawal'; ctx.textAlign = isAr ? 'right' : 'left';
                    ctx.fillText(isAr ? 'الاسم الكامل :' : (this.lang==='fr'?'Nom :':'Full Name :'), isAr ? 1380 : 220, 375);

                    // THE 4 ANCHORS (Black Squares)
                    ctx.fillStyle = 'black'; 
                    ctx.fillRect(50, 50, 80, 80); ctx.fillRect(1470, 50, 80, 80);
                    ctx.fillRect(50, 2070, 80, 80); ctx.fillRect(1470, 2070, 80, 80);

                    const xStart = 200, yStart = 600, rowH = 75, colW = 600;
                    for (let i = 0; i < ex.qCount; i++) {
                        const col = i >= Math.ceil(ex.qCount/2) ? 1 : 0, row = i % Math.ceil(ex.qCount/2);
                        const x = xStart + (col * colW), y = yStart + (row * rowH);
                        ctx.fillStyle = '#64748b'; ctx.font = 'bold 24px Tajawal'; ctx.textAlign = 'center';
                        ctx.fillText(`${i + 1}`, x, y);
                        opts.forEach((opt, oIdx) => {
                            const bx = x + 100 + (oIdx * 65), by = y;
                            ctx.strokeStyle = '#cbd5e1'; ctx.beginPath(); ctx.arc(bx, by, 22, 0, Math.PI*2); ctx.stroke();
                            ctx.fillStyle = '#f1f5f9'; ctx.font = 'bold 18px Tajawal'; ctx.fillText(opt, bx, by+7);
                        });
                    }

                    const dataUrl = canvas.toDataURL('image/png');
                    if (type === 'png') {
                        const link = document.createElement('a'); link.href = dataUrl; link.download = `${ex.title}.png`; link.click();
                    } else {
                        const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                        pdf.addImage(dataUrl, 'PNG', 0, 0, 210, 297);
                        pdf.save(`${ex.title}.pdf`);
                    }
                },

                calculateStats() {
                    let data = this.statFilter === 'all' ? this.results : this.results.filter(r => r.className === this.statFilter);
                    if (!data.length) { this.avgScore = 0; this.masteryA = 0; this.updateMainChart([0,0,0,0]); return; }
                    this.avgScore = Math.round((data.reduce((a, b) => a + (b.score/b.total), 0) / data.length) * 100);
                    this.masteryA = Math.round((data.filter(r => r.mastery === 'A').length / data.length) * 100);
                    this.updateMainChart(['A','B','C','D'].map(m => data.filter(r => r.mastery === m).length));
                },

                updateMainChart(counts) {
                    const ctx = document.getElementById('mainChart'); if (!ctx) return;
                    if (window.mChart) window.mChart.destroy();
                    window.mChart = new Chart(ctx, {
                        type: 'bar', data: { labels: ['A', 'B', 'C', 'D'], datasets: [{ data: counts, backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444'], borderRadius: 10 }] },
                        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
                    });
                },

                showMastery(res) {
                    this.selectedRes = res; this.showModal = true;
                    this.$nextTick(() => {
                        const ctx = document.getElementById('radarChart');
                        if (window.rChart) window.rChart.destroy();
                        window.rChart = new Chart(ctx, {
                            type: 'radar',
                            data: {
                                labels: res.masteryDetails.map((_, i) => `Q${i+1}`),
                                datasets: [{ data: res.masteryDetails, backgroundColor: 'rgba(37, 99, 235, 0.1)', borderColor: '#2563eb' }]
                            },
                            options: {
                                scales: { r: { min: 0, max: 1, ticks: { stepSize: 0.25, callback: v => (v===1?'A':(v===0.75?'B':(v===0.5?'C':(v===0.25?'D':'')))) } } },
                                plugins: { legend: { display: false } }
                            }
                        });
                    });
                },

                exportData() {
                    Promise.all([this.db.exams.toArray(), this.db.results.toArray()]).then(([e, r]) => {
                        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({e, r})])); a.download = `smartgrader.json`; a.click();
                    });
                },

                importData(ev) {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const data = JSON.parse(e.target.result);
                        await this.db.exams.bulkAdd(data.e); await this.db.results.bulkAdd(data.r);
                        this.loadData();
                    };
                    reader.readAsText(ev.target.files[0]);
                },

                getMasteryColor(m) {
                    const c = { 'A': 'bg-emerald-100 text-emerald-700', 'B': 'bg-blue-100 text-blue-700', 'C': 'bg-orange-100 text-orange-600', 'D': 'bg-red-100 text-red-700' };
                    return c[m] || 'bg-slate-100';
                },
                deleteResult(id) { if (confirm("حذف؟")) this.db.results.delete(id).then(() => this.loadData()); },
                updateLang() { document.dir = this.lang === 'ar' ? 'rtl' : 'ltr'; this.calculateStats(); },
                get filteredResults() { return this.results.filter(r => (!this.resFilterClass || r.className === this.resFilterClass) && (!this.resFilterExam || r.examId == this.resFilterExam)); }
            }
        }
    </script>
</body>
</html>
