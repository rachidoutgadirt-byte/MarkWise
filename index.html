<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartMark Pro V2.2 | المصحح الذكي المتجاوب</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; overflow: hidden; touch-action: manipulation; }
        
        /* Sidebar Transitions */
        .sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-overlay { transition: opacity 0.3s ease; pointer-events: none; opacity: 0; }
        .sidebar-overlay.active { pointer-events: auto; opacity: 1; }

        /* A4 Sheet Preview */
        .a4-container { width: 210mm; min-height: 297mm; padding: 10mm; background: white; margin: auto; position: relative; box-sizing: border-box; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .sheet-header-row { display: flex; gap: 4px; margin-bottom: 2px; justify-content: center; }
        .letter-label { width: 20px; text-align: center; font-size: 9px; font-weight: 900; }
        .q-row { display: flex; gap: 4px; align-items: center; margin-bottom: 5px; justify-content: center; }
        .q-num { width: 22px; font-size: 10px; font-weight: bold; border-left: 1.5px solid #000; padding-left: 3px; }
        .bubble { width: 18px; height: 18px; border: 1.2px solid #000; border-radius: 50%; }

        /* Scanner */
        .scanner-viewfinder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85vw; height: 60vh; border: 3px dashed rgba(255,255,255,0.4); border-radius: 20px; pointer-events: none; }
        .scanner-viewfinder.active { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        
        .nav-active { background: #4f46e5; color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" onclick="toggleSidebar(false)" class="sidebar-overlay fixed inset-0 bg-slate-900/60 z-40 md:hidden"></div>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar fixed md:relative inset-y-0 right-0 w-72 bg-slate-900 text-white flex flex-col z-50 transform translate-x-full md:translate-x-0">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-black text-indigo-400">SmartMark</h1>
                    <p class="text-[10px] text-slate-500 uppercase">النسخة الاحترافية</p>
                </div>
                <button onclick="toggleSidebar(false)" class="md:hidden text-slate-400 p-2"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            
            <nav class="flex-1 p-4 space-y-2 mt-4">
                <button onclick="switchTab('exams')" id="nav-exams" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all nav-active">
                    <i class="fa-solid fa-folder-tree w-5"></i> إدارة الامتحانات
                </button>
                <button onclick="switchTab('create')" id="nav-create" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all text-slate-400 hover:bg-slate-800">
                    <i class="fa-solid fa-plus-circle w-5"></i> إنشاء امتحان
                </button>
                <button onclick="switchTab('history')" id="nav-history" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all text-slate-400 hover:bg-slate-800">
                    <i class="fa-solid fa-clipboard-list w-5"></i> السجل والنتائج
                </button>
            </nav>

            <div class="p-6 m-4 bg-slate-800/50 rounded-2xl border border-slate-700/50 text-center">
                <div id="cv-status" class="text-xs font-bold text-red-400 flex items-center justify-center gap-2">
                    <span class="w-2 h-2 bg-red-400 rounded-full animate-pulse"></span> جاري تحميل المحرك...
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-white">
            <header class="h-16 border-b px-4 md:px-8 flex items-center justify-between bg-white/80 backdrop-blur-md sticky top-0 z-30">
                <button onclick="toggleSidebar(true)" class="md:hidden p-2 text-slate-600 bg-slate-100 rounded-xl">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
                <h2 id="header-title" class="text-lg font-black text-slate-800">الامتحانات</h2>
                <div class="w-10 h-10 bg-indigo-50 rounded-full border border-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-sm">أ</div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8">
                <!-- Tab: Exams -->
                <section id="tab-exams" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></section>

                <!-- Tab: Create -->
                <section id="tab-create" class="hidden max-w-4xl mx-auto space-y-6 pb-20">
                    <div class="bg-white p-6 md:p-10 rounded-[32px] border border-slate-200 shadow-sm">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div class="space-y-2">
                                <label class="text-xs font-black text-slate-400 uppercase pr-2">اسم المادة</label>
                                <input type="text" id="ex-name" placeholder="مثلاً: فيزياء" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-black text-slate-400 uppercase pr-2">المستوى</label>
                                <input type="text" id="ex-level" placeholder="مثلاً: ثانية باك" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-8">
                            <div class="space-y-2">
                                <label class="text-xs font-black text-slate-400 uppercase pr-2">عدد الأسئلة</label>
                                <input type="number" id="ex-q" value="20" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-indigo-500 outline-none">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-black text-slate-400 uppercase pr-2">الخيارات</label>
                                <select id="ex-o" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-indigo-500 outline-none">
                                    <option value="4">4 خيارات</option>
                                    <option value="6">6 خيارات</option>
                                    <option value="12">12 خياراً</option>
                                </select>
                            </div>
                        </div>
                        <div class="bg-slate-900 rounded-3xl p-6 text-white mb-8">
                            <h4 class="font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-key text-indigo-400"></i> تحديد الإجابات الصحيحة</h4>
                            <div id="key-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 max-h-[400px] overflow-y-auto p-2"></div>
                        </div>
                        <button onclick="saveExam()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all">حفظ الامتحان</button>
                    </div>
                </section>

                <!-- Tab: History -->
                <section id="tab-history" class="hidden space-y-4"></section>
            </div>
        </main>
    </div>

    <!-- Scanner Interface -->
    <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden">
        <video id="video" class="w-full h-full object-cover" playsinline></video>
        <div class="scanner-viewfinder" id="viewfinder"></div>
        <div class="absolute top-8 inset-x-0 flex justify-center">
            <span class="bg-black/50 backdrop-blur-md text-white px-6 py-2 rounded-full text-xs font-bold border border-white/20">وجه الكاميرا نحو المربعات الأربعة</span>
        </div>
        <button onclick="stopScanner()" class="absolute bottom-10 left-1/2 -translate-x-1/2 bg-white/10 hover:bg-red-500 text-white w-16 h-16 rounded-full backdrop-blur-xl border border-white/20 transition-all flex items-center justify-center text-xl">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <canvas id="proc-canvas" class="hidden"></canvas>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="fixed inset-0 bg-slate-900/90 z-[200] hidden flex items-center justify-center p-2 md:p-4">
        <div class="bg-white rounded-[32px] max-w-5xl w-full max-h-[95vh] overflow-hidden flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-bold">معاينة ورقة الإجابة</h3>
                <button onclick="document.getElementById('preview-modal').classList.add('hidden')" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold">&times;</button>
            </div>
            <div id="preview-content" class="flex-1 overflow-auto bg-slate-200 p-2 md:p-8"></div>
            <div class="p-4 border-t flex flex-wrap gap-2">
                <button id="down-png" class="flex-1 min-w-[120px] bg-emerald-500 text-white py-4 rounded-xl font-black">تحميل PNG</button>
                <button id="down-pdf" class="flex-1 min-w-[120px] bg-red-500 text-white py-4 rounded-xl font-black">تحميل PDF</button>
                <button onclick="document.getElementById('preview-modal').classList.add('hidden')" class="w-full md:w-auto px-8 py-4 bg-slate-100 rounded-xl font-bold">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        let db = { 
            exams: JSON.parse(localStorage.getItem('sm_v4_exams') || '[]'), 
            results: JSON.parse(localStorage.getItem('sm_v4_results') || '[]') 
        };
        let isCvReady = false, activeExamId = null, scanActive = false;
        const LETTERS = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي', 'ك', 'ل'];

        function onOpenCvReady() {
            isCvReady = true;
            const status = document.getElementById('cv-status');
            status.innerHTML = '<span class="w-2 h-2 bg-emerald-500 rounded-full"></span> المحرك جاهز للعمل';
            status.className = "text-xs font-bold text-emerald-500 flex items-center justify-center gap-2";
        }

        // --- Responsive Sidebar Logic ---
        function toggleSidebar(state) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (state) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.add('active');
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.remove('active');
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            
            // Update Navigation UI
            document.querySelectorAll('nav button').forEach(b => {
                b.classList.remove('nav-active');
                b.classList.add('text-slate-400', 'hover:bg-slate-800');
            });
            document.getElementById('nav-' + tab).classList.add('nav-active');
            document.getElementById('nav-' + tab).classList.remove('text-slate-400', 'hover:bg-slate-800');
            
            // Close Sidebar on Mobile after selection
            if (window.innerWidth < 768) toggleSidebar(false);

            if(tab === 'exams') renderExams();
            if(tab === 'history') renderHistory();
            if(tab === 'create') updateKeyGrid();
            
            document.getElementById('header-title').innerText = document.getElementById('nav-' + tab).innerText;
        }

        // --- Core Functions (Exams/Scanning/History) ---
        function updateKeyGrid() {
            const q = parseInt(document.getElementById('ex-q').value), o = parseInt(document.getElementById('ex-o').value);
            const grid = document.getElementById('key-grid'); grid.innerHTML = '';
            for(let i=0; i<q; i++) {
                const div = document.createElement('div');
                div.className = "p-3 bg-slate-800 rounded-xl text-white border border-slate-700";
                div.innerHTML = `<div class="text-[10px] text-slate-500 mb-1">سؤال ${i+1}</div><div class="flex flex-wrap gap-1.5" id="row-${i}"></div>`;
                grid.appendChild(div);
                for(let j=0; j<o; j++) {
                    const b = document.createElement('button');
                    b.className = `w-7 h-7 rounded-full border border-slate-600 text-[10px] opt-${i} transition-all`;
                    b.innerText = LETTERS[j];
                    b.onclick = () => b.classList.toggle('bg-indigo-500');
                    div.querySelector(`#row-${i}`).appendChild(b);
                }
            }
        }
        document.getElementById('ex-q').onchange = updateKeyGrid;
        document.getElementById('ex-o').onchange = updateKeyGrid;

        function saveExam() {
            const name = document.getElementById('ex-name').value, level = document.getElementById('ex-level').value;
            if(!name || !level) return alert("المرجو ملأ جميع الحقول");
            const qCount = parseInt(document.getElementById('ex-q').value), oCount = parseInt(document.getElementById('ex-o').value);
            let key = [];
            for(let i=0; i<qCount; i++) {
                let ans = [];
                document.querySelectorAll(`.opt-${i}`).forEach((b, idx) => { if(b.classList.contains('bg-indigo-500')) ans.push(idx); });
                key.push(ans);
            }
            db.exams.push({ id: Date.now(), name, level, qCount, oCount, key, date: new Date().toLocaleDateString('ar-MA') });
            localStorage.setItem('sm_v4_exams', JSON.stringify(db.exams));
            switchTab('exams');
        }

        function renderExams() {
            const container = document.getElementById('tab-exams'); container.innerHTML = '';
            if(db.exams.length === 0) container.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400">لا توجد امتحانات، ابدأ بإنشاء واحد.</div>`;
            db.exams.forEach(ex => {
                const div = document.createElement('div');
                div.className = "bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm hover:shadow-md transition-all";
                div.innerHTML = `
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center font-black">${ex.qCount}</div>
                        <div><h3 class="font-black text-slate-800">${ex.name}</h3><p class="text-[10px] text-slate-400 font-bold uppercase">${ex.level}</p></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="startScanner(${ex.id})" class="col-span-2 bg-slate-900 text-white py-4 rounded-2xl font-black text-sm"><i class="fa-solid fa-camera mr-2"></i> بدء التصحيح</button>
                        <button onclick="previewSheet(${ex.id})" class="bg-indigo-50 text-indigo-600 py-3 rounded-2xl text-xs font-black">معاينة</button>
                        <button onclick="deleteExam(${ex.id})" class="bg-red-50 text-red-500 py-3 rounded-2xl text-xs font-black">حذف</button>
                    </div>`;
                container.appendChild(div);
            });
        }

        function deleteExam(id) {
            if(confirm("حذف الامتحان والنتائج؟")) {
                db.exams = db.exams.filter(e => e.id !== id);
                db.results = db.results.filter(r => r.examId !== id);
                localStorage.setItem('sm_v4_exams', JSON.stringify(db.exams));
                localStorage.setItem('sm_v4_results', JSON.stringify(db.results));
                renderExams();
            }
        }

        // --- Sheet & Scanner Logic ---
        function previewSheet(id) {
            const ex = db.exams.find(e => e.id === id);
            const container = document.getElementById('preview-content');
            container.innerHTML = '';
            
            const sheet = document.createElement('div');
            sheet.className = 'a4-container';
            sheet.id = 'printable-sheet';
            sheet.innerHTML = `
                <div style="position:absolute; top:8mm; left:8mm; width:12mm; height:12mm; background:#000; border-radius:2px;"></div>
                <div style="position:absolute; top:8mm; right:8mm; width:12mm; height:12mm; background:#000; border-radius:2px;"></div>
                <div style="position:absolute; bottom:8mm; left:8mm; width:12mm; height:12mm; background:#000; border-radius:2px;"></div>
                <div style="position:absolute; bottom:8mm; right:8mm; width:12mm; height:12mm; background:#000; border-radius:2px;"></div>
                
                <div style="margin: 18mm 10mm 10mm 10mm; border-bottom: 3px solid #000; padding-bottom:10px; display:flex; justify-content:space-between; align-items:end;">
                    <div><h1 style="margin:0; font-size:24px; font-weight:900;">${ex.name}</h1><p style="margin:0; font-weight:bold;">المستوى: ${ex.level}</p></div>
                    <div id="qr-code"></div>
                </div>

                <div style="margin: 0 10mm 15mm 10mm; display:flex; gap:10px;">
                    <div style="flex:2; border:2px solid #000; padding:12px; font-weight:900;">اسم التلميذ: ................................................................</div>
                    <div style="flex:1; border:2px solid #000; padding:12px; font-weight:900;">القسم: ..........</div>
                </div>
            `;
            
            const grid = document.createElement('div');
            grid.style.cssText = "display:flex; flex-wrap:wrap; gap:30px; padding: 0 10mm;";
            
            const perCol = 20;
            const colCount = Math.ceil(ex.qCount / perCol);
            for(let c=0; c < colCount; c++) {
                const col = document.createElement('div');
                col.style.flex = "1";
                for(let i = c*perCol; i < Math.min((c+1)*perCol, ex.qCount); i++) {
                    if(i % 10 === 0) {
                        const h = document.createElement('div'); h.className = 'sheet-header-row';
                        h.innerHTML = `<div style="width:22px"></div>` + LETTERS.slice(0, ex.oCount).map(l => `<div class="letter-label">${l}</div>`).join('');
                        col.appendChild(h);
                    }
                    const row = document.createElement('div'); row.className = 'q-row';
                    row.innerHTML = `<div class="q-num">${i+1}</div>` + `<div class="bubble"></div>`.repeat(ex.oCount);
                    col.appendChild(row);
                }
                grid.appendChild(col);
            }
            sheet.appendChild(grid);
            container.appendChild(sheet);
            
            new QRCode(sheet.querySelector('#qr-code'), { text: `EX-${ex.id}`, width: 60, height: 60 });
            document.getElementById('preview-modal').classList.remove('hidden');

            document.getElementById('down-png').onclick = async () => {
                const canvas = await html2canvas(sheet, { scale: 3 });
                const link = document.createElement('a'); link.download = `${ex.name}.png`; link.href = canvas.toDataURL(); link.click();
            };
            document.getElementById('down-pdf').onclick = async () => {
                const canvas = await html2canvas(sheet, { scale: 3 });
                const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                pdf.addImage(canvas.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, 210, 297);
                pdf.save(`${ex.name}.pdf`);
            };
        }

        async function startScanner(id) {
            if(!isCvReady) return alert("جاري تحميل نظام الذكاء...");
            activeExamId = id; scanActive = true;
            document.getElementById('scanner-modal').classList.remove('hidden');
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: {ideal: 1280} } });
            document.getElementById('video').srcObject = stream;
            document.getElementById('video').play();
            requestAnimationFrame(scanLoop);
        }

        function stopScanner() {
            scanActive = false;
            const stream = document.getElementById('video').srcObject;
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('scanner-modal').classList.add('hidden');
        }

        function scanLoop() {
            if(!scanActive) return;
            const video = document.getElementById('video');
            const canvas = document.getElementById('proc-canvas');
            if(video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 400; canvas.height = 500;
                canvas.getContext('2d').drawImage(video, 0, 0, 400, 500);
                // Here would go the OpenCV detection logic...
                // Simulating discovery for now:
                document.getElementById('viewfinder').classList.toggle('active', Math.random() > 0.8);
            }
            requestAnimationFrame(scanLoop);
        }

        function renderHistory() {
            const container = document.getElementById('tab-history'); 
            container.innerHTML = `<div class="flex justify-between items-center mb-6"><h3 class="text-xl font-black text-slate-800">النتائج المسجلة</h3><button onclick="clearHistory()" class="text-xs text-red-500 font-bold">مسح الكل</button></div>`;
            if(db.results.length === 0) container.innerHTML += `<div class="py-20 text-center text-slate-400">لا توجد نتائج مسجلة حتى الآن.</div>`;
            db.results.slice().reverse().forEach(res => {
                const div = document.createElement('div');
                div.className = "bg-white p-5 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm";
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center text-slate-400"><i class="fa-solid fa-user text-xs"></i></div>
                        <div><p class="font-bold text-slate-800">${res.examName}</p><p class="text-[9px] text-slate-400 font-bold uppercase">${res.date}</p></div>
                    </div>
                    <div class="text-right">
                        <p class="text-xl font-black text-indigo-600">${res.score}/${res.total}</p>
                        <p class="text-[9px] text-slate-400 font-black uppercase">الدرجة</p>
                    </div>`;
                container.appendChild(div);
            });
        }

        function clearHistory() {
            if(confirm("مسح جميع النتائج؟")) {
                db.results = [];
                localStorage.setItem('sm_v4_results', JSON.stringify(db.results));
                renderHistory();
            }
        }

        window.onload = () => switchTab('exams');
    </script>
</body>
</html>
