<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartGrader PRO - Ultimate Edition</title>
    
    <!-- المكاتب البرمجية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script async src="https://docs.opencv.org/4.5.4/opencv.js" onload="cvReadyTrigger()"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; overflow-x: hidden; }
        [x-cloak] { display: none !important; }
        .active-tab { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border-top-color: #3b82f6; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900" x-data="smartGrader()" x-init="init()">

    <!-- Loading Screen -->
    <div x-show="!cvLoaded" class="fixed inset-0 bg-white z-[200] flex flex-col items-center justify-center text-center">
        <div class="loader w-12 h-12 border-4 border-slate-200 rounded-full mb-4"></div>
        <h2 class="text-lg font-bold text-blue-600">SmartGrader Engine...</h2>
    </div>

    <!-- Top Navbar -->
    <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-md border-b border-slate-200 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-xl flex items-center justify-center text-white font-bold shadow-lg shadow-blue-200">S</div>
                <span class="font-bold text-xl tracking-tight hidden md:block text-slate-800">SmartGrader <span class="text-blue-600">PRO</span></span>
            </div>

            <div class="flex items-center gap-3">
                <!-- Language Toggle -->
                <select x-model="lang" @change="changeLang()" class="text-xs border border-slate-200 rounded-xl p-2 bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                </select>

                <!-- Data Actions -->
                <div class="relative" x-data="{ open: false }">
                    <button @click="open = !open" class="p-2 bg-slate-100 rounded-xl hover:bg-slate-200 transition">
                        <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                    </button>
                    <div x-show="open" @click.outside="open = false" x-cloak class="absolute left-0 mt-2 w-48 bg-white shadow-2xl rounded-2xl border border-slate-100 p-2 z-[60]">
                        <button @click="exportData(); open=false" class="w-full text-right p-3 hover:bg-blue-50 hover:text-blue-600 rounded-xl flex items-center gap-3 text-sm transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            <span x-text="t('export')"></span>
                        </button>
                        <label class="w-full text-right p-3 hover:bg-blue-50 hover:text-blue-600 rounded-xl flex items-center gap-3 text-sm transition cursor-pointer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <span x-text="t('import')"></span>
                            <input type="file" @change="importData($event); open=false" class="hidden">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sidebar (Desktop) -->
    <aside class="fixed right-0 top-16 w-64 h-full bg-white border-l border-slate-100 hidden md:block z-40 transition-all">
        <div class="p-6 space-y-3">
            <template x-for="item in ['stats', 'create', 'correct', 'results']">
                <button @click="tab = item" 
                    :class="tab === item ? 'bg-blue-600 text-white shadow-lg shadow-blue-100' : 'text-slate-500 hover:bg-slate-50'"
                    class="w-full flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-sm">
                    <span x-text="t(item)"></span>
                </button>
            </template>
        </div>
    </aside>

    <!-- Mobile Navigation -->
    <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-100 z-50 md:hidden">
        <div class="flex justify-around items-center h-20">
            <template x-for="item in ['stats', 'create', 'correct', 'results']">
                <button @click="tab = item" :class="tab === item ? 'text-blue-600' : 'text-slate-400'" class="flex flex-col items-center gap-1 transition-colors">
                    <div :class="tab === item ? 'bg-blue-50 p-2 rounded-xl' : ''">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path x-show="item==='stats'" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                            <path x-show="item==='create'" d="M12 4v16m8-8H4"></path>
                            <path x-show="item==='correct'" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                            <path x-show="item==='results'" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                        </svg>
                    </div>
                    <span class="text-[10px] font-bold uppercase tracking-wider" x-text="t(item)"></span>
                </button>
            </template>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="md:mr-64 pt-24 pb-32 px-4 max-w-6xl mx-auto">

        <!-- TAB: STATISTICS -->
        <div x-show="tab === 'stats'" class="active-tab" x-cloak>
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <h1 class="text-3xl font-black text-slate-800" x-text="t('stats_title')"></h1>
                <select x-model="statFilter" @change="calculateStats()" class="p-3 border-none bg-white rounded-2xl shadow-sm w-full md:w-64 focus:ring-2 focus:ring-blue-500 font-bold text-sm">
                    <option value="all" x-text="t('all_classes')"></option>
                    <template x-for="cls in classes" :key="cls">
                        <option :value="cls" x-text="cls"></option>
                    </template>
                </select>
            </div>
            
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-50 flex flex-col items-center text-center">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </div>
                    <span class="text-slate-400 text-xs font-bold mb-1" x-text="t('total_exams')"></span>
                    <span class="text-3xl font-black text-slate-800" x-text="exams.length"></span>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-50 flex flex-col items-center text-center">
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mb-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <span class="text-slate-400 text-xs font-bold mb-1" x-text="t('total_results')"></span>
                    <span class="text-3xl font-black text-slate-800" x-text="results.length"></span>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-50 flex flex-col items-center text-center">
                    <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center mb-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                    </div>
                    <span class="text-slate-400 text-xs font-bold mb-1" x-text="t('avg_score')"></span>
                    <span class="text-3xl font-black text-slate-800" x-text="avgScore + '%'"></span>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-50 flex flex-col items-center text-center">
                    <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center mb-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-7.714 2.143L11 21l-2.286-6.857L1 12l7.714-2.143L11 3z"></path></svg>
                    </div>
                    <span class="text-slate-400 text-xs font-bold mb-1" x-text="t('mastery_a')"></span>
                    <span class="text-3xl font-black text-slate-800" x-text="masteryA + '%'"></span>
                </div>
            </div>

            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-50">
                <canvas id="mainChart" class="w-full max-h-[350px]"></canvas>
            </div>
        </div>

        <!-- TAB: CREATE EXAM -->
        <div x-show="tab === 'create'" class="active-tab" x-cloak>
            <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-50 overflow-hidden">
                <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-8 text-white">
                    <h2 class="text-2xl font-black mb-2" x-text="editingId ? t('edit_exam_title') : t('new_exam')"></h2>
                    <p class="text-blue-100 text-sm opacity-90" x-text="t('new_exam_desc')"></p>
                </div>
                
                <div class="p-8 space-y-8">
                    <div class="grid md:grid-cols-2 gap-8">
                        <div class="space-y-2">
                            <label class="block text-sm font-black text-slate-700 uppercase tracking-wide" x-text="t('exam_name')"></label>
                            <input type="text" x-model="examForm.title" class="w-full p-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all font-bold">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-black text-slate-700 uppercase tracking-wide" x-text="t('class_name')"></label>
                            <input type="text" x-model="examForm.className" class="w-full p-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all font-bold">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="space-y-2">
                            <label class="block text-xs font-black text-slate-500" x-text="t('q_count')"></label>
                            <input type="number" x-model.number="examForm.qCount" @change="initQuestions()" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-xs font-black text-slate-500" x-text="t('opt_count')"></label>
                            <select x-model.number="examForm.optCount" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold">
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="8">8</option>
                                <option value="12">12</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="block text-xs font-black text-slate-500" x-text="t('point_q')"></label>
                            <input type="number" step="0.5" x-model.number="examForm.pointsPerQ" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-xs font-black text-slate-500" x-text="t('partial')"></label>
                            <input type="number" step="0.25" x-model.number="examForm.partialPoints" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold">
                        </div>
                    </div>

                    <div class="pt-4">
                        <h3 class="font-black mb-6 flex items-center gap-3 text-slate-800">
                            <span class="w-8 h-8 bg-blue-600 text-white rounded-lg flex items-center justify-center text-xs">02</span>
                            <span x-text="t('answer_key')"></span>
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[400px] overflow-y-auto pr-4 custom-scrollbar">
                            <template x-for="(q, idx) in examForm.questions" :key="idx">
                                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-[1.5rem] border border-transparent hover:border-blue-200 transition-all group">
                                    <span class="font-black text-slate-300 group-hover:text-blue-500 transition-colors w-8" x-text="idx + 1"></span>
                                    <div class="flex flex-wrap gap-2 justify-end">
                                        <template x-for="opt in ['A','B','C','D','E','F','G','H','I','J','K','L'].slice(0, examForm.optCount)">
                                            <button @click="toggleAnswer(idx, opt)" 
                                                :class="q.correct.includes(opt) ? 'bg-blue-600 text-white scale-110 shadow-md' : 'bg-white text-slate-400 hover:bg-white'"
                                                class="w-10 h-10 rounded-xl border border-slate-100 font-black text-xs transition-all flex items-center justify-center"
                                                x-text="opt">
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button @click="saveExam()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-[1.5rem] shadow-xl shadow-blue-100 transition-all flex items-center justify-center gap-3">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
                            <span x-text="editingId ? t('update_exam') : t('save_continue')"></span>
                        </button>
                        <button x-show="editingId" @click="cancelEdit()" class="px-8 bg-slate-100 text-slate-500 font-bold rounded-[1.5rem] hover:bg-slate-200 transition-all" x-text="t('cancel')"></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB: CORRECT EXAM (Cards) -->
        <div x-show="tab === 'correct'" class="active-tab" x-cloak>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <template x-for="exam in exams" :key="exam.id">
                    <div class="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden hover:shadow-2xl hover:-translate-y-1 transition-all group">
                        <div class="p-8">
                            <div class="flex justify-between items-start mb-6">
                                <div class="space-y-1">
                                    <h3 class="text-2xl font-black text-slate-800" x-text="exam.title"></h3>
                                    <div class="flex items-center gap-2">
                                        <span class="bg-blue-50 text-blue-600 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest" x-text="exam.className"></span>
                                        <span class="text-slate-300 text-[10px] font-bold" x-text="new Date(exam.date).toLocaleDateString()"></span>
                                    </div>
                                </div>
                                <button @click="editExam(exam)" class="p-3 bg-slate-50 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-2xl transition-all" :title="t('edit')">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                </button>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-4 mb-8">
                                <div class="bg-slate-50 p-4 rounded-2xl">
                                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-tighter mb-1" x-text="t('questions')"></p>
                                    <p class="text-xl font-black text-slate-700" x-text="exam.qCount"></p>
                                </div>
                                <div class="bg-slate-50 p-4 rounded-2xl">
                                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-tighter mb-1" x-text="t('options')"></p>
                                    <p class="text-xl font-black text-slate-700" x-text="exam.optCount"></p>
                                </div>
                            </div>

                            <div class="flex flex-col gap-3">
                                <button @click="startScanner(exam)" class="w-full py-4 bg-blue-600 text-white font-black rounded-2xl shadow-lg shadow-blue-100 hover:bg-blue-700 transition-all flex items-center justify-center gap-3">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                                    <span x-text="t('start_grading')"></span>
                                </button>
                                <div class="grid grid-cols-2 gap-3">
                                    <button @click="downloadSheet(exam, 'pdf')" class="py-3 bg-slate-100 text-slate-600 text-xs font-black rounded-xl hover:bg-slate-200 transition-all flex items-center justify-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                        PDF
                                    </button>
                                    <button @click="downloadSheet(exam, 'png')" class="py-3 bg-slate-100 text-slate-600 text-xs font-black rounded-xl hover:bg-slate-200 transition-all flex items-center justify-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                        PNG
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- TAB: RESULTS -->
        <div x-show="tab === 'results'" class="active-tab" x-cloak>
            <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-50 overflow-hidden">
                <div class="p-8 border-b bg-slate-50/30 flex flex-wrap gap-6">
                    <div class="flex-1 min-w-[200px] space-y-2">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest" x-text="t('filter_class')"></label>
                        <select x-model="resFilterClass" class="w-full p-4 border-none bg-white shadow-sm rounded-2xl font-bold outline-none">
                            <option value="">-</option>
                            <template x-for="cls in classes" :key="cls">
                                <option :value="cls" x-text="cls"></option>
                            </template>
                        </select>
                    </div>
                    <div class="flex-1 min-w-[200px] space-y-2">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest" x-text="t('filter_exam')"></label>
                        <select x-model="resFilterExam" class="w-full p-4 border-none bg-white shadow-sm rounded-2xl font-bold outline-none">
                            <option value="">-</option>
                            <template x-for="ex in exams" :key="ex.id">
                                <option :value="ex.id" x-text="ex.title"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-slate-50/50 text-slate-400 font-black uppercase tracking-tighter">
                            <tr>
                                <th class="px-8 py-5" x-text="t('th_name')"></th>
                                <th class="px-8 py-5" x-text="t('th_score')"></th>
                                <th class="px-8 py-5" x-text="t('th_mastery')"></th>
                                <th class="px-8 py-5 text-center" x-text="t('th_actions')"></th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50">
                            <template x-for="res in filteredResults" :key="res.id">
                                <tr class="hover:bg-blue-50/30 transition-all">
                                    <td class="px-8 py-5">
                                        <div class="flex items-center gap-4">
                                            <img :src="res.nameImage" class="h-10 border-2 border-white rounded-lg shadow-sm bg-white" alt="Name">
                                        </div>
                                    </td>
                                    <td class="px-8 py-5">
                                        <span class="text-lg font-black text-slate-800" x-text="res.score"></span>
                                        <span class="text-slate-300 font-bold" x-text="' / ' + res.total"></span>
                                    </td>
                                    <td class="px-8 py-5">
                                        <button @click="showMastery(res)" :class="getMasteryColor(res.mastery)" class="px-4 py-1.5 rounded-full text-[10px] font-black shadow-sm" x-text="res.mastery"></button>
                                    </td>
                                    <td class="px-8 py-5 flex justify-center gap-3">
                                        <button @click="deleteResult(res.id)" class="p-3 text-red-400 hover:bg-red-50 hover:text-red-600 rounded-xl transition-all">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Scanner Overlay -->
    <div x-show="scanning" class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center" x-cloak>
        <video id="video" class="w-full h-full object-cover"></video>
        <canvas id="cvCanvas" class="hidden"></canvas>
        <div class="absolute inset-0 border-[50px] border-black/70 pointer-events-none flex items-center justify-center">
            <div class="w-full max-w-sm h-[70vh] border-2 border-dashed border-blue-500/50 rounded-[3rem] relative">
                <div class="absolute inset-x-0 top-1/2 h-px bg-blue-500/20 animate-pulse"></div>
            </div>
        </div>
        <div class="absolute bottom-12 flex gap-8 items-center">
            <button @click="stopScanner()" class="bg-white/10 backdrop-blur-xl p-5 rounded-full text-white hover:bg-white/20 transition-all font-black">✕</button>
            <button @click="processOMR()" class="w-24 h-24 bg-white rounded-full border-[10px] border-slate-300/50 shadow-2xl flex items-center justify-center active:scale-90 transition-all">
                <div class="w-14 h-14 bg-blue-600 rounded-full shadow-inner"></div>
            </button>
            <div class="w-14"></div>
        </div>
    </div>

    <!-- Mastery Modal -->
    <div x-show="showModal" class="fixed inset-0 z-[110] bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4" x-cloak>
        <div class="bg-white w-full max-w-2xl rounded-[3rem] overflow-hidden shadow-2xl">
            <div class="p-8 border-b flex justify-between items-center bg-slate-50/50">
                <h3 class="font-black text-xl text-slate-800" x-text="t('mastery_analysis')"></h3>
                <button @click="showModal = false" class="text-slate-400 hover:text-slate-900 font-black">✕</button>
            </div>
            <div class="p-8">
                <div class="mb-8 p-6 bg-slate-50 rounded-[2rem]">
                    <canvas id="radarChart" class="max-h-[300px] mx-auto"></canvas>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div class="p-6 bg-blue-50 rounded-[2rem] text-center">
                        <div class="text-[10px] text-blue-500 font-black uppercase tracking-widest mb-2" x-text="t('th_score')"></div>
                        <div class="text-4xl font-black text-blue-700" x-text="selectedRes?.score + ' / ' + selectedRes?.total"></div>
                    </div>
                    <div class="p-6 bg-purple-50 rounded-[2rem] text-center">
                        <div class="text-[10px] text-purple-500 font-black uppercase tracking-widest mb-2" x-text="t('th_mastery')"></div>
                        <div class="text-4xl font-black text-purple-700" x-text="selectedRes?.mastery"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Answer Sheet Template for PNG Export -->
    <div id="sheet-template" class="fixed -left-[2000px] top-0 bg-white p-10 w-[800px] text-slate-900" x-ref="sheet">
        <div class="border-4 border-slate-900 p-8 h-full relative">
            <!-- Anchor points for OMR -->
            <div class="absolute top-0 left-0 w-8 h-8 bg-black"></div>
            <div class="absolute top-0 right-0 w-8 h-8 bg-black"></div>
            <div class="absolute bottom-0 left-0 w-8 h-8 bg-black"></div>
            <div class="absolute bottom-0 right-0 w-8 h-8 bg-black"></div>

            <h1 class="text-4xl font-black text-center mb-2" x-text="activeExamForSheet?.title"></h1>
            <p class="text-center font-bold text-slate-500 mb-8" x-text="activeExamForSheet?.className"></p>
            
            <div class="border-2 border-slate-900 p-6 mb-10 h-20 flex items-center">
                <span class="font-black text-xl mr-4 uppercase">Full Name / الاسم الكامل :</span>
            </div>

            <div class="grid grid-cols-2 gap-x-12 gap-y-4">
                <template x-for="(q, i) in Array.from({length: activeExamForSheet?.qCount || 0})">
                    <div class="flex items-center gap-4 py-2 border-b border-slate-100">
                        <span class="font-black text-lg w-8" x-text="i + 1"></span>
                        <div class="flex gap-3">
                            <template x-for="o in ['A','B','C','D','E','F','G','H','I','J','K','L'].slice(0, activeExamForSheet?.optCount || 0)">
                                <div class="w-8 h-8 rounded-full border-2 border-slate-900 flex items-center justify-center font-black text-xs" x-text="o"></div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        function smartGrader() {
            return {
                tab: 'stats',
                lang: 'ar',
                cvLoaded: false,
                db: null,
                exams: [],
                results: [],
                classes: [],
                statFilter: 'all',
                avgScore: 0,
                masteryA: 0,
                examForm: { title: '', className: '', qCount: 20, optCount: 4, pointsPerQ: 1, partialPoints: 0.25, questions: [] },
                editingId: null,
                scanning: false,
                activeExam: null,
                activeExamForSheet: null,
                resFilterClass: '',
                resFilterExam: '',
                showModal: false,
                selectedRes: null,

                dict: {
                    ar: {
                        stats: 'الإحصائيات', create: 'إنشاء', correct: 'تصحيح', results: 'النتائج',
                        export: 'تصدير البيانات', import: 'استيراد البيانات', stats_title: 'تحليل الأداء العام',
                        all_classes: 'جميع الأقسام', total_exams: 'الامتحانات', total_results: 'المصححة',
                        avg_score: 'متوسط النقط', mastery_a: 'التفوق (A)', new_exam: 'إنشاء امتحان',
                        edit_exam_title: 'تعديل عناصر الإجابة', new_exam_desc: 'إعداد ورقة الإجابة ومفتاح التصحيح',
                        exam_name: 'عنوان الامتحان', class_name: 'القسم', q_count: 'الأسئلة',
                        opt_count: 'الخيارات', point_q: 'نقطة/سؤال', partial: 'نقطة جزئية',
                        answer_key: 'الأجوبة الصحيحة', save_continue: 'حفظ واستمرار', update_exam: 'تحديث البيانات',
                        cancel: 'إلغاء', questions: 'سؤال', options: 'خيارات', start_grading: 'تصحيح آلي',
                        edit: 'تعديل', filter_class: 'تصفية بالقسم', filter_exam: 'تصفية بالامتحان',
                        th_name: 'التلميذ', th_score: 'النتيجة', th_mastery: 'التحكم', th_actions: 'إجراءات',
                        mastery_analysis: 'تحليل مفصل للنتائج'
                    },
                    en: {
                        stats: 'Stats', create: 'Create', correct: 'Grading', results: 'Results',
                        export: 'Export', import: 'Import', stats_title: 'Overall Performance',
                        all_classes: 'All Classes', total_exams: 'Exams', total_results: 'Graded',
                        avg_score: 'Avg Score', mastery_a: 'Mastery (A)', new_exam: 'New Exam',
                        edit_exam_title: 'Edit Answer Key', new_exam_desc: 'Set answer key and criteria',
                        exam_name: 'Exam Title', class_name: 'Class', q_count: 'Questions',
                        opt_count: 'Options', point_q: 'Pts/Q', partial: 'Partial Pts',
                        answer_key: 'Correct Key', save_continue: 'Save & Continue', update_exam: 'Update Exam',
                        cancel: 'Cancel', questions: 'Q', options: 'Options', start_grading: 'Auto Grade',
                        edit: 'Edit', filter_class: 'Filter Class', filter_exam: 'Filter Exam',
                        th_name: 'Student', th_score: 'Score', th_mastery: 'Mastery', th_actions: 'Actions',
                        mastery_analysis: 'Detailed Analysis'
                    },
                    fr: {
                        stats: 'Stats', create: 'Créer', correct: 'Correction', results: 'Résultats',
                        export: 'Exporter', import: 'Importer', stats_title: 'Performance Globale',
                        all_classes: 'Toutes les Classes', total_exams: 'Examens', total_results: 'Corrigés',
                        avg_score: 'Moyenne', mastery_a: 'Maîtrise (A)', new_exam: 'Nouvel Examen',
                        edit_exam_title: 'Modifier Clé de Réponse', new_exam_desc: 'Définir les réponses et critères',
                        exam_name: 'Titre de l\'Examen', class_name: 'Classe', q_count: 'Questions',
                        opt_count: 'Options', point_q: 'Pts/Q', partial: 'Pts Partiel',
                        answer_key: 'Clé de Correction', save_continue: 'Enregistrer', update_exam: 'Mettre à jour',
                        cancel: 'Annuler', questions: 'Q', options: 'Options', start_grading: 'Correction Auto',
                        edit: 'Modifier', filter_class: 'Filtrer Classe', filter_exam: 'Filtrer Examen',
                        th_name: 'Élève', th_score: 'Note', th_mastery: 'Maîtrise', th_actions: 'Actions',
                        mastery_analysis: 'Analyse Détaillée'
                    }
                },

                t(key) { return this.dict[this.lang][key] || key; },

                async init() {
                    this.db = new Dexie("SmartGraderDB_v3");
                    this.db.version(1).stores({
                        exams: '++id, title, className, date',
                        results: '++id, examId, className, mastery'
                    });
                    await this.loadData();
                    this.initQuestions();
                    window.cvReadyTrigger = () => { this.cvLoaded = true; };
                },

                initQuestions() {
                    this.examForm.questions = Array.from({ length: this.examForm.qCount }, () => ({ correct: [] }));
                },

                toggleAnswer(idx, opt) {
                    const q = this.examForm.questions[idx];
                    if (q.correct.includes(opt)) {
                        q.correct = q.correct.filter(a => a !== opt);
                    } else {
                        q.correct.push(opt);
                    }
                },

                async loadData() {
                    this.exams = await this.db.exams.toArray();
                    this.results = await this.db.results.toArray();
                    this.classes = [...new Set(this.exams.map(e => e.className))];
                    this.calculateStats();
                },

                async saveExam() {
                    if (!this.examForm.title || !this.examForm.className) return alert("Fill all fields");
                    const data = JSON.parse(JSON.stringify(this.examForm));
                    data.date = new Date().toISOString();

                    if (this.editingId) {
                        await this.db.exams.update(this.editingId, data);
                        this.editingId = null;
                    } else {
                        await this.db.exams.add(data);
                    }

                    this.examForm = { title: '', className: '', qCount: 20, optCount: 4, pointsPerQ: 1, partialPoints: 0.25, questions: [] };
                    this.initQuestions();
                    await this.loadData();
                    this.tab = 'correct';
                },

                editExam(exam) {
                    this.editingId = exam.id;
                    this.examForm = JSON.parse(JSON.stringify(exam));
                    this.tab = 'create';
                },

                cancelEdit() {
                    this.editingId = null;
                    this.examForm = { title: '', className: '', qCount: 20, optCount: 4, pointsPerQ: 1, partialPoints: 0.25, questions: [] };
                    this.initQuestions();
                    this.tab = 'correct';
                },

                async openScanner(exam) {
                    this.activeExam = exam;
                    this.scanning = true;
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                        document.getElementById('video').srcObject = stream;
                        document.getElementById('video').play();
                    } catch (err) { alert("Camera Error"); this.scanning = false; }
                },

                stopScanner() {
                    const video = document.getElementById('video');
                    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                    this.scanning = false;
                },

                processOMR() {
                    const video = document.getElementById('video');
                    const canvas = document.getElementById('cvCanvas');
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);

                    // OMR Simulation Logic
                    let score = 0;
                    const total = this.activeExam.qCount * this.activeExam.pointsPerQ;
                    const details = [];
                    this.activeExam.questions.forEach(() => {
                        const correct = Math.random() > 0.4;
                        if (correct) score += this.activeExam.pointsPerQ;
                        details.push(correct);
                    });

                    const pct = (score / total) * 100;
                    let mastery = pct >= 85 ? 'A' : pct >= 70 ? 'B' : pct >= 50 ? 'C' : 'D';

                    this.db.results.add({
                        examId: this.activeExam.id, className: this.activeExam.className,
                        score, total, mastery, details,
                        nameImage: canvas.toDataURL('image/png', 0.5),
                        date: new Date().toISOString()
                    }).then(() => {
                        this.stopScanner(); this.loadData(); this.tab = 'results';
                    });
                },

                calculateStats() {
                    let data = this.statFilter === 'all' ? this.results : this.results.filter(r => r.className === this.statFilter);
                    if (!data.length) { this.avgScore = 0; this.masteryA = 0; this.updateChart([0,0,0,0]); return; }
                    this.avgScore = Math.round((data.reduce((acc, r) => acc + (r.score/r.total), 0) / data.length) * 100);
                    this.masteryA = Math.round((data.filter(r => r.mastery === 'A').length / data.length) * 100);
                    this.updateChart(['A','B','C','D'].map(m => data.filter(r => r.mastery === m).length));
                },

                updateChart(counts) {
                    const ctx = document.getElementById('mainChart'); if (!ctx) return;
                    if (window.mChart) window.mChart.destroy();
                    window.mChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['A', 'B', 'C', 'D'],
                            datasets: [{ data: counts, backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444'], borderRadius: 15 }]
                        },
                        options: { responsive: true, plugins: { legend: { display: false } } }
                    });
                },

                showMastery(res) {
                    this.selectedRes = res; this.showModal = true;
                    this.$nextTick(() => {
                        const ctx = document.getElementById('radarChart');
                        if (window.rChart) window.rChart.destroy();
                        window.rChart = new Chart(ctx, {
                            type: 'radar',
                            data: {
                                labels: res.details.map((_, i) => `Q${i+1}`),
                                datasets: [{ label: 'Control', data: res.details.map(d => d ? 1 : 0), backgroundColor: 'rgba(59, 130, 246, 0.2)', borderColor: '#3b82f6' }]
                            },
                            options: { scales: { r: { min: 0, max: 1, ticks: { stepSize: 1 } } } }
                        });
                    });
                },

                async downloadSheet(exam, format) {
                    this.activeExamForSheet = exam;
                    await this.$nextTick();
                    if (format === 'pdf') {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF();
                        doc.text(exam.title, 105, 20, { align: 'center' });
                        doc.save(`${exam.title}.pdf`);
                    } else {
                        html2canvas(this.$refs.sheet).then(canvas => {
                            const link = document.createElement('a');
                            link.download = `${exam.title}.png`;
                            link.href = canvas.toDataURL();
                            link.click();
                        });
                    }
                },

                exportData() {
                    Promise.all([this.db.exams.toArray(), this.db.results.toArray()]).then(([exams, results]) => {
                        const blob = new Blob([JSON.stringify({ exams, results })], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; a.download = `smartgrader_data.json`; a.click();
                    });
                },

                importData(ev) {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const data = JSON.parse(e.target.result);
                        await this.db.exams.bulkAdd(data.exams);
                        await this.db.results.bulkAdd(data.results);
                        this.loadData();
                    };
                    reader.readAsText(ev.target.files[0]);
                },

                getMasteryColor(m) {
                    const c = { 'A': 'bg-emerald-100 text-emerald-700', 'B': 'bg-blue-100 text-blue-700', 'C': 'bg-orange-100 text-orange-600', 'D': 'bg-red-100 text-red-700' };
                    return c[m] || 'bg-slate-100';
                },

                deleteResult(id) { if (confirm("Delete?")) this.db.results.delete(id).then(() => this.loadData()); },
                
                changeLang() { document.dir = this.lang === 'ar' ? 'rtl' : 'ltr'; this.calculateStats(); }
            }
        }
    </script>
</body>
</html>
