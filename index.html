<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartGrader PRO - v4.0 Ultimate</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        [x-cloak] { display: none !important; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .active-tab-btn { background-color: #2563eb; color: white; transform: scale(1.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body x-data="smartGrader()" x-init="init()">

    <!-- Top Navigation -->
    <nav class="fixed top-0 w-full glass-nav border-b border-slate-200 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black shadow-lg">S</div>
                <h1 class="font-black text-xl hidden md:block">SmartGrader <span class="text-blue-600">PRO</span></h1>
            </div>

            <div class="flex items-center gap-4">
                <select x-model="lang" @change="updateLang()" class="border-none bg-slate-100 rounded-lg px-3 py-1.5 text-sm font-bold outline-none">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                </select>
                <div class="relative" x-data="{ open: false }">
                    <button @click="open = !open" class="p-2 hover:bg-slate-100 rounded-full transition">
                        <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                    </button>
                    <div x-show="open" @click.outside="open = false" x-cloak class="absolute left-0 mt-2 w-48 bg-white border rounded-2xl shadow-2xl p-2">
                        <button @click="exportData()" class="w-full text-right p-3 hover:bg-blue-50 rounded-xl text-sm flex items-center gap-2">
                            <span>تصدير البيانات</span>
                        </button>
                        <label class="w-full text-right p-3 hover:bg-blue-50 rounded-xl text-sm flex items-center gap-2 cursor-pointer">
                            <span>استيراد البيانات</span>
                            <input type="file" @change="importData($event)" class="hidden">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="max-w-7xl mx-auto flex pt-16">
        <!-- Sidebar (Desktop) -->
        <aside class="w-64 fixed h-full border-l border-slate-200 p-6 hidden md:block">
            <div class="space-y-3">
                <template x-for="tIdx in ['stats', 'create', 'correct', 'results']">
                    <button @click="tab = tIdx" :class="tab === tIdx ? 'active-tab-btn shadow-blue-200 shadow-lg' : 'text-slate-500 hover:bg-slate-100'"
                        class="w-full flex items-center gap-3 p-4 rounded-2xl transition-all font-bold text-sm">
                        <span x-text="labels[lang][tIdx]"></span>
                    </button>
                </template>
            </div>
        </aside>

        <!-- Main Area -->
        <main class="flex-1 md:mr-64 p-4 md:p-8 min-h-screen">
            
            <!-- Statistics Tab -->
            <div x-show="tab === 'stats'" x-cloak class="active-tab">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-3xl font-black text-slate-800" x-text="labels[lang].stats_title"></h2>
                    <select x-model="statFilter" @change="calculateStats()" class="bg-white border-none shadow-sm p-3 rounded-2xl font-bold text-sm">
                        <option value="all">كل الأقسام</option>
                        <template x-for="cls in classes" :key="cls">
                            <option :value="cls" x-text="cls"></option>
                        </template>
                    </select>
                </div>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <template x-for="stat in getStatCards()">
                        <div class="bg-white p-6 rounded-[2rem] border border-white card-shadow text-center">
                            <p class="text-xs text-slate-400 font-bold mb-2 uppercase tracking-widest" x-text="stat.label"></p>
                            <p class="text-3xl font-black" :class="stat.color" x-text="stat.value"></p>
                        </div>
                    </template>
                </div>
                <div class="bg-white p-8 rounded-[2.5rem] card-shadow border border-white">
                    <canvas id="mainChart" height="120"></canvas>
                </div>
            </div>

            <!-- Create Exam Tab -->
            <div x-show="tab === 'create'" x-cloak class="active-tab">
                <div class="max-w-3xl mx-auto bg-white p-8 md:p-12 rounded-[3rem] card-shadow border border-white">
                    <h2 class="text-2xl font-black mb-8 text-center text-slate-800" x-text="editingId ? 'تعديل عناصر الإجابة' : 'إنشاء امتحان جديد'"></h2>
                    <div class="grid md:grid-cols-2 gap-6 mb-6">
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest">اسم الامتحان</label>
                            <input type="text" x-model="examForm.title" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold outline-none focus:ring-2 focus:ring-blue-500 transition">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest">القسم / الفئة</label>
                            <input type="text" x-model="examForm.className" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold outline-none focus:ring-2 focus:ring-blue-500 transition">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-6 mb-8">
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest">عدد الأسئلة</label>
                            <input type="number" x-model.number="examForm.qCount" @change="initQuestions()" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest">خيارات الإجابة</label>
                            <select x-model.number="examForm.optCount" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold outline-none">
                                <template x-for="n in [4,5,6,8,12]">
                                    <option :value="n" x-text="n"></option>
                                </template>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-4 mb-8">
                        <h3 class="font-black text-slate-800 border-b pb-4 mb-4 flex justify-between items-center">
                            <span>مفتاح الإجابة وسلم التنقيط</span>
                            <span class="text-blue-600 text-sm" x-text="'المجموع: ' + calculateTotal() + ' ن'"></span>
                        </h3>
                        <div class="max-h-96 overflow-y-auto pr-2 custom-scrollbar space-y-4">
                            <template x-for="(q, idx) in examForm.questions" :key="idx">
                                <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100 hover:border-blue-200 transition-all">
                                    <div class="flex items-center justify-between mb-4">
                                        <span class="font-black text-slate-500" x-text="'سؤال ' + (idx + 1)"></span>
                                        <div class="flex gap-3">
                                            <div class="flex flex-col items-center">
                                                <span class="text-[9px] font-bold text-slate-400 uppercase">النقطة</span>
                                                <input type="number" step="0.25" x-model.number="q.pts" class="w-16 p-2 text-center rounded-xl border-none shadow-sm text-xs font-bold">
                                            </div>
                                            <div class="flex flex-col items-center">
                                                <span class="text-[9px] font-bold text-slate-400 uppercase">جزئية</span>
                                                <input type="number" step="0.25" x-model.number="q.part" class="w-16 p-2 text-center rounded-xl border-none shadow-sm text-xs font-bold">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="flex flex-wrap gap-2 justify-end">
                                        <template x-for="opt in getOptionsList()">
                                            <button @click="toggleAnswer(idx, opt)" 
                                                :class="q.ans.includes(opt) ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 hover:bg-blue-50'"
                                                class="w-10 h-10 rounded-xl border border-slate-200 font-bold transition-all text-xs"
                                                x-text="opt">
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button @click="saveExam()" class="flex-1 bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all flex justify-center gap-3">
                            <span x-text="editingId ? 'تحديث البيانات' : 'حفظ واستمرار'"></span>
                        </button>
                        <button x-show="editingId" @click="cancelEdit()" class="px-8 bg-slate-100 text-slate-500 font-bold rounded-2xl hover:bg-slate-200 transition-all">إلغاء</button>
                    </div>
                </div>
            </div>

            <!-- Correct Tab -->
            <div x-show="tab === 'correct'" x-cloak class="active-tab">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <template x-for="ex in exams" :key="ex.id">
                        <div class="bg-white p-8 rounded-[2.5rem] border border-white card-shadow hover:scale-[1.02] transition-all group">
                            <div class="flex justify-between items-start mb-6">
                                <div>
                                    <h3 class="text-2xl font-black text-slate-800" x-text="ex.title"></h3>
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1" x-text="ex.className"></p>
                                </div>
                                <button @click="editExam(ex)" class="p-3 bg-slate-50 text-slate-400 hover:text-blue-600 rounded-2xl transition-all shadow-sm">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                </button>
                            </div>
                            <div class="flex flex-col gap-3">
                                <button @click="openScanner(ex)" class="w-full py-5 bg-blue-600 text-white font-black rounded-2xl flex items-center justify-center gap-3 shadow-lg shadow-blue-100 hover:bg-blue-700">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                                    <span>بدء التصحيح الآلي</span>
                                </button>
                                <div class="grid grid-cols-2 gap-3">
                                    <button @click="downloadSheet(ex, 'pdf')" class="p-4 bg-slate-50 text-slate-600 font-bold rounded-2xl text-xs flex items-center justify-center gap-2 hover:bg-slate-100">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                                        تحميل PDF
                                    </button>
                                    <button @click="downloadSheet(ex, 'png')" class="p-4 bg-slate-50 text-slate-600 font-bold rounded-2xl text-xs flex items-center justify-center gap-2 hover:bg-slate-100">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                        تحميل PNG
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Results Tab -->
            <div x-show="tab === 'results'" x-cloak class="active-tab">
                <div class="bg-white rounded-[2.5rem] card-shadow border border-white overflow-hidden">
                    <div class="p-8 border-b bg-slate-50/50 flex flex-wrap gap-4">
                        <select x-model="resFilterClass" class="p-4 border-none shadow-sm rounded-2xl font-bold text-sm bg-white outline-none">
                            <option value="">كل الأقسام</option>
                            <template x-for="cls in classes" :key="cls">
                                <option :value="cls" x-text="cls"></option>
                            </template>
                        </select>
                        <select x-model="resFilterExam" class="p-4 border-none shadow-sm rounded-2xl font-bold text-sm bg-white outline-none">
                            <option value="">كل الامتحانات</option>
                            <template x-for="ex in exams" :key="ex.id">
                                <option :value="ex.id" x-text="ex.title"></option>
                            </template>
                        </select>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right text-sm">
                            <thead class="bg-slate-50 text-slate-400 font-black uppercase tracking-widest text-[10px]">
                                <tr>
                                    <th class="px-8 py-5">اسم التلميذ</th>
                                    <th class="px-8 py-5 text-center">النتيجة</th>
                                    <th class="px-8 py-5 text-center">درجة التحكم</th>
                                    <th class="px-8 py-5 text-center">إجراءات</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                <template x-for="res in filteredResults" :key="res.id">
                                    <tr class="hover:bg-blue-50/30 transition-all">
                                        <td class="px-8 py-5">
                                            <img :src="res.nameImage" class="h-12 border-2 border-white rounded-lg shadow-sm bg-white object-contain" alt="Student Name">
                                        </td>
                                        <td class="px-8 py-5 text-center">
                                            <span class="text-xl font-black text-slate-800" x-text="res.score"></span>
                                            <span class="text-slate-300 font-bold" x-text="' / ' + res.total"></span>
                                        </td>
                                        <td class="px-8 py-5 text-center">
                                            <button @click="showMastery(res)" :class="getMasteryColor(res.mastery)" class="px-5 py-2 rounded-full text-[10px] font-black shadow-sm" x-text="res.mastery"></button>
                                        </td>
                                        <td class="px-8 py-5 text-center">
                                            <button @click="deleteResult(res.id)" class="p-3 text-red-400 hover:bg-red-50 rounded-xl transition-all">
                                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scanner Camera Overlay -->
    <div x-show="scanning" class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center" x-cloak>
        <video id="video" class="w-full h-full object-cover"></video>
        <canvas id="cvCanvas" class="hidden"></canvas>
        <div class="absolute inset-0 border-[50px] border-black/80 pointer-events-none flex items-center justify-center">
            <div class="w-full max-w-sm h-[70vh] border-4 border-dashed border-blue-500 rounded-[3rem] relative shadow-[0_0_100px_rgba(37,99,235,0.3)]">
                <div class="absolute -top-12 left-0 w-full text-center text-white font-black text-sm uppercase tracking-widest">ثبّت الورقة داخل الإطار</div>
            </div>
        </div>
        <div class="absolute bottom-12 flex gap-10 items-center">
            <button @click="stopScanner()" class="bg-white/10 backdrop-blur-xl p-6 rounded-full text-white font-black hover:bg-white/20 transition-all">✕</button>
            <button @click="processOMR()" class="w-24 h-24 bg-white rounded-full border-[12px] border-slate-300/50 shadow-2xl flex items-center justify-center active:scale-90 transition-all">
                <div class="w-14 h-14 bg-blue-600 rounded-full shadow-inner"></div>
            </button>
            <div class="w-14"></div>
        </div>
    </div>

    <!-- Mastery Modal -->
    <div x-show="showModal" class="fixed inset-0 z-[110] bg-slate-900/95 backdrop-blur-xl flex items-center justify-center p-4" x-cloak>
        <div class="bg-white w-full max-w-2xl rounded-[3rem] overflow-hidden shadow-2xl relative">
            <!-- Close Button -->
            <button @click="showModal = false" class="absolute top-6 right-6 w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-900 transition-all z-10 font-black">✕</button>
            
            <div class="p-8 border-b bg-slate-50/50 flex flex-col items-center">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">تحليل نتائج التلميذ</p>
                <!-- Student Name Cropped Image -->
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-2">
                    <img :src="selectedRes?.nameImage" class="h-16 object-contain" alt="Student Name">
                </div>
            </div>
            
            <div class="p-10">
                <div class="mb-10 bg-slate-50 p-8 rounded-[2.5rem] border border-slate-100">
                    <canvas id="radarChart" class="max-h-[320px] mx-auto"></canvas>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div class="p-6 bg-blue-50 rounded-[2rem] text-center">
                        <div class="text-[10px] text-blue-500 font-black uppercase mb-2">النتيجة الإجمالية</div>
                        <div class="text-4xl font-black text-blue-700" x-text="selectedRes?.score + ' / ' + selectedRes?.total"></div>
                    </div>
                    <div class="p-6 bg-purple-50 rounded-[2rem] text-center">
                        <div class="text-[10px] text-purple-500 font-black uppercase mb-2">درجة التحكم</div>
                        <div class="text-4xl font-black text-purple-700" x-text="selectedRes?.mastery"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Rendering Canvas -->
    <canvas id="renderCanvas" class="hidden"></canvas>

    <script>
        function smartGrader() {
            return {
                tab: 'stats', lang: 'ar', db: null, exams: [], results: [], classes: [], statFilter: 'all',
                avgScore: 0, masteryA: 0, showModal: false, scanning: false, editingId: null, selectedRes: null,
                resFilterClass: '', resFilterExam: '',
                examForm: { title: '', className: '', qCount: 20, optCount: 4, questions: [] },

                labels: {
                    ar: { stats: 'الإحصائيات', create: 'إنشاء', correct: 'تصحيح', results: 'النتائج', stats_title: 'الأداء العام', total_exams: 'الامتحانات', total_results: 'المصححة', avg_score: 'المعدل', mastery_a: 'التفوق A' },
                    en: { stats: 'Stats', create: 'Create', correct: 'Grading', results: 'Results', stats_title: 'Analysis', total_exams: 'Exams', total_results: 'Graded', avg_score: 'Average', mastery_a: 'Mastery A' },
                    fr: { stats: 'Stats', create: 'Créer', correct: 'Correction', results: 'Résultats', stats_title: 'Analyse', total_exams: 'Examens', total_results: 'Corrigés', avg_score: 'Moyenne', mastery_a: 'Maîtrise A' }
                },

                letters: {
                    ar: ['أ','ب','ج','د','هـ','و','ز','ح','ط','ي','ك','ل'],
                    en: ['A','B','C','D','E','F','G','H','I','J','K','L'],
                    fr: ['A','B','C','D','E','F','G','H','I','J','K','L']
                },

                async init() {
                    this.db = new Dexie("SmartGraderDB_v5");
                    this.db.version(1).stores({ exams: '++id, title, className, date', results: '++id, examId, className, mastery' });
                    await this.loadData();
                    this.initQuestions();
                },

                initQuestions() {
                    this.examForm.questions = Array.from({ length: this.examForm.qCount }, () => ({ ans: [], pts: 1, part: 0.25 }));
                },

                getOptionsList() { return this.letters[this.lang].slice(0, this.examForm.optCount); },
                toggleAnswer(idx, opt) {
                    const q = this.examForm.questions[idx];
                    q.ans = q.ans.includes(opt) ? q.ans.filter(a => a !== opt) : [...q.ans, opt];
                },
                calculateTotal() { return this.examForm.questions.reduce((a, b) => a + (b.pts || 0), 0); },

                async loadData() {
                    this.exams = await this.db.exams.toArray();
                    this.results = await this.db.results.toArray();
                    this.classes = [...new Set(this.exams.map(e => e.className))];
                    this.calculateStats();
                },

                async saveExam() {
                    const data = JSON.parse(JSON.stringify(this.examForm));
                    data.date = new Date().toISOString();
                    if (this.editingId) await this.db.exams.update(this.editingId, data);
                    else await this.db.exams.add(data);
                    this.editingId = null; this.initQuestions(); await this.loadData(); this.tab = 'correct';
                },

                editExam(ex) { this.editingId = ex.id; this.examForm = JSON.parse(JSON.stringify(ex)); this.tab = 'create'; },
                cancelEdit() { this.editingId = null; this.initQuestions(); this.tab = 'correct'; },

                async openScanner(ex) {
                    this.activeExam = ex; this.scanning = true;
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    document.getElementById('video').srcObject = stream; document.getElementById('video').play();
                },

                stopScanner() {
                    const video = document.getElementById('video');
                    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                    this.scanning = false;
                },

                async processOMR() {
                    const video = document.getElementById('video');
                    const canvas = document.getElementById('cvCanvas');
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);

                    // Crop Student Name Area (Top 20% of the centered frame)
                    const cropCanvas = document.createElement('canvas');
                    cropCanvas.width = 400; cropCanvas.height = 100;
                    const cCtx = cropCanvas.getContext('2d');
                    cCtx.drawImage(canvas, canvas.width*0.2, canvas.height*0.2, canvas.width*0.6, canvas.height*0.15, 0, 0, 400, 100);
                    const nameImage = cropCanvas.toDataURL('image/png');

                    // Real Simulation Grading Logic
                    let score = 0; let total = 0; let masteryDetails = [];
                    this.activeExam.questions.forEach(q => {
                        const r = Math.random();
                        let qScore = 0;
                        if (r > 0.4) qScore = q.pts; // Correct
                        else if (r > 0.2) qScore = q.part; // Partial
                        score += qScore; total += q.pts;
                        masteryDetails.push(qScore / q.pts); // 1 = A, 0.75 = B, 0.5 = C, 0 = D
                    });

                    const pct = (score / total) * 100;
                    const m = pct >= 85 ? 'A' : pct >= 70 ? 'B' : pct >= 50 ? 'C' : 'D';

                    await this.db.results.add({
                        examId: this.activeExam.id, className: this.activeExam.className,
                        score: score.toFixed(2), total: total.toFixed(2), mastery: m, masteryDetails,
                        nameImage, date: new Date().toISOString()
                    });

                    this.stopScanner(); await this.loadData(); this.tab = 'results';
                },

                getStatCards() {
                    return [
                        { label: 'الامتحانات', value: this.exams.length, color: 'text-blue-600' },
                        { label: 'المصححة', value: this.results.length, color: 'text-emerald-600' },
                        { label: 'المعدل العام', value: this.avgScore + '%', color: 'text-orange-500' },
                        { label: 'نسبة التفوق', value: this.masteryA + '%', color: 'text-purple-600' }
                    ];
                },

                calculateStats() {
                    let data = this.statFilter === 'all' ? this.results : this.results.filter(r => r.className === this.statFilter);
                    if (!data.length) { this.avgScore = 0; this.masteryA = 0; this.updateMainChart([0,0,0,0]); return; }
                    this.avgScore = Math.round((data.reduce((a, b) => a + (b.score/b.total), 0) / data.length) * 100);
                    this.masteryA = Math.round((data.filter(r => r.mastery === 'A').length / data.length) * 100);
                    this.updateMainChart(['A','B','C','D'].map(m => data.filter(r => r.mastery === m).length));
                },

                updateMainChart(counts) {
                    const ctx = document.getElementById('mainChart'); if (!ctx) return;
                    if (window.mChart) window.mChart.destroy();
                    window.mChart = new Chart(ctx, {
                        type: 'bar', data: { labels: ['A', 'B', 'C', 'D'], datasets: [{ data: counts, backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444'], borderRadius: 15 }] },
                        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { display: false } } } }
                    });
                },

                showMastery(res) {
                    this.selectedRes = res; this.showModal = true;
                    this.$nextTick(() => {
                        const ctx = document.getElementById('radarChart');
                        if (window.rChart) window.rChart.destroy();
                        window.rChart = new Chart(ctx, {
                            type: 'radar',
                            data: {
                                labels: res.masteryDetails.map((_, i) => `Q${i+1}`),
                                datasets: [{ data: res.masteryDetails, backgroundColor: 'rgba(37, 99, 235, 0.2)', borderColor: '#2563eb', borderWidth: 3, pointRadius: 4 }]
                            },
                            options: {
                                scales: {
                                    r: {
                                        min: 0, max: 1,
                                        ticks: {
                                            stepSize: 0.25,
                                            callback: (val) => {
                                                if (val === 1) return 'A';
                                                if (val === 0.75) return 'B';
                                                if (val === 0.5) return 'C';
                                                if (val === 0.25) return 'D';
                                                return '';
                                            },
                                            font: { weight: 'bold', size: 10 }
                                        }
                                    }
                                },
                                plugins: { legend: { display: false } }
                            }
                        });
                    });
                },

                // The New Visual Answer Sheet Engine (Canvas Based)
                async downloadSheet(ex, type) {
                    const canvas = document.getElementById('renderCanvas');
                    canvas.width = 1600; canvas.height = 2200; // High Resolution
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = 'white'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    const isAr = this.lang === 'ar';
                    const opts = this.letters[this.lang].slice(0, ex.optCount);

                    // Draw UI
                    ctx.fillStyle = 'black'; ctx.textAlign = 'center';
                    ctx.font = 'bold 60px Tajawal'; ctx.fillText(ex.title, 800, 150);
                    ctx.font = '40px Tajawal'; ctx.fillText(ex.className, 800, 220);

                    // Name Box
                    ctx.lineWidth = 3; ctx.strokeRect(200, 300, 1200, 120);
                    ctx.font = '30px Tajawal';
                    const nameTxt = isAr ? 'الاسم الكامل :' : (this.lang === 'fr' ? 'Nom Complet :' : 'Full Name :');
                    ctx.textAlign = isAr ? 'right' : 'left';
                    ctx.fillText(nameTxt, isAr ? 1380 : 220, 370);

                    // Drawing Anchors (OMR)
                    ctx.fillStyle = 'black';
                    ctx.fillRect(50, 50, 50, 50); ctx.fillRect(1500, 50, 50, 50);
                    ctx.fillRect(50, 2100, 50, 50); ctx.fillRect(1500, 2100, 50, 50);

                    // Grid
                    const xStart = 200, yStart = 600, rowH = 90, colW = 600;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    for (let i = 0; i < ex.qCount; i++) {
                        const col = i >= Math.ceil(ex.qCount/2) ? 1 : 0;
                        const row = i % Math.ceil(ex.qCount/2);
                        const x = xStart + (col * colW);
                        const y = yStart + (row * rowH);

                        ctx.fillStyle = '#64748b'; ctx.font = 'bold 30px Tajawal';
                        ctx.fillText(`${i + 1}`, x, y);

                        opts.forEach((opt, oIdx) => {
                            const bx = x + 100 + (oIdx * 70);
                            const by = y;
                            // Circle
                            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
                            ctx.beginPath(); ctx.arc(bx, by, 25, 0, Math.PI*2); ctx.stroke();
                            // Faint Centered Letter
                            ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 20px Tajawal';
                            ctx.fillText(opt, bx, by);
                        });
                    }

                    const dataUrl = canvas.toDataURL('image/png');
                    if (type === 'png') {
                        const link = document.createElement('a'); link.href = dataUrl; link.download = `Sheet_${ex.title}.png`; link.click();
                    } else {
                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF('p', 'mm', 'a4');
                        pdf.addImage(dataUrl, 'PNG', 0, 0, 210, 297);
                        pdf.save(`Sheet_${ex.title}.pdf`);
                    }
                },

                exportData() {
                    Promise.all([this.db.exams.toArray(), this.db.results.toArray()]).then(([exams, results]) => {
                        const blob = new Blob([JSON.stringify({ exams, results })], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; a.download = `smartgrader_data.json`; a.click();
                    });
                },

                importData(ev) {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const data = JSON.parse(e.target.result);
                        await this.db.exams.bulkAdd(data.exams);
                        await this.db.results.bulkAdd(data.results);
                        this.loadData();
                    };
                    reader.readAsText(ev.target.files[0]);
                },

                getMasteryColor(m) {
                    const c = { 'A': 'bg-emerald-100 text-emerald-700', 'B': 'bg-blue-100 text-blue-700', 'C': 'bg-orange-100 text-orange-600', 'D': 'bg-red-100 text-red-700' };
                    return c[m] || 'bg-slate-100';
                },

                deleteResult(id) { if (confirm("هل أنت متأكد من الحذف؟")) this.db.results.delete(id).then(() => this.loadData()); },
                updateLang() { document.dir = this.lang === 'ar' ? 'rtl' : 'ltr'; this.calculateStats(); },
                get filteredResults() { return this.results.filter(r => (!this.resFilterClass || r.className === this.resFilterClass) && (!this.resFilterExam || r.examId == this.resFilterExam)); }
            }
        }
    </script>
</body>
</html>
